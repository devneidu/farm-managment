$kind: http-request
description: |-
  **WHAT IT DOES**
  Languages the API can serve, with `enabled` and the platform default. Public; rate limited (60/min).

  **WHEN TO USE IT**
  Building the language picker (offer only `available` languages).

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Only English (`en`) is `available` in V1. Hausa (`ha`) and Yoruba (`yo`) are listed with `available: false` and a `status` such as `pending_terminology_review`; offer only `available` ones. More languages appear without an API change.

  **WHAT TO DO NEXT**
  Load `GET /translations/{locale}`.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Public** — no session required.

  **ACCESS**
  Everyone.
  Rate limited by limiter `60,1`: 60 per minute (`429 too_many_requests` + `Retry-After`).

  **URL**
  `GET {{base_url}}/locales`

  **BUSINESS RULES**
  - Only English (`en`) is `available` in V1. Hausa (`ha`) and Yoruba (`yo`) are listed with `available: false` and a `status` such as `pending_terminology_review`; offer only `available` ones. More languages appear without an API change.

  **SUCCESS**
  `200 OK`

  `data` fields: `default`, `fallback`, `locales`, `number_input`.

  **ERRORS**
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/locales"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/List supported languages.resources/examples
order: 3000
