$kind: http-request
description: |-
  **IN THIS FLOW**
  Terminal reports cannot change.
url: "{{base_url}}/platform-admin/marketplace/reports/content/{{report_a_id}}/transition"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "in_review",
      "reason": "Trying to reopen."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", function () { pm.expect(pm.response.code).to.be.oneOf([409]); });
      pm.test("invalid_report_state", () => pm.expect(pm.response.json().code).to.eql("invalid_report_state"));
    language: text/javascript
order: 21000
