$kind: http-request
description: |-
  **IN THIS FLOW**
  `meta.unread_count` is 0.

  **WHAT IT DOES**
  After read-all, `meta.unread_count` is 0 and the unread list is empty.

  **WHEN TO USE IT**
  Re-reading the unread count.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Read-only: no side effects.

  **FRONTEND NOTES**
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **ACCESS**
  Any active farm member (no specific permission). The response is filtered by the caller's own permissions.

  **URL**
  `GET {{base_url}}/notifications`

  Full reference (all fields, errors, rules): folder **20 — Notifications** -> "Verify the unread count".

  Full reference (errors, all fields): folder **20 — Notifications** -> "Verify the unread count".
url: "{{base_url}}/notifications?unread=1"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: unread
    value: "1"
  - key: type
    value: ""
    disabled: true
    description: string — max 40 chars
  - key: severity
    value: ""
    disabled: true
    description: "enum: critical | warning | info"
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/4. Verify the unread count.resources/examples
order: 4000
