$kind: http-example
name: 200 OK — Notification marked as read.
request:
  url: "{{base_url}}/notifications/{{notification_id}}/read"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
