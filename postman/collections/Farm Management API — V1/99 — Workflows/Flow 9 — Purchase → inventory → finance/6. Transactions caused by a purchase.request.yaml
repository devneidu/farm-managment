$kind: http-request
description: |-
  **IN THIS FLOW**
  The single expense linked to the purchase.

  **WHAT IT DOES**
  Verify the financial effect of a purchase: the single expense linked to it.

  **WHEN TO USE IT**
  Checking the expense a purchase created.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `finance.view` (taken from the current farm context; never sent by the client).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Record a purchase without booking the expense**.

  **FRONTEND NOTES**
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **ACCESS**
  Required backend farm permission: **`finance.view`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/finance/transactions`

  Full reference (all fields, errors, rules): folder **16 — Finance** -> "Transactions caused by a purchase".

  Full reference (errors, all fields): folder **16 — Finance** -> "Transactions caused by a purchase".
url: "{{base_url}}/finance/transactions?source_type=purchase&source_id={{purchase_id}}"
method: GET
