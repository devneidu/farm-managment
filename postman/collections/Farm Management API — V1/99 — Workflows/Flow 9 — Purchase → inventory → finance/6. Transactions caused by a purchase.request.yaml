  - key: entry_type
    value: ""
    disabled: true
    description: "enum: entry | reversal"
  - key: finance_category_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: contact_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: production_cycle_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: from
    value: ""
    disabled: true
    description: string (date)
  - key: to
    value: ""
    disabled: true
