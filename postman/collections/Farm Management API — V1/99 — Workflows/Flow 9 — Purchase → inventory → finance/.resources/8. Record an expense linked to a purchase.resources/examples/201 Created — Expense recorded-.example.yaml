$kind: http-example
name: 201 Created — Expense recorded.
request:
  url: "{{base_url}}/expenses"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "amount": "3500.00",
        "occurred_on": "{{today}}",
        "source": {
          "type": "purchase",
          "id": "{{purchase_b_id}}"
        },
        "idempotency_key": "{{$guid}}"
      }
