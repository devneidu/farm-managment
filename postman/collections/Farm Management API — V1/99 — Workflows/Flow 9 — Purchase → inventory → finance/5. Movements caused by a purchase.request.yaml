$kind: http-request
description: |-
  **IN THIS FLOW**
  The stock-in movement caused by the purchase.

  **WHAT IT DOES**
  Verify the stock effect of a purchase: filter the inventory ledger by `purchase_id`.

  **WHEN TO USE IT**
  Checking the stock movements a purchase created.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `inventory.view` (taken from the current farm context; never sent by the client).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Transactions caused by a purchase**.

  **FRONTEND NOTES**
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **ACCESS**
  Required backend farm permission: **`inventory.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/inventory/movements`

  Full reference (all fields, errors, rules): folder **10 — Inventory** -> "Movements caused by a purchase".

  Full reference (errors, all fields): folder **10 — Inventory** -> "Movements caused by a purchase".
url: "{{base_url}}/inventory/movements?purchase_id={{purchase_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: purchase_id
    value: "{{purchase_id}}"
  - key: inventory_item_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: storage_location_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: inventory_lot_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: type
    value: ""
    disabled: true
    description: "enum: stock_in | stock_out | adjustment | transfer_out | transfer_in | reversal"
  - key: operational_record_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: health_record_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: sale_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: recorded_from
    value: ""
    disabled: true
    description: string (date)
  - key: recorded_to
    value: ""
    disabled: true
    description: string (date)
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/5. Movements caused by a purchase.resources/examples
order: 5000
