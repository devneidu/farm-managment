$kind: http-request
description: |-
  **IN THIS FLOW**
  Totals are two-decimal strings.

  **WHAT IT DOES**
  Signed totals (reversals offset entries): `totals {income, expense, net}`, `by_category` and `by_cycle` (`production_cycle_id: null` = unallocated overhead). With `production_cycle_id` the response is that cycle's profitability.

  **WHEN TO USE IT**
  The finance overview and cycle profitability screens.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `finance.view` (taken from the current farm context; never sent by the client).
  - All amounts are two-decimal strings. Cash basis: income appears when a PAYMENT is received.

  **FRONTEND NOTES**
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **16 — Finance** -> "Finance summary and cycle profitability".
url: "{{base_url}}/finance/summary?from={{month_start}}&to={{today}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: from
    value: "{{month_start}}"
  - key: to
    value: "{{today}}"
  - key: production_cycle_id
    value: ""
    disabled: true
    description: "Cycle profitability: only money allocated to this cycle. — string (uuid)"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/9. Finance summary and cycle profitability.resources/examples
order: 9000
