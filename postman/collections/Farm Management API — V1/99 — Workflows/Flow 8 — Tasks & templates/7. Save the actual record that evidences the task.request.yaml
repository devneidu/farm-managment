$kind: http-request
description: |-
  **IN THIS FLOW**
  The real event is saved through its own endpoint.

  **WHAT IT DOES**
  The real event is saved through its own endpoint with all its own rules; only afterwards is the task completed with this record as evidence.

  **WHEN TO USE IT**
  The record form opened from a task.

  **IMPORTANT INPUTS**
  - `recorded_at` = when it really happened (UTC, no milliseconds); `idempotency_key` = one UUID per user action.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `record.create` (taken from the current farm context; never sent by the client).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Complete a task (with evidence)**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Unit codes come from `GET /master/units?dimension=...`; do not hard-code them.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **ACCESS**
  Required backend farm permission: **`record.create`** — granted to: `owner`, `manager`, `farm_worker`. (Documentation only: the request never contains a permission string.)

  **URL**
  `POST {{base_url}}/records`

  Full reference (all fields, errors, rules): folder **13 — Tasks, Templates & Calendar** -> "Save the actual record that evidences the task".

  Full reference (errors, all fields): folder **13 — Tasks, Templates & Calendar** -> "Save the actual record that evidences the task".
url: "{{base_url}}/records"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "type": "weight",
      "production_cycle_id": "{{cycle_id}}",
      "recorded_at": "{{recorded_at}}",
      "idempotency_key": "{{$guid}}",
      "details": {
        "sample_size": 20,
        "components": [
          {
            "quantity": "39.2",
            "unit": "kg"
          }
        ]
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("record_evidence_id", String(v)); else console.warn("Could not capture record_evidence_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/7. Save the actual record that evidences the task.resources/examples
order: 7000
