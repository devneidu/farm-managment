$kind: http-request
description: |-
  **IN THIS FLOW**
  Read-only: nothing is saved.

  **WHAT IT DOES**
  Read-only helper: returns the endpoint and prefill values (`production_cycle_id`, `type`, date) for the record the task is linked to, so the frontend can open the right form. Nothing is created.

  **WHEN TO USE IT**
  Opening the right record form when a user taps a task that has a linked record type.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{task_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `task.view` (taken from the current farm context; never sent by the client).
  - `409 task_has_no_linked_record` when the task has no `linked_record_type`.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Save the actual record that evidences the task**.

  **ROUTE FORMS (GAP-06)**
  `endpoint` is the absolute `/api/v1/...` URL (unchanged). `url` repeats it and `path` is the same route relative to `{{base_url}}`; use either consistently.

  **FRONTEND NOTES**
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **13 — Tasks, Templates & Calendar** -> "Record form prefill for a task".
url: "{{base_url}}/tasks/{{task_id}}/record-prefill"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        pm.test("endpoint, url and path agree", function () { pm.expect(json.data.url).to.eql(json.data.endpoint); pm.expect("/api/v1" + json.data.path).to.eql(json.data.endpoint); });
      }
    language: text/javascript
examples: ./.resources/6. Record form prefill for a task.resources/examples
order: 6000
