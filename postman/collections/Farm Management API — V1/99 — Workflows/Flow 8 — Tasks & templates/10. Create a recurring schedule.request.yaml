$kind: http-request
description: |-
  **WHAT IT DOES**
  A recurrence rule that GENERATES tasks: `daily` (every `interval_value` days), `weekly` (every `interval_value` weeks on `weekdays`, 1=Mon ... 7=Sun) or `none` (one task). Tasks are generated for today through the next 30 days and topped up daily by the scheduler.

  **WHEN TO USE IT**
  "Repeat" / recurring task setup.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `task.manage` (taken from the current farm context; never sent by the client).
  - Creates the schedule and its first tasks.
  - `due_date` and `due_time` are farm-local (default `Africa/Lagos`); a task without a time is due by the end of its day. `due_state` is derived, never stored: `upcoming`, `due_today`, `overdue`, `completed`, `cancelled`.
  - Writes are rate limited (240/hour/user).
  - Optional `ends_on` and/or `occurrence_limit`. Dates in the past are never generated. Nothing is generated while the cycle is closed or the project inactive.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Calendar (tasks and milestones)**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **13 — Tasks, Templates & Calendar** -> "Create a recurring schedule".
url: "{{base_url}}/schedules"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "title": "Clean drinkers",
      "category": "cleaning_sanitation",
      "recurrence": "weekly",
      "weekdays": [
        1,
        4
      ],
      "starts_on": "{{today}}",
      "production_cycle_id": "{{cycle_id}}",
      "idempotency_key": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("schedule_id", String(v)); else console.warn("Could not capture schedule_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/10. Create a recurring schedule.resources/examples
order: 10000
