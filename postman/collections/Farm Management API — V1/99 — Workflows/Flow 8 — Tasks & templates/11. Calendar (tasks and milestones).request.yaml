$kind: http-request
description: |-
  **IN THIS FLOW**
  Tasks and milestones; max 92 days.

  **WHAT IT DOES**
  A read model for the calendar screen: tasks plus milestones (cycle start/expected end, breeding expected dates/windows, health follow-ups) between `from` and `to`, ordered by date then time. It stores nothing.

  **WHEN TO USE IT**
  The calendar screen (tasks plus milestones).

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `task.view` (taken from the current farm context; never sent by the client).
  - `from` and `to` are required farm-local dates; the range is at most 92 days.
  - Optional `production_cycle_id`, `breeding_project_id`, `category`, `assigned_to`, `include_milestones` (`0` hides them). Milestones are omitted when filtering by `category` or `assigned_to`.
  - `meta` carries `from`, `to`, `timezone` and `today`.

  **FRONTEND NOTES**
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **13 — Tasks, Templates & Calendar** -> "Calendar (tasks and milestones)".
url: "{{base_url}}/calendar?from={{month_start}}&to={{date_in_30d}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: from
    value: "{{month_start}}"
  - key: to
    value: "{{date_in_30d}}"
  - key: production_cycle_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: breeding_project_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: category
    value: ""
    disabled: true
    description: "enum: feeding_watering | egg_collection | vaccination_medication | breeding_reproduction | growth_monitoring | record_keeping | maintenance_repair | cleaning_sanitation | movement_rotation | procurement_orders | irrigation | crop_care | harvest | payment | other"
  - key: assigned_to
    value: ""
    disabled: true
    description: string — max 36 chars
  - key: include_milestones
    value: ""
    disabled: true
    description: Set to false to list tasks only. — boolean
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/11. Calendar (tasks and milestones).resources/examples
order: 11000
