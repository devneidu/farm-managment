$kind: http-request
description: |-
  **IN THIS FLOW**
  Creates schedules and the first 30 days of tasks. No records are created.

  **WHAT IT DOES**
  Turns a template into schedules (and the first 30 days of tasks) for ONE cycle or breeding project. Schedules are independent copies, so editing the template later never rewrites them.

  **WHEN TO USE IT**
  The "Apply this plan" button.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{template_platform_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `task.manage` (taken from the current farm context; never sent by the client).
  - Creates schedules and tasks. Never creates operational records.
  - Once per template and target: `409 template_already_applied`. The cycle must be open and the project active. Template anchors with no date (for example no breeding expectation) are skipped.
  - Past dates are never generated. The response reports `schedules_created`, `tasks_created`, `skipped_past`, `skipped_no_anchor`, `template_version`.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Create a farm template**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **13 — Tasks, Templates & Calendar** -> "Apply a template to a cycle".
url: "{{base_url}}/work-templates/{{template_platform_id}}/apply"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "production_cycle_id": "{{cycle_id}}",
      "idempotency_key": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/2. Apply a template to a cycle.resources/examples
order: 2000
