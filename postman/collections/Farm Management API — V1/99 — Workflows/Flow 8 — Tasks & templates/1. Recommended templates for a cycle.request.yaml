$kind: http-request
description: |-
  **IN THIS FLOW**
  PREREQUISITES: Flows 1 and 3 (`user_id`, `cycle_id`).

  Captures the first recommended template id.

  **WHAT IT DOES**
  Templates that fit a cycle (or `breeding_project_id`) by kind, operation, species/crop. The user chooses Apply, Clone-edit-apply, or ignores it: nothing applies automatically.

  **WHEN TO USE IT**
  A "Suggested plans" panel after a batch/project or breeding project is created.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `task.view` (taken from the current farm context; never sent by the client).
  - Platform templates (`source: platform`) are read-only; farm templates are the farm's own. Template content is configuration, not veterinary or agronomic advice.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Apply a template to a cycle**.

  **FRONTEND NOTES**
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **13 — Tasks, Templates & Calendar** -> "Recommended templates for a cycle".
url: "{{base_url}}/work-templates/recommended?production_cycle_id={{cycle_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: production_cycle_id
    value: "{{cycle_id}}"
  - key: source
    value: ""
    disabled: true
    description: "enum: platform | farm"
  - key: applies_to
    value: ""
    disabled: true
    description: "enum: production_cycle | breeding_project"
  - key: is_active
    value: ""
    disabled: true
    description: boolean
  - key: breeding_project_id
    value: ""
    disabled: true
    description: string (uuid)
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const row = (get(json, "data") || []).find((r) => true); const v = row && get(row, "id"); if (v !== undefined && v !== null) pm.environment.set("template_platform_id", String(v)); else console.warn("Could not capture template_platform_id"); }
      }
    language: text/javascript
examples: ./.resources/1. Recommended templates for a cycle.resources/examples
order: 1000
