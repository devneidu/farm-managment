$kind: http-request
description: |-
  **IN THIS FLOW**
  Now 293 kg.

  **WHAT IT DOES**
  The derived stock now reflects the stock-out movement.

  **WHEN TO USE IT**
  Re-reading the item to display its new derived stock.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{item_feed_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `inventory.view` (taken from the current farm context; never sent by the client).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Movement history of one item**.

  **ITEM KIND (GAP-03)**
  Every item carries `kind` (`feed` | `eggs` | `milk` | `general`) and `is_system_managed` (`true` for the farm's automatic Eggs / Milk output items). Use `kind` to pick `GET /master/inventory-options → reasons.by_item_kind[kind]`; never infer it from the name or category.

  **FRONTEND NOTES**
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **ACCESS**
  Required backend farm permission: **`inventory.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/inventory/items/{{item_feed_id}}`

  Full reference (all fields, errors, rules): folder **10 — Inventory** -> "Re-read the item after the stock-out".

  Full reference (errors, all fields): folder **10 — Inventory** -> "Re-read the item after the stock-out".
url: "{{base_url}}/inventory/items/{{item_feed_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        pm.test("items expose kind and is_system_managed", function () { const rows = Array.isArray(json.data) ? json.data : [json.data]; rows.forEach(function (i) { pm.expect(["feed", "eggs", "milk", "general"]).to.include(i.kind); pm.expect(i.is_system_managed).to.be.a("boolean"); }); });
      }
    language: text/javascript
examples: ./.resources/8. Re-read the item after the stock-out.resources/examples
order: 8000
