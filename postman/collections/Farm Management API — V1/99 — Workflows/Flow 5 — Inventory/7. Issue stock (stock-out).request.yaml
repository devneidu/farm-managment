$kind: http-request
description: |-
  **IN THIS FLOW**
  Issues 25 kg; stock may never go negative.

  **WHAT IT DOES**
  Issues stock for a manual reason (`use`, `damaged`, `expired`, `wasted`, `other`). Stock may never go negative - not even at a past `recorded_at`.

  **WHEN TO USE IT**
  "Use / write off stock" for non-batch usage, damage or expiry.

  **IMPORTANT INPUTS**
  - `recorded_at` = when it really happened (UTC, no milliseconds); `idempotency_key` = one UUID per user action.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `inventory.use` (taken from the current farm context; never sent by the client).
  - One `stock_out` movement.
  - Insufficient stock (current or at that historical moment) is `409 insufficient_stock`.
  - Feed used for a specific batch should normally be recorded as a `feed_use` operational record linked to this item, which creates the movement itself; use stock-out for non-batch usage and write-offs.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Re-read the item after the stock-out**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Unit codes come from `GET /master/units?dimension=...`; do not hard-code them.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Derived numbers (population, stock, outstanding, totals) are authoritative on the server: refetch the affected resource and the dashboard after saving.

  Full reference (errors, all fields): folder **10 — Inventory** -> "Issue stock (stock-out)".
url: "{{base_url}}/inventory/stock-out"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "inventory_item_id": "{{item_feed_id}}",
      "storage_location_id": "{{store_id}}",
      "reason": "spoiled",
      "components": [
        {
          "quantity": "25",
          "unit": "kg"
        }
      ],
      "recorded_at": "{{recorded_at_2h}}",
      "idempotency_key": "{{$guid}}",
      "notes": "Damp bag discarded"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("movement_out_id", String(v)); else console.warn("Could not capture movement_out_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/7. Issue stock (stock-out).resources/examples
order: 7000
