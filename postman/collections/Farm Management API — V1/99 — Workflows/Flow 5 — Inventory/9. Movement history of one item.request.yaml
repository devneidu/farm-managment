$kind: http-request
description: |-
  **IN THIS FLOW**
  Every balance change is a ledger line.

  **WHAT IT DOES**
  The ledger lines of ONE item, newest first. Filters: `storage_location_id`, `inventory_lot_id`, `type` (`stock_in`, `stock_out`, `adjustment`, `transfer_out`, `transfer_in`, `reversal`), `operational_record_id`, `health_record_id`, `purchase_id`, `sale_id`, `recorded_from`, `recorded_to`, `page`, `per_page`.

  **WHEN TO USE IT**
  The "Movement history" tab of one item.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{item_feed_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `inventory.view` (taken from the current farm context; never sent by the client).
  - Each movement says which record/health event/purchase/sale caused it, so every balance change is explainable.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Reverse a movement**.

  **FRONTEND NOTES**
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **10 — Inventory** -> "Movement history of one item".
url: "{{base_url}}/inventory/items/{{item_feed_id}}/movements"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: inventory_item_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: storage_location_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: inventory_lot_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: type
    value: ""
    disabled: true
    description: "enum: stock_in | stock_out | adjustment | transfer_out | transfer_in | reversal"
  - key: operational_record_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: health_record_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: purchase_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: sale_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: recorded_from
    value: ""
    disabled: true
    description: string (date)
  - key: recorded_to
    value: ""
    disabled: true
    description: string (date)
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/9. Movement history of one item.resources/examples
order: 9000
