$kind: http-request
description: |-
  **WHAT IT DOES**
  Paginated items with their DERIVED stock (`stock.quantity` + unit, sum of movements) and a `low_stock` flag.

  **WHEN TO USE IT**
  The inventory list with derived stock and low-stock flags.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `inventory.view` (taken from the current farm context; never sent by the client).
  - Filters: `category`, `search`, `include_inactive`, `low_stock`, `page`, `per_page`.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Show an inventory item with stock by location and lot**.

  **ITEM KIND (GAP-03)**
  Every item carries `kind` (`feed` | `eggs` | `milk` | `general`) and `is_system_managed` (`true` for the farm's automatic Eggs / Milk output items). Use `kind` to pick `GET /master/inventory-options → reasons.by_item_kind[kind]`; never infer it from the name or category.

  **FRONTEND NOTES**
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **10 — Inventory** -> "List inventory items with derived stock".
url: "{{base_url}}/inventory/items?category=feed"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: category
    value: feed
  - key: search
    value: ""
    disabled: true
    description: string — max 150 chars
  - key: include_inactive
    value: ""
    disabled: true
    description: boolean
  - key: low_stock
    value: ""
    disabled: true
    description: "true: only items with a threshold whose stock is at or below it. — boolean"
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        pm.test("items expose kind and is_system_managed", function () { const rows = Array.isArray(json.data) ? json.data : [json.data]; rows.forEach(function (i) { pm.expect(["feed", "eggs", "milk", "general"]).to.include(i.kind); pm.expect(i.is_system_managed).to.be.a("boolean"); }); });
      }
    language: text/javascript
examples: ./.resources/5. List inventory items with derived stock.resources/examples
order: 5000
