$kind: http-example
name: 201 Created — Breeding project started.
request:
  url: "{{base_url}}/breeding-projects"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "production_cycle_id": "{{cycle_id}}",
        "workflow": "incubation",
        "start_date": "{{date_10d_ago}}",
        "eggs_set": 50,
        "expected_offspring": 40,
        "parents": [
          {
            "role": "dam",
            "production_cycle_id": "{{cycle_id}}",
            "head_count": 20
          }
        ],
        "notes": "Set in the hatchery",
        "idempotency_key": "{{$guid}}"
      }
