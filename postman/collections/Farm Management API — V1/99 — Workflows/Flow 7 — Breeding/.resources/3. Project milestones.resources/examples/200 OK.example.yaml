$kind: http-example
request:
  url: "{{base_url}}/breeding-projects/{{breeding_project_id}}/milestones"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "code": "started",
            "date": "2026-09-24",
            "from": null,
            "to": null,
            "status": "done"
          },
          {
            "code": "expected_outcome",
            "date": "2026-10-15",
            "from": null,
            "to": null,
            "status": "pending"
          }
        ],
        "meta": {},
        "message": null
      }
order: 1000
