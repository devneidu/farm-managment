$kind: http-request
description: |-
  **WHAT IT DOES**
  Outcome on the second project, used to demonstrate reversal.

  **WHEN TO USE IT**
  Recording an outcome on a second project.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{breeding_project_b_id}}`.
  - `recorded_at` = when it really happened (UTC, no milliseconds); `idempotency_key` = one UUID per user action.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `breeding.create` (taken from the current farm context; never sent by the client).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Reverse a breeding outcome**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **ACCESS**
  Required backend farm permission: **`breeding.create`** — granted to: `owner`, `manager`, `farm_worker`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `POST {{base_url}}/breeding-projects/{{breeding_project_b_id}}/outcomes`

  Full reference (all fields, errors, rules): folder **12 — Breeding** -> "Record an outcome (second project)".

  Full reference (errors, all fields): folder **12 — Breeding** -> "Record an outcome (second project)".
url: "{{base_url}}/breeding-projects/{{breeding_project_b_id}}/outcomes"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "live_count": 20,
      "loss_count": 10,
      "recorded_at": "{{recorded_at}}",
      "idempotency_key": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("outcome_b_id", String(v)); else console.warn("Could not capture outcome_b_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/8. Record an outcome (second project).resources/examples
order: 8000
