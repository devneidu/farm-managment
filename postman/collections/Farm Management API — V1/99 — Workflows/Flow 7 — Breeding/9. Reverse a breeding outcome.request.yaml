$kind: http-request
description: |-
  **IN THIS FLOW**
  Reversal returns the project to `active` and appends -20.

  **WHAT IT DOES**
  Appends a `reversal` outcome and, when the original added population, one compensating reversal record (-live). The project returns to `active` so a replacement outcome can be recorded.

  **WHEN TO USE IT**
  "Undo" a wrong outcome; then record a replacement if needed.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{breeding_project_b_id}}`, `{{outcome_b_id}}`.
  - `recorded_at` = when it really happened (UTC, no milliseconds); `idempotency_key` = one UUID per user action.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `breeding.reverse` (taken from the current farm context; never sent by the client).
  - Reversal outcome + compensating population movement.
  - `409 insufficient_population` if the hatched animals have since died or been sold. A reversal cannot be reversed (`409 outcome_already_reversed`).
  - The generated `breeding_outcome` record cannot be reversed through `/records/{id}/reverse` (`409 reverse_via_breeding_outcome`).
  - This is a correction, not an edit: history is kept and a new opposite row is appended.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Derived numbers (population, stock, outstanding, totals) are authoritative on the server: refetch the affected resource and the dashboard after saving.

  Full reference (errors, all fields): folder **12 — Breeding** -> "Reverse a breeding outcome".
url: "{{base_url}}/breeding-projects/{{breeding_project_b_id}}/outcomes/{{outcome_b_id}}/reverse"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "reason": "Hatch count entered for the wrong batch",
      "recorded_at": "{{recorded_at}}",
      "idempotency_key": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/9. Reverse a breeding outcome.resources/examples
order: 9000
