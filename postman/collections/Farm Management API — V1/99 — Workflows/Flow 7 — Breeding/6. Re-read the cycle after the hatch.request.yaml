$kind: http-request
description: |-
  **IN THIS FLOW**
  Population rose by exactly 37.

  **WHAT IT DOES**
  37 chicks hatched: `current_population` rose by +37 through ONE population movement. The 50 eggs set and 40 expected never touched the population.

  **WHEN TO USE IT**
  Re-reading the cycle to display the derived population after a hatch.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{cycle_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `production_cycle.view` (taken from the current farm context; never sent by the client).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Start a breeding project (second attempt)**.

  **RECORD TYPES THIS CYCLE ACCEPTS (GAP-02)**
  Detail reads only: `data.available_record_types[]` = `{type, permissions_required}` for every record type `POST /records` accepts for this cycle right now (same cycle-kind and species-capability rules as record creation; `[]` for a closed cycle). It is not filtered by the member's permissions: keep a type when the member holds all of `permissions_required.always` (plus `when_inventory_linked` if the form links stock). Lists and write responses do not carry the field; refetch the detail after close/reopen.

  **FRONTEND NOTES**
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **ACCESS**
  Required backend farm permission: **`production_cycle.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/production-cycles/{{cycle_id}}`

  Full reference (all fields, errors, rules): folder **08 — Production Cycles** -> "Re-read the cycle after the hatch".

  Full reference (errors, all fields): folder **08 — Production Cycles** -> "Re-read the cycle after the hatch".
url: "{{base_url}}/production-cycles/{{cycle_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        pm.test("available_record_types lists the types this cycle accepts", function () { pm.expect(json.data.available_record_types).to.be.an("array"); json.data.available_record_types.forEach(function (t) { pm.expect(t).to.have.property("type"); pm.expect(t.permissions_required.always).to.be.an("array"); }); });
      }
    language: text/javascript
examples: ./.resources/6. Re-read the cycle after the hatch.resources/examples
order: 6000
