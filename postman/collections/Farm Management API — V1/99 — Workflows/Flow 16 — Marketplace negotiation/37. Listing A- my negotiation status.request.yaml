$kind: http-request
name: "37. Listing A: my negotiation status"
description: "**IN THIS FLOW**"
url: "{{base_url}}/marketplace/listings/{{listing_slug}}/offer-status"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.eql(200); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      pm.test("One attempt used, offer pending", function () { pm.expect(json.data.rules.attempts_used).to.eql(1); pm.expect(json.data.rules.attempts_remaining).to.eql(2); pm.expect(json.data.blocked_reason).to.eql("offer_pending"); });
      pm.test("No private contact details in the response", function () { const t = pm.response.text(); ["+2348031234567","ada.private@example.com","12 Secret Street"].forEach((s) => pm.expect(t).to.not.include(s)); });
    language: text/javascript
order: 37000
