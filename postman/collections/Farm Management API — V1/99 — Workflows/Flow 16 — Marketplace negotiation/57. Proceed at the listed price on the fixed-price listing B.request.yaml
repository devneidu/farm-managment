$kind: http-request
description: "**IN THIS FLOW**"
url: "{{base_url}}/marketplace/listings/{{listing_b_slug}}/purchase-intent"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "quantity": "10"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.eql(201); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      { const v = json.data.id; if (v !== undefined && v !== null) { pm.environment.set("intent_id", v); } }
      pm.test("Interest recorded at the listed price; nothing sold or charged", function () { pm.expect(json.data.kind).to.eql("purchase_intent"); pm.expect(json.data.status).to.eql("recorded"); pm.expect(json.data.agreement).to.eql("none"); pm.expect(json.data.terms.unit_price).to.eql("8000.00"); pm.expect(json.data.contact).to.eql(null); });
      pm.test("No private contact details in the response", function () { const t = pm.response.text(); ["+2348031234567","ada.private@example.com","12 Secret Street"].forEach((s) => pm.expect(t).to.not.include(s)); });
    language: text/javascript
order: 57000
