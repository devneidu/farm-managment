$kind: http-request
description: |-
  **IN THIS FLOW**
  Sets the XSRF-TOKEN cookie.
url: "{{base_url}}/auth/csrf-cookie"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: pm.test("Status is 204", function () { pm.expect(pm.response.code).to.eql(204); });
    language: text/javascript
order: 1000
