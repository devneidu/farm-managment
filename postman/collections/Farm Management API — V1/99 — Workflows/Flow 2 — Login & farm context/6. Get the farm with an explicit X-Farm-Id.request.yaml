$kind: http-request
description: |-
  **IN THIS FLOW**
  There is NO "switch farm" endpoint and NO "list my farms" endpoint in V1: multi-farm is the optional `X-Farm-Id` header only (see Frontend Integration Gaps).

  **WHAT IT DOES**
  Same as "Get current farm" but naming the farm explicitly with the optional `X-Farm-Id` header. The header selects among farms you actively belong to; it can never grant access (`403 farm_access_denied`).

  **WHEN TO USE IT**
  Acting on a specific farm when a user belongs to several.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `farm.view` (taken from the current farm context; never sent by the client).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Get the dashboard**.

  **WHERE THE ID COMES FROM (GAP-07)**
  Take it from `GET /auth/me → data.farms[].id`. After switching, refetch `GET /farm`, `GET /subscription/entitlements` and clear farm-scoped caches.

  **FRONTEND NOTES**
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **ACCESS**
  Required backend farm permission: **`farm.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/farm`

  Full reference (all fields, errors, rules): folder **03 — Farms, Team & Access** -> "Get the farm with an explicit X-Farm-Id".

  Full reference (errors, all fields): folder **03 — Farms, Team & Access** -> "Get the farm with an explicit X-Farm-Id".
url: "{{base_url}}/farm"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  - key: X-Farm-Id
    value: "{{farm_id}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/6. Get the farm with an explicit X-Farm-Id.resources/examples
order: 6000
