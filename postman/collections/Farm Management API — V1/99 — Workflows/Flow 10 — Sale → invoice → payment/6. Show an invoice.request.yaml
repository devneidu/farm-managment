$kind: http-request
description: |-
  **IN THIS FLOW**
  `unpaid`, `outstanding` 87,000.00.

  **WHAT IT DOES**
  The issued invoice with snapshot lines, `payment_status` (`unpaid`|`partially_paid`|`paid`), `total_amount`, `amount_paid`, `outstanding`, `is_overdue` and its payments. Invoice state (`issued`|`void`) is separate from payment state.

  **WHEN TO USE IT**
  An invoice detail with its payments.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{invoice_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `invoice.view` (taken from the current farm context; never sent by the client).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Download the invoice as a PDF**.

  **FRONTEND NOTES**
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **ACCESS**
  Required backend farm permission: **`invoice.view`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/invoices/{{invoice_id}}`

  Full reference (errors, all fields): folder **17 — Sales, Invoices & Payments** -> "Show an invoice".
url: "{{base_url}}/invoices/{{invoice_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/6. Show an invoice.resources/examples
order: 6000
