$kind: http-request
description: |-
  **IN THIS FLOW**
  PDF bytes; in Postman use "Send and Download".

  **WHAT IT DOES**
  Streams `application/pdf` (`Content-Disposition: inline; filename="INV-....pdf"`), rendered on demand from the snapshot plus live paid/balance figures.

  **WHEN TO USE IT**
  "Download PDF" / print.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{invoice_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `invoice.view` (taken from the current farm context; never sent by the client).
  - Rate limited (30/min). Cross-farm access is `404`.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Record a payment (partial)**.

  **FRONTEND NOTES**
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Fetch with credentials as a Blob and open/save it; do not link to it from another origin. Sending by email/WhatsApp is not part of V1.

  Full reference (errors, all fields): folder **17 — Sales, Invoices & Payments** -> "Download the invoice as a PDF".
url: "{{base_url}}/invoices/{{invoice_id}}/pdf"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
examples: ./.resources/7. Download the invoice as a PDF.resources/examples
order: 7000
