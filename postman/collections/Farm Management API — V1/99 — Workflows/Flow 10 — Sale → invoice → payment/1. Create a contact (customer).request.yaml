$kind: http-request
description: |-
  **IN THIS FLOW**
  PREREQUISITES: Flows S and 3 (`item_eggs_id`, `store_id`, `cycle_id`).

  Captures `customer_id`.

  **WHAT IT DOES**
  A customer contact, used on sales and invoices (there is no separate customer system).

  **WHEN TO USE IT**
  "Add customer".

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `contact.manage` (taken from the current farm context; never sent by the client).
  - Same rules as the supplier example: names are unique per farm (`409 contact_exists`), roles are `supplier` and/or `customer`.
  - A sale requires a CUSTOMER (or a free-text walk-in `customer_name`).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Record a sale (stock + livestock lines)**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Derived numbers (population, stock, outstanding, totals) are authoritative on the server: refetch the affected resource and the dashboard after saving.

  Full reference (errors, all fields): folder **15 — Contacts & Purchasing** -> "Create a contact (customer)".
url: "{{base_url}}/contacts"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "name": "Mama Put Restaurant",
      "kind": "business",
      "roles": [
        "customer"
      ],
      "phone": "08030000000",
      "address": "12 Market Road, Ibadan"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("customer_id", String(v)); else console.warn("Could not capture customer_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/1. Create a contact (customer).resources/examples
order: 1000
