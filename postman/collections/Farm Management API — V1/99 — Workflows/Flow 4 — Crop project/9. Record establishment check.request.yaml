$kind: http-request
description: |-
  **IN THIS FLOW**
  752 of 800 established: the API derives 48 failed and "94" percent survival.

  **WHAT IT DOES**
  Records how many planting units established. The server derives `baseline_units`, `failed_units` and `survival_percent` (800 baseline, 752 established -> 48 failed, "94"). Do not send them.

  **WHEN TO USE IT**
  "Establishment/survival check" some time after planting.

  **IMPORTANT INPUTS**
  - `recorded_at` = when it really happened (UTC, no milliseconds); `idempotency_key` = one UUID per user action.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `record.create` (taken from the current farm context; never sent by the client).
  - Record only.
  - `established_units` is a whole count between 0 and the baseline. Several checks may be recorded; the latest non-reversed one is current.
  - A record says what DID happen. It is append-only: there is no PATCH or DELETE - correct with Reverse (and optionally a replacement using `corrects_record_id`).
  - `recorded_at` is when the event really happened (UTC with seconds and `Z`/offset, no milliseconds, between the cycle start and now); the server keeps its own `created_at`.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Record growth stage**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **14 — Crop Operations** -> "Record establishment check".
url: "{{base_url}}/records"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "type": "establishment_check",
      "production_cycle_id": "{{crop_cycle_id}}",
      "recorded_at": "{{recorded_at_2h}}",
      "idempotency_key": "{{$guid}}",
      "details": {
        "established_units": 752
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/9. Record establishment check.resources/examples
order: 9000
