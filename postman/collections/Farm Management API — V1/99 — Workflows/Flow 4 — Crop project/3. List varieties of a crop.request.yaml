$kind: http-request
description: |-
  **WHAT IT DOES**
  Variety dropdown for a crop: system + this farm's custom varieties. A variety is optional on a crop project and the list may be empty.

  **WHEN TO USE IT**
  Variety dropdown of the crop project form.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{crop_yam_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `master_data.view` (taken from the current farm context; never sent by the client).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Planting reference lists**.

  **FRONTEND NOTES**
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **ACCESS**
  Required backend farm permission: **`master_data.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/master/crops/{{crop_yam_id}}/varieties`

  Full reference (errors, all fields): folder **05 — Master Data** -> "List varieties of a crop".
url: "{{base_url}}/master/crops/{{crop_yam_id}}/varieties"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: operation
    value: ""
    disabled: true
    description: string — max 64 chars
  - key: category
    value: ""
    disabled: true
    description: "enum: livestock | aquaculture | crop"
  - key: group
    value: ""
    disabled: true
    description: "enum: poultry | small_ruminants | large_ruminants | non_ruminant_mammals | equines | micro_livestock"
  - key: available
    value: ""
    disabled: true
    description: boolean
  - key: include_inactive
    value: ""
    disabled: true
    description: boolean
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/3. List varieties of a crop.resources/examples
order: 3000
