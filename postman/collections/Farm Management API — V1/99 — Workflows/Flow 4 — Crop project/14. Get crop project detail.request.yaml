$kind: http-request
description: |-
  **IN THIS FLOW**
  Derived read model: planting progress, survival, losses, harvest totals in grams.

  **WHAT IT DOES**
  Read model of a crop project: baseline planting units, planting progress, latest establishment (failed units, survival %), latest growth stage, losses by cause, harvest totals per normalised unit and activity counts. Reversed records are excluded.

  **WHEN TO USE IT**
  The crop project dashboard (progress, survival, losses, harvest totals).

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{crop_cycle_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `production_cycle.view` (taken from the current farm context; never sent by the client).
  - A livestock cycle is `409 not_a_crop_project`. Harvest totals are per canonical unit (`g`, `ml`, `piece`) and are never added across dimensions.

  **FRONTEND NOTES**
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **14 — Crop Operations** -> "Get crop project detail".
url: "{{base_url}}/production-cycles/{{crop_cycle_id}}/crop"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/14. Get crop project detail.resources/examples
order: 14000
