$kind: http-request
description: |-
  **IN THIS FLOW**
  Captures `breed_id`.

  **WHAT IT DOES**
  Adds a farm-specific breed to a species ("+ Add custom breed"). Use the returned `id` as `breed_id` when starting a livestock batch.

  **WHEN TO USE IT**
  "+ Add custom breed" inside the livestock batch form.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `master_data.manage` (taken from the current farm context; never sent by the client).
  - Duplicate (case/space-insensitive) against system and farm breeds of the same species: `409 duplicate_name` with `details {existing_id, source, is_active}` - reuse or reactivate that id.
  - Farm and species come from the session/body and can never change later.

  **ON A RERUN**
  Flow S is meant to run once. If the breed already exists the backend answers `409 duplicate_name` (kept as is); the test accepts that conflict and reuses `details.existing_id` as `breed_id`, so a second run of Flow S still leaves a valid `breed_id`.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Create a location**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Derived numbers (population, stock, outstanding, totals) are authoritative on the server: refetch the affected resource and the dashboard after saving.

  Full reference (errors, all fields): folder **05 — Master Data** -> "Create a custom breed".
url: "{{base_url}}/custom-breeds"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "species_id": "{{species_chicken_id}}",
      "name": "Isa Brown (Ibadan strain)"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201 (created) or 409 (already exists on a rerun - reused)", function () { pm.expect(pm.response.code).to.be.oneOf([201, 409]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        { const v = json.data && json.data.id; if (v) pm.environment.set("breed_id", String(v)); else console.warn("Could not capture breed_id from data.id"); }
      }
      if (pm.response.code === 409) {
        const json = pm.response.json();
        pm.test("409 is the documented duplicate_name conflict for an ACTIVE farm breed - reuse details.existing_id", function () { pm.expect(json.code).to.eql("duplicate_name"); pm.expect(json.details.source).to.eql("farm"); pm.expect(json.details.is_active).to.eql(true); pm.expect(json.details.existing_id).to.be.a("string"); });
        pm.environment.set("breed_id", String(json.details.existing_id));
      }
    language: text/javascript
examples: ./.resources/8. Create a custom breed.resources/examples
order: 8000
