$kind: http-request
description: |-
  **WHAT IT DOES**
  Lists every plan (including inactive/private ones) with prices and entitlements.

  **WHEN TO USE IT**
  Platform plan management list.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Platform Admin read: needs a platform role (`admin` or `support`), not a farm role.
  - Any platform role (`admin` or `support`) may read.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Change a farm's plan**.

  Full reference (errors, all fields): folder **Plans** -> "List plans".
url: "{{base_url}}/platform-admin/plans"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
queryParams:
  - key: q
    value: ""
    disabled: true
    description: Matches name or slug. — string — max 100 chars
  - key: is_active
    value: ""
    disabled: true
    description: boolean
  - key: is_public
    value: ""
    disabled: true
    description: boolean
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const row = (get(json, "data") || []).find((r) => get(r, "slug") === "farm-business"); const v = row && get(row, "id"); if (v !== undefined && v !== null) pm.environment.set("plan_business_id", String(v)); else console.warn("Could not capture plan_business_id"); }
        { const row = (get(json, "data") || []).find((r) => get(r, "slug") === "free"); const v = row && get(row, "id"); if (v !== undefined && v !== null) pm.environment.set("plan_free_id", String(v)); else console.warn("Could not capture plan_free_id"); }
        { const row = (get(json, "data") || []).find((r) => get(r, "slug") === "farm-pro"); const v = row && get(row, "id"); if (v !== undefined && v !== null) pm.environment.set("plan_pro_id", String(v)); else console.warn("Could not capture plan_pro_id"); }
      }
    language: text/javascript
examples: ./.resources/2. List plans.resources/examples
order: 2000
