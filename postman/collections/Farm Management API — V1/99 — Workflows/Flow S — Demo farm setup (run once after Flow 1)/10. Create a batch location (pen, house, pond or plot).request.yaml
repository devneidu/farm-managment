$kind: http-request
description: |-
  **IN THIS FLOW**
  Captures `area_id`.

  **WHAT IT DOES**
  A batch location (called a *production area* in the API) is where a batch or crop project physically lives (pen, pond, field, plot). Cycles reference it through `production_area_id`.

  **WHEN TO USE IT**
  "Add pen/pond/plot", or inline inside the batch/project form.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `location.manage` (taken from the current farm context; never sent by the client).
  - `type`: `house`, `pen`, `pond`, `field`, `plot`, `other`. `parent_id` must be a location of this farm.
  - Zero batch locations is valid: cycles can omit the area.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Create a storage location**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **07 — Locations & Farm Structure** -> "Create a batch location".
url: "{{base_url}}/production-areas"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "name": "Pen 1",
      "type": "pen",
      "parent_id": "{{location_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("area_id", String(v)); else console.warn("Could not capture area_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/10. Create a batch location (pen, house, pond or plot).resources/examples
order: 10000
