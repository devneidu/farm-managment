$kind: http-example
name: 201 Created — Inventory item created.
request:
  url: "{{base_url}}/inventory/items"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "name": "NPK 15-15-15",
        "category": "fertilizer_agrochemical",
        "stock_unit": "kg"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "01a1045e-5637-7074-bd1b-d498ec86d4cf",
          "name": "NPK 15-15-15",
          "category": "fertilizer_agrochemical",
          "description": null,
          "stock_unit": "kg",
          "dimension": "weight",
          "tracks_lots": false,
          "tracks_expiry": false,
          "is_active": true,
          "stock": {
            "quantity": "0",
            "unit": "kg",
            "normalized": {
              "quantity": "0",
              "unit": "g"
            }
          },
          "low_stock_threshold": null,
          "is_low_stock": false,
          "created_at": "2026-10-04T00:45:08.000000Z",
          "updated_at": "2026-10-04T00:45:08.000000Z"
        },
        "meta": {},
