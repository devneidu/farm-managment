$kind: http-request
description: |
  **WHAT IT DOES**
  Lists the Eggs ledger newest first. Every movement carries `reason`, `reason_label`, `source {type, id}` (operational_record | sale | breeding_project | purchase | health_record | transfer | manual), `production_cycle_id`, `breeding_project_id`, the actor (`created_by`) and reversal links.

  **WHEN TO USE IT**
  "Stock history" for eggs, milk or feed. New filters: `production_cycle_id`, `breeding_project_id`, `reason`.

  **IMPORTANT BEHAVIOR**
  - Requires `inventory.view`. The ledger is append-only: corrections are new rows.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Unit codes come from `GET /master/units?dimension=...`; do not hard-code them.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Derived numbers (population, stock, outstanding, totals) are authoritative on the server: refetch the affected resource and the dashboard after saving.


  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie (verified, onboarded, active member of the current farm). State-changing requests need `X-XSRF-TOKEN` and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required permission: **`inventory.view`**.

  **URL**
  `GET {{base_url}}/inventory/movements`

  **REQUEST BODY** (`application/json`)
  - Query: `inventory_item_id`, `storage_location_id`, `type`, `reason`, `operational_record_id`, `sale_id`, `purchase_id`, `health_record_id`, `production_cycle_id`, `breeding_project_id`, `recorded_from`, `recorded_to`, `page`, `per_page`.

  **BUSINESS RULES**
  - The 104 collected, 30 sold, 40 incubated and 4 damaged each link to their own event.

  **SUCCESS**
  `200 OK` — paginated movements.

  **ERRORS**
  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403 forbidden` — the caller lacks the permission above.
url: "{{base_url}}/inventory/movements?inventory_item_id={{egg_item_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  inventory_item_id: "{{egg_item_id}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
      }
    language: text/javascript
examples: ./.resources/13. Egg movement history (what explains the balance).resources/examples
order: 13000
