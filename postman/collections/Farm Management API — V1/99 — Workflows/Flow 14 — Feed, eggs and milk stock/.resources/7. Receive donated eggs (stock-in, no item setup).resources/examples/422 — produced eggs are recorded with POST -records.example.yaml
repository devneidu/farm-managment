$kind: http-example
name: 422 — produced eggs are recorded with POST /records
request:
  url: "{{base_url}}/inventory/stock-in"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "output": "eggs",
        "storage_location_id": "{{store_id}}",
        "reason": "donation",
        "components": [
          {
            "quantity": "20",
            "unit": "piece"
          }
        ],
        "recorded_at": "{{recorded_at_2h}}",
        "idempotency_key": "{{$guid}}",
        "notes": "Gift from a neighbour farm"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Produce is stocked by recording the production (POST /records: egg_collection, milk or crop_harvest), so stock and production cannot disagree. Use donation, purchase, received, opening_balance or other for produce that was not produced on this farm.",
        "code": "validation_failed",
        "request_id": "01a1107d-ab55-7179-956b-d7eb25a86a00",
        "errors": {
          "reason": [
            "Produce is stocked by recording the production (POST /records: egg_collection, milk or crop_harvest), so stock and production cannot disagree. Use donation, purchase, received, opening_balance or other for produce that was not produced on this farm."
          ]
        }
      }
order: 2000
