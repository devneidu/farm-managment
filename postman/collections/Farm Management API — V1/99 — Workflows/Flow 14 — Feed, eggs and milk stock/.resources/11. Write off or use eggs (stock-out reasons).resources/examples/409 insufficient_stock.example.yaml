$kind: http-example
request:
  url: "{{base_url}}/inventory/stock-out"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "output": "eggs",
        "storage_location_id": "{{store_id}}",
        "reason": "damaged",
        "components": [
          {
            "quantity": "100000",
            "unit": "piece"
          }
        ],
        "recorded_at": "{{recorded_at}}",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "There is not enough stock in this location.",
        "code": "insufficient_stock",
        "request_id": "01a11127-1311-722f-b83d-b5d35eb8658e",
        "details": {
          "available": {
            "quantity": "62",
            "unit": "piece"
          },
          "requested": {
            "quantity": "100000",
            "unit": "piece"
          }
        }
      }
order: 6000
