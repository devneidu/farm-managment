$kind: http-example
name: 422 — a sale is recorded with POST /sales
request:
  url: "{{base_url}}/inventory/stock-out"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "output": "eggs",
        "storage_location_id": "{{store_id}}",
        "reason": "sale",
        "components": [
          {
            "quantity": "1",
            "unit": "piece"
          }
        ],
        "recorded_at": "{{recorded_at}}",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The reason \"sale\" is recorded through POST /sales so the event is entered once; it cannot be used on the manual endpoint.",
        "code": "validation_failed",
        "request_id": "01a11127-12cd-729f-812e-6129999469ba",
        "errors": {
          "reason": [
            "The reason \"sale\" is recorded through POST /sales so the event is entered once; it cannot be used on the manual endpoint."
          ]
        }
      }
order: 5000
