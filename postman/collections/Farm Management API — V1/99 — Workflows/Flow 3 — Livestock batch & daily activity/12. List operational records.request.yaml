$kind: http-request
description: |-
  **IN THIS FLOW**
  The mortality records of this batch.

  **WHAT IT DOES**
  Paginated records of the farm, newest first. Reversed originals stay in the list (with `reversed_by_record_id`) and their reversal records appear too.

  **WHEN TO USE IT**
  The activity/history list of a batch, a plot or the whole farm.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `record.view` (taken from the current farm context; never sent by the client).
  - Filters: `production_cycle_id`, `production_area_id` (every project on that plot), `type` (including `reversal`), `recorded_from`/`recorded_to` (inclusive farm-local `YYYY-MM-DD` days), `page`, `per_page` (default 50, max 100).
  - Do not sum `measurement.total` across a record and its reversal: use the reversal relationship.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Production summary**.

  **FRONTEND NOTES**
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **09 — Operational Records** -> "List operational records".
url: "{{base_url}}/records?production_cycle_id={{cycle_id}}&type=mortality"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: production_cycle_id
    value: "{{cycle_id}}"
  - key: type
    value: mortality
  - key: production_area_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: recorded_from
    value: ""
    disabled: true
    description: string (date)
  - key: recorded_to
    value: ""
    disabled: true
    description: string (date)
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/12. List operational records.resources/examples
order: 12000
