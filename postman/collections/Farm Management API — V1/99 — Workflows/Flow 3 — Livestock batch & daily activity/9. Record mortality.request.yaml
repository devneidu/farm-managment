$kind: http-request
description: |-
  **IN THIS FLOW**
  Appends a population movement of -5.

  **WHAT IT DOES**
  Records dead animals. The record appends a NEGATIVE population movement, so the cycle's derived `current_population` drops by `quantity`.

  **WHEN TO USE IT**
  "Record mortality" on a batch.

  **IMPORTANT INPUTS**
  - `recorded_at` = when it really happened (UTC, no milliseconds); `idempotency_key` = one UUID per user action.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `record.create` (taken from the current farm context; never sent by the client).
  - Creates the record and a population movement of -quantity (`population_delta: -5`). No inventory, finance or task effect.
  - A record says what DID happen. It is append-only: there is no PATCH or DELETE - correct with Reverse (and optionally a replacement using `corrects_record_id`).
  - `recorded_at` is when the event really happened (UTC with seconds and `Z`/offset, no milliseconds, between the cycle start and now); the server keeps its own `created_at`.
  - `idempotency_key` (1-80 chars of letters, digits, `.`, `_`, `:`, `-`) is required: same key + same payload returns the original record (201), changed payload is `409 idempotency_conflict`.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Reconcile population (population adjustment)**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Derived numbers (population, stock, outstanding, totals) are authoritative on the server: refetch the affected resource and the dashboard after saving.
  - Do not subtract the heads client-side; refetch `GET /production-cycles/{id}` for `livestock.current_population`.

  Full reference (errors, all fields): folder **09 — Operational Records** -> "Record mortality".
url: "{{base_url}}/records"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "type": "mortality",
      "production_cycle_id": "{{cycle_id}}",
      "recorded_at": "{{recorded_at_3h}}",
      "idempotency_key": "{{mort_key}}",
      "details": {
        "quantity": 5,
        "cause": "Heat stress during the afternoon"
      },
      "notes": "Found during evening inspection"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("mort_key", pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("record_mortality_id", String(v)); else console.warn("Could not capture record_mortality_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/9. Record mortality.resources/examples
order: 9000
