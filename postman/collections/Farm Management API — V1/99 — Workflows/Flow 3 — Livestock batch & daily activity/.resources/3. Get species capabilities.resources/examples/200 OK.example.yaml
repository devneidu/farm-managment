  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "species": {
            "id": "01a1045c-d7f0-734f-8a02-23e21113b497",
            "code": "chicken",
            "name": "Chicken"
          },
          "operation": {
            "id": "01a1045c-d7b1-7294-b14b-133938e3f44a",
            "code": "poultry",
            "name": "Poultry",
            "category": "livestock",
            "tracking_model": "population"
          },
          "capabilities": [
            {
              "code": "supports_group_tracking",
              "label": "Supports group tracking",
              "enabled": true,
              "reference": null
            },
            {
              "code": "supports_individual_tracking",
              "label": "Supports individual tracking",
              "enabled": false,
              "reference": null
            }
          ]
        },
        "meta": {},
