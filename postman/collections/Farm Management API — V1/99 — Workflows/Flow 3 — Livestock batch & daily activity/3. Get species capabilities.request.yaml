$kind: http-request
description: |-
  **IN THIS FLOW**
  Capability flags drive which record types exist for this species.

  **WHAT IT DOES**
  All 11 behaviours for a species, each with `enabled` and an optional biological `reference` (for example `{incubation_days: 21}` or a range `{gestation_days_min, gestation_days_max}`). Show or hide form sections from `enabled` instead of testing species names.

  **WHEN TO USE IT**
  Deciding which form sections/record types to show for a species.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{species_chicken_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `master_data.view` (taken from the current farm context; never sent by the client).
  - Reference values are starting points, not guarantees, not farm targets and not recorded outcomes. A range is never collapsed to a midpoint.
  - Examples of capability codes: `produces_eggs`, `produces_milk`, `supports_mortality`, `supports_feed_records`, `supports_live_weight`.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Start a livestock batch**.

  **FRONTEND NOTES**
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **05 — Master Data** -> "Get species capabilities".
url: "{{base_url}}/master/species/{{species_chicken_id}}/capabilities"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/3. Get species capabilities.resources/examples
order: 3000
