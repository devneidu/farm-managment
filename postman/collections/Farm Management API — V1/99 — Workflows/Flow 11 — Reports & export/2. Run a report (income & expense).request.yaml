$kind: http-request
description: |-
  **WHAT IT DOES**
  Runs one report as JSON and returns `columns`, `rows`, `summary` (over ALL rows, not the page), `filters`, `timezone`, `generated_at` and `notes`. Reports are read-only derivations; nothing is stored.

  **WHEN TO USE IT**
  The report viewer (income & expense).

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `report.view` (taken from the current farm context; never sent by the client).
  - Query: `from`, `to` (inclusive farm-local days, default the last 30 days), `as_of` (point-in-time reports), `production_cycle_id`, `kind`, `status`, `page`, `per_page` (1-500, default 100). Filters a report does not list in its catalogue entry are ignored.
  - A report needs `report.view` AND the permissions of the data it reads (`403 forbidden`); advanced reports also need `advanced_reports` (`403 feature_not_available`). Unknown code: `404 report_not_found`.
  - Column `type`: `string`, `integer`, `decimal`, `money`, `percent`, `date`, `datetime`. Decimals, money and percentages are STRINGS - never floats. Quantities are in the canonical unit (g, ml, piece) and never added across units.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Request a report export**.

  **FRONTEND NOTES**
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Drive the table from `columns` and format by `type`; do not hard-code report layouts.

  Full reference (errors, all fields): folder **19 — Reports & Exports** -> "Run a report (income & expense)".
url: "{{base_url}}/reports/income_expense?from={{month_start}}&to={{today}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: from
    value: "{{month_start}}"
  - key: to
    value: "{{today}}"
  - key: as_of
    value: ""
    disabled: true
    description: string (date)
  - key: production_cycle_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: kind
    value: ""
    disabled: true
    description: "enum: livestock | crop"
  - key: status
    value: ""
    disabled: true
    description: "enum: active | closed | completed | cancelled"
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 500
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/2. Run a report (income & expense).resources/examples
order: 2000
