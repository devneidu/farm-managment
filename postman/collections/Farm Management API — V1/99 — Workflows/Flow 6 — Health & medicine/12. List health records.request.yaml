$kind: http-request
description: |-
  **WHAT IT DOES**
  Paginated health records, newest first (reversals included). Filters: `production_cycle_id`, `type` (including `reversal`), `inventory_item_id` (records using that medicine), `recorded_from`/`recorded_to` (inclusive farm-local days), `page`, `per_page`.

  **WHEN TO USE IT**
  The health history of a batch.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `health.view` (taken from the current farm context; never sent by the client).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Show a health record with its medicine lines**.

  **FRONTEND NOTES**
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **ACCESS**
  Required backend farm permission: **`health.view`** — granted to: `owner`, `manager`, `farm_worker`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/health-records`

  Full reference (errors, all fields): folder **11 — Health** -> "List health records".
url: "{{base_url}}/health-records?production_cycle_id={{cycle_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: production_cycle_id
    value: "{{cycle_id}}"
  - key: type
    value: ""
    disabled: true
    description: "enum: vaccination | medication | deworming | treatment | disease_issue | vet_visit | reversal"
  - key: problem_type
    value: ""
    disabled: true
    description: "enum: breathing | digestive | worms_internal_parasites | skin_external_parasites | nervous | leg_foot_movement | eye | injury_wound | reproduction_udder_laying | weak_not_eating | sudden_death_unknown | routine_prevention | other"
  - key: inventory_item_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: recorded_from
    value: ""
    disabled: true
    description: string (date)
  - key: recorded_to
    value: ""
    disabled: true
    description: string (date)
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/12. List health records.resources/examples
order: 12000
