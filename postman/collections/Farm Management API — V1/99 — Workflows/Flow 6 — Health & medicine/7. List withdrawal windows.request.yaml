$kind: http-request
description: |-
  **IN THIS FLOW**
  Active windows with `ends_at`.

  **WHAT IT DOES**
  Medicine withdrawal windows traceable to the health record, medicine and lot that caused them. `active=1` (default) lists windows that have not ended; `0` includes ended ones.

  **WHEN TO USE IT**
  Warning banners when selling eggs/milk/meat; "withdrawal" screen.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `health.view` (taken from the current farm context; never sent by the client).
  - Reversed records never appear. There is no farm-wide "blocked" flag and sales/harvest are not blocked automatically: the UI decides what to warn about from this list.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Record a disease issue (no medicines)**.

  **FRONTEND NOTES**
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **11 — Health** -> "List withdrawal windows".
url: "{{base_url}}/health/withdrawals?production_cycle_id={{cycle_id}}&active=1"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: production_cycle_id
    value: "{{cycle_id}}"
  - key: active
    value: "1"
  - key: inventory_item_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/7. List withdrawal windows.resources/examples
order: 7000
