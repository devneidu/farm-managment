$kind: http-request
description: |-
  **IN THIS FLOW**
  The 50 ml came back to the same lot.

  **WHAT IT DOES**
  The reversed medication returned its 50 ml to the same lot.

  **WHEN TO USE IT**
  Re-reading the medicine to display stock after a reversal.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{item_med_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `health.view` (taken from the current farm context; never sent by the client).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **List health records**.

  **FRONTEND NOTES**
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **ACCESS**
  Required backend farm permission: **`health.view`** — granted to: `owner`, `manager`, `farm_worker`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/health/medicines/{{item_med_id}}`

  Full reference (all fields, errors, rules): folder **11 — Health** -> "Re-read the medicine after the reversal".

  Full reference (errors, all fields): folder **11 — Health** -> "Re-read the medicine after the reversal".
url: "{{base_url}}/health/medicines/{{item_med_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/11. Re-read the medicine after the reversal.resources/examples
order: 11000
