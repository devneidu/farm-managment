$kind: http-request
description: |-
  **IN THIS FLOW**
  Default withdrawal of 7 days for FUTURE lines.

  **WHAT IT DOES**
  Stores the medicine's default withdrawal period (days before animal products are safe). `default_withdrawal_days` is required (`null` clears it). It applies to FUTURE health lines only; past lines keep the value they were saved with.

  **WHEN TO USE IT**
  Setting a medicine's default withdrawal period in medicine settings.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{item_med_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `health.manage` (taken from the current farm context; never sent by the client).
  - The item must be a `medicine` item (other categories are `404`).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **List medicines with derived stock and withdrawal profile**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **11 — Health** -> "Set a medicine's default withdrawal period".
url: "{{base_url}}/health/medicines/{{item_med_id}}/profile"
method: PUT
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "default_withdrawal_days": 7,
      "notes": "Lasota - hold eggs and meat for 7 days"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/2. Set a medicine's default withdrawal period.resources/examples
order: 2000
