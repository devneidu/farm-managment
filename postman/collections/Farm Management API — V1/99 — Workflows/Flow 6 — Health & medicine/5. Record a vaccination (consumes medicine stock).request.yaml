$kind: http-request
description: |-
  **IN THIS FLOW**
  Consumes 250 ml from the vaccine lot and stores a 7-day withdrawal on the line. Captures `health_record_id`.

  **WHAT IT DOES**
  Records a vaccination that really happened. Each entry in `medicines` consumes stock through the inventory ledger (one `stock_out`, reason `use`) in the same transaction, and stores a withdrawal window on the line.

  **WHEN TO USE IT**
  "Record vaccination/treatment" on a batch.

  **IMPORTANT INPUTS**
  - `recorded_at` = when it really happened (UTC, no milliseconds); `idempotency_key` = one UUID per user action.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `health.create` (taken from the current farm context; never sent by the client).
  - Creates the health record, one line per medicine, one `stock_out` movement per line and a withdrawal window. No population, finance or task effect.
  - A health record is something that HAPPENED (a vaccination given, a vet visit). It is immutable: no PATCH/DELETE - correct with Reverse and an optional replacement (`corrects_record_id`).
  - `recorded_at` is the event time (UTC with seconds and `Z`/offset, between cycle start and now); `created_at` is when the system stored it.
  - `idempotency_key` is required (<=80 chars of `A-Za-z0-9._:-`): identical retry returns the original (201) and never deducts stock twice; same key with different content is `409 idempotency_conflict`.

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Re-read the medicine after the vaccination**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Unit codes come from `GET /master/units?dimension=...`; do not hard-code them.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Derived numbers (population, stock, outstanding, totals) are authoritative on the server: refetch the affected resource and the dashboard after saving.
  - After saving, refetch the medicine (`GET /health/medicines/{id}`) and the withdrawal list to update stock and withdrawal banners.

  Full reference (errors, all fields): folder **11 — Health** -> "Record a vaccination (consumes medicine stock)".
url: "{{base_url}}/health-records"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "production_cycle_id": "{{cycle_id}}",
      "type": "vaccination",
      "recorded_at": "{{recorded_at_2h}}",
      "idempotency_key": "{{vacc_key}}",
      "details": {
        "problem_type": "routine_prevention",
        "target_disease": "Newcastle disease"
      },
      "animals_affected": 490,
      "follow_up_on": "{{date_in_14d}}",
      "notes": "Whole flock, Pen 1",
      "medicines": [
        {
          "inventory_item_id": "{{item_med_id}}",
          "storage_location_id": "{{store_id}}",
          "lot_id": "{{lot_med_id}}",
          "components": [
            {
              "quantity": "250",
              "unit": "ml"
            }
          ],
          "dose_per_animal": [
            {
              "quantity": "0.3",
              "unit": "ml"
            }
          ],
          "dosage_instructions": "One drop per bird",
          "withdrawal_days": 7
        }
      ]
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("vacc_key", pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("health_record_id", String(v)); else console.warn("Could not capture health_record_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/5. Record a vaccination (consumes medicine stock).resources/examples
order: 5000
