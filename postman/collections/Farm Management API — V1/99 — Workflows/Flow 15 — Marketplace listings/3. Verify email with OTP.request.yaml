$kind: http-request
description: |-
  **IN THIS FLOW**
  Manual input: set `otp_code` from the log before running this step.

  Verify with the emailed code (`otp_code`; with MAIL_MAILER=log read it from storage/logs/laravel.log).
url: "{{base_url}}/auth/email/verify"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "{{otp_code}}"
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 3000
