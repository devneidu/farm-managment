$kind: http-request
description: Creates a draft shop owned by the caller.
url: "{{base_url}}/marketplace/shops"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Ada Poultry Hub",
      "tagline": "Fresh eggs daily",
      "seller_type": "business",
      "categories": [
        "livestock",
        "eggs_dairy"
      ],
      "description": "Layers, broilers and fresh crates of eggs delivered across Ibadan.",
      "state": "Oyo",
      "city": "Ibadan",
      "area": "Bodija"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        { const v = json.data.id; if (v !== undefined && v !== null) { pm.environment.set("shop_id", v); } }
        { const v = json.data.slug; if (v !== undefined && v !== null) { pm.environment.set("shop_slug", v); } }
      }
    language: text/javascript
examples: ./.resources/4. Create a shop.resources/examples
order: 4000
