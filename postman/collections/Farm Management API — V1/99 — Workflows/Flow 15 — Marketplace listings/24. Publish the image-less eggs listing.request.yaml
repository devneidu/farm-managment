$kind: http-request
description: "An image-less listing is valid: the public sees `image.source = placeholder`, `has_image = false`, `url = null` and a `placeholder_kind`."
url: "{{base_url}}/marketplace/shops/{{shop_id}}/listings/{{listing_b_id}}/publish"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        pm.test("Placeholder indicator", function () { pm.expect(json.data.image.source).to.eql("placeholder"); pm.expect(json.data.image.has_image).to.eql(false); pm.expect(json.data.image.url).to.eql(null); });
      }
    language: text/javascript
examples: ./.resources/24. Publish the image-less eggs listing.resources/examples
order: 24000
