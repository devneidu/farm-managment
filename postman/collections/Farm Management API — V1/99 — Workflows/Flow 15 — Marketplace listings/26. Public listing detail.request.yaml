$kind: http-request
description: "**Public.** Addressed by `slug`. `404` for anything not currently public (draft, paused, archived, restricted, or a shop that is not active). Includes all photos."
url: "{{base_url}}/public/marketplace/listings/{{listing_slug}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        pm.test("Allow-listed payload", function () { pm.expect(json.data).to.not.have.property("farm_id"); pm.expect(json.data).to.not.have.property("version"); pm.expect(json.data.quantity.basis).to.eql("seller_declared"); });
      }
    language: text/javascript
examples: ./.resources/26. Public listing detail.resources/examples
order: 26000
