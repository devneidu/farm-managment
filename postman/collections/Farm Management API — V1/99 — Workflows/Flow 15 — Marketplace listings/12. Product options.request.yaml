$kind: http-request
description: |-
  **IN THIS FLOW**
  Build the form from this response; never hard-code kinds or units.

  **WHAT IT DOES**
  One call returns everything the listing form needs: product kinds, for each the allowed selling units (with `integer_only`, `decimal_places`, `requires_package_details`) and the existing species / crop types to pick from, plus the fulfilment, dispatch and delivery-charge vocabularies, package content units and limits.

  **NOTES**
  Sign-in + verified email only; **no farm**. Never hard-code kinds or units.
url: "{{base_url}}/marketplace/product-options"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        { const v = (json.data.kinds.find(k => k.code === 'livestock').products.find(p => p.code === 'chicken') || {}).id; if (v !== undefined && v !== null) { pm.environment.set("species_chicken_id", v); } }
      }
    language: text/javascript
examples: ./.resources/12. Product options.resources/examples
order: 12000
