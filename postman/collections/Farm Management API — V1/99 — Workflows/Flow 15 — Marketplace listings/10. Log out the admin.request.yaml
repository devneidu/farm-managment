$kind: http-request
description: Ends the admin session.
url: "{{base_url}}/auth/logout"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
scripts:
  - type: afterResponse
    code: pm.test("Status is 200 or 204", function () { pm.expect(pm.response.code).to.be.oneOf([200, 204]); });
    language: text/javascript
order: 10000
