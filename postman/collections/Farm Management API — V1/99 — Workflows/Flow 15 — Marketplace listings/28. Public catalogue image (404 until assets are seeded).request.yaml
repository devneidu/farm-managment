$kind: http-request
description: "**Public.** An ILLUSTRATIVE catalogue image by `code`; `404` while the entry has no asset yet."
url: "{{base_url}}/public/marketplace/catalogue-images/chicken"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: pm.test("Status is 200 or 404", function () { pm.expect(pm.response.code).to.be.oneOf([200, 404]); });
    language: text/javascript
examples: ./.resources/28. Public catalogue image (404 until assets are seeded).resources/examples
order: 28000
