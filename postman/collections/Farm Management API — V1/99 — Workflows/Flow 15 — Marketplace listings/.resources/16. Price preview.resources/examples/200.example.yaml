$kind: http-example
request:
  url: "{{base_url}}/marketplace/shops/{{shop_id}}/listings/{{listing_id}}/price-preview"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Origin
      value: "{{frontend_origin}}"
      description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
    - key: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
      description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "quantity": "7"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "quantity": "7.000000",
          "unit": "head",
          "unit_price": "8000.00",
          "currency": "NGN",
          "binding": false,
          "note": "An estimate only. Nothing is reserved or agreed by this calculation.",
          "total": "56000.00",
          "total_minor": 5600000
        },
        "meta": {},
        "message": null
      }
order: 1000
