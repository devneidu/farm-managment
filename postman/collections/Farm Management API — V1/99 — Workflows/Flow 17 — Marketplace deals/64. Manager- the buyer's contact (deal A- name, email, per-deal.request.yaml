$kind: http-request
name: "64. Manager: the buyer's contact (deal A: name, email, per-deal phone)"
description: "**IN THIS FLOW**"
url: "{{base_url}}/marketplace/shops/{{shop_id}}/deals/{{deal_id}}/contact"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.eql(200); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      pm.test("Buyer channels", function () { const c = json.data.contact; pm.expect(json.data.party).to.eql("buyer"); pm.expect(c.channels.email).to.eql(pm.environment.get("deal_buyer_email")); pm.expect(c.channels.phone).to.eql("+2348055501234"); pm.expect(c.preferred_contact_method).to.eql("phone"); });
    language: text/javascript
order: 64000
