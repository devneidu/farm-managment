$kind: http-request
name: "72. Buyer 2: confirm the seller's terms - the deal exists now"
description: "**IN THIS FLOW**"
url: "{{base_url}}/marketplace/my/deal-confirmations/{{confirmation_id}}/confirm"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "accept_terms": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.eql(201); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      { const v = json.data.id; if (v !== undefined && v !== null) { pm.environment.set("deal_b_id", v); } }
      pm.test("Deal from the confirmation, pickup, no phone given", function () { const d = json.data; pm.expect(d.terms_source).to.eql("confirmed_intent"); pm.expect(d.terms.price_basis).to.eql("listed"); pm.expect(d.terms.product_total).to.eql("96000.00"); pm.expect(d.fulfilment.method).to.eql("pickup"); pm.expect(d.fulfilment.delivery_charge.mode).to.eql("not_applicable"); });
      pm.test("No private contact details in the response", function () { const t = pm.response.text(); ["+2348031234567","ada.private@example.com","12 Secret Street","+2348055501234",pm.environment.get("deal_buyer_email"),pm.environment.get("deal_buyer2_email")].filter(Boolean).forEach((s) => pm.expect(t).to.not.include(s)); });
    language: text/javascript
order: 72000
