$kind: http-request
description: "**IN THIS FLOW**"
url: "{{base_url}}/marketplace/shops"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Dayo Livestock Market",
      "tagline": "Layers and broilers",
      "seller_type": "business",
      "categories": [
        "livestock"
      ],
      "description": "Healthy poultry from our own pens, delivered across Oyo.",
      "state": "Oyo",
      "city": "Ibadan",
      "area": "Bodija"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.eql(201); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      { const v = json.data.id; if (v !== undefined && v !== null) { pm.environment.set("shop_id", v); } }
    language: text/javascript
order: 16000
