$kind: http-request
name: "50. Buyer 2: a stranger cannot read another buyer's deal"
description: "**IN THIS FLOW**"
url: "{{base_url}}/marketplace/my/deals/{{deal_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", function () { pm.expect(pm.response.code).to.eql(404); });
      const json = pm.response.json();
      pm.test("Error code not_found", function () { pm.expect(json.code).to.eql("not_found"); });
    language: text/javascript
order: 50000
