$kind: http-request
name: "90. Platform admin: both parties' contact (separately audited)"
description: "**IN THIS FLOW**"
url: "{{base_url}}/platform-admin/marketplace/deals/{{deal_b_id}}/contact"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.eql(200); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      pm.test("Both parties", function () { pm.expect(json.data.seller.channels.phone).to.eql("+2348031234567"); pm.expect(json.data.buyer.channels.email).to.eql(pm.environment.get("deal_buyer2_email")); pm.expect(json.data.deal.status).to.eql("cancelled"); });
    language: text/javascript
order: 90000
