$kind: http-request
description: "**IN THIS FLOW**"
url: "{{base_url}}/marketplace/shops/{{shop_id}}/deals/{{deal_id}}/contact"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 403", function () { pm.expect(pm.response.code).to.eql(403); });
      const json = pm.response.json();
      pm.test("Error code forbidden", function () { pm.expect(json.code).to.eql("forbidden"); });
    language: text/javascript
order: 57000
