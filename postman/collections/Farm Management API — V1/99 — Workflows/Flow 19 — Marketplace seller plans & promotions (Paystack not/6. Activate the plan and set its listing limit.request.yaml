$kind: http-request
description: |-
  **WHAT IT DOES**
  Role `admin`. `name, description, listing_limit, is_active, sort_order`. On the Free plan `listing_limit` is the free allowance (works while flags are off). Switching a paid plan on needs a limit and an active price (422). Audited.

  **ERRORS**
  `409` free_plan_required; `422`; `404`

  **BOUNDARY**
  Farmvest collects only its own service fees. No commission, escrow, wallet, payout or buyer-seller payment. Nothing is activated by a redirect: only server-side Paystack confirmation of reference, amount and currency activates a benefit.
url: "{{base_url}}/platform-admin/marketplace/seller-plans/{{admin_plan_id}}"
method: PATCH
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "listing_limit": 25,
      "is_active": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      pm.test("Plan active with limit 25", () => { pm.expect(json.data.is_active).to.eql(true); pm.expect(json.data.listing_limit).to.eql(25); });
    language: text/javascript
order: 6000
