$kind: http-request
description: |-
  **IN THIS FLOW**
  Server-to-server. Without a valid `x-paystack-signature` (HMAC-SHA512 of the raw body) it is 401 and nothing is touched. A signed delivery cannot be produced without the Paystack secret.
url: "{{base_url}}/public/marketplace/payments/paystack/webhook"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: x-paystack-signature
    value: "{{paystack_signature}}"
    description: HMAC-SHA512 of the raw body keyed with the Paystack secret. Only Paystack can send a valid one.
body:
  type: json
  content: |-
    {
      "event": "charge.success",
      "data": {
        "reference": "MSP-2026-00000"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 401", function () { pm.expect(pm.response.code).to.be.oneOf([401]); });
      pm.test("invalid_signature", () => pm.expect(pm.response.json().code).to.eql("invalid_signature"));
    language: text/javascript
order: 24000
