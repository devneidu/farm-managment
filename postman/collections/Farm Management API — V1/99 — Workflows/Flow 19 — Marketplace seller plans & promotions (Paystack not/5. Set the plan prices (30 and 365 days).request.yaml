$kind: http-request
description: |-
  **WHAT IT DOES**
  Role `admin`. `null` amount removes a price. Future checkouts only; a pending payment keeps its frozen amount. Audited.

  **ERRORS**
  `409` free_plan_has_no_price; `422`

  **BOUNDARY**
  Farmvest collects only its own service fees. No commission, escrow, wallet, payout or buyer-seller payment. Nothing is activated by a redirect: only server-side Paystack confirmation of reference, amount and currency activates a benefit.
url: "{{base_url}}/platform-admin/marketplace/seller-plans/{{admin_plan_id}}/prices"
method: PUT
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "prices": [
        {
          "interval_days": 30,
          "amount": "5000.00"
        },
        {
          "interval_days": 365,
          "amount": "50000.00"
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
    language: text/javascript
order: 5000
