$kind: http-request
description: |-
  **WHAT IT DOES**
  Role `admin`. Creates an INACTIVE paid plan; set prices, then switch it on. Audited.

  **INPUTS**
  - `code`, `name`, `listing_limit`, `description?`, `sort_order?`

  **ERRORS**
  `422`; `403`

  **BOUNDARY**
  Farmvest collects only its own service fees. No commission, escrow, wallet, payout or buyer-seller payment. Nothing is activated by a redirect: only server-side Paystack confirmation of reference, amount and currency activates a benefit.
url: "{{base_url}}/platform-admin/marketplace/seller-plans"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "seller_max",
      "name": "Seller Max",
      "listing_limit": 500
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      pm.environment.set("admin_plan_id", json.data.id);
      pm.environment.set("seller_plan_id", json.data.id);
    language: text/javascript
order: 4000
