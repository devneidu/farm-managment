$kind: http-request
description: |-
  **IN THIS FLOW**
  Rotates the token: copy the NEW one.

  **WHAT IT DOES**
  Issues a new link and a new 7-day expiry and emails it again; the previous link stops working.

  **WHEN TO USE IT**
  "Resend" on a pending/expired invitation.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{invitation_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `team.invite` (taken from the current farm context; never sent by the client).
  - Rotates the token and sends an email.
  - Resending an EXPIRED invitation re-checks the plan's team limit (`409 plan_limit_reached`). Only pending/expired invitations can be resent (`409 invitation_not_pending`).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Register the invitee**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **03 — Farms, Team & Access** -> "Resend an invitation".
url: "{{base_url}}/farm/invitations/{{invitation_id}}/resend"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/3. Resend an invitation.resources/examples
order: 3000
