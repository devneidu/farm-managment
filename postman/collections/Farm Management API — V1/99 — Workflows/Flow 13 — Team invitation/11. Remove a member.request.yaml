$kind: http-request
description: |-
  **IN THIS FLOW**
  Access is removed immediately.

  **WHAT IT DOES**
  Removes a member: they lose access to the farm immediately and can be re-invited. Their records stay and keep pointing at them.

  **WHEN TO USE IT**
  "Remove member".

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{membership_chidi_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `team.remove` (taken from the current farm context; never sent by the client).
  - Membership status `removed` (audited).
  - The last owner cannot be removed (`409 last_owner`). If this was the person's last membership their auth state becomes `next_action: "no_active_farm"` - they are NOT sent back to farm setup (`onboarded` is never cleared).

  **WHAT TO DO NEXT**
  Usual next request in the flow: **Log in as the invited member**.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  Full reference (errors, all fields): folder **03 — Farms, Team & Access** -> "Remove a member".
url: "{{base_url}}/farm/members/{{membership_chidi_id}}"
method: DELETE
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/11. Remove a member.resources/examples
order: 11000
