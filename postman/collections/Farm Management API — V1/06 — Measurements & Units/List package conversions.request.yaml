$kind: http-request
description: |-
  **WHAT IT DOES**
  This farm's package definitions, filterable by `context_type`, `context_id`, `package_unit` and `include_inactive`.

  **WHEN TO USE IT**
  Package conversion settings screen.

  **IMPORTANT INPUTS**
  - Query filters: `context_type`, `context_id`, `package_unit`, `include_inactive`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `measurement.view` (taken from the current farm context; never sent by the client).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`measurement.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/settings/package-conversions`

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `context_type` — enum. Values: `crop_type`, `inventory_item`, `custom`
  - `context_id` — string, max 36 chars
  - `package_unit` — string, max 32 chars
  - `include_inactive` — boolean

  **VARIABLES USED**
  - `{{context_id}}` — captured by "Create a measurement context"

  **SUCCESS**
  `200 OK`

  `data` is an array of objects with fields: `id`, `context`, `package_unit`, `target_unit`, `quantity_per_package`, `version`, `is_active`, `created_at`, `updated_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `measurement.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/settings/package-conversions?context_type=custom&context_id={{context_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: context_type
    value: custom
  - key: context_id
    value: "{{context_id}}"
  - key: package_unit
    value: ""
    disabled: true
    description: string — max 32 chars
  - key: include_inactive
    value: ""
    disabled: true
    description: boolean
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/List package conversions.resources/examples
order: 9000
