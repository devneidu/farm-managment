$kind: http-example
name: 201 Created — Package conversion created.
request:
  url: "{{base_url}}/settings/package-conversions"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "context_type": "inventory_item",
        "context_id": "{{item_feed_id}}",
        "package_unit": "bag",
        "target_unit": "kg",
        "quantity_per_package": "25"
      }
response:
  statusCode: 201
  statusText: Created
