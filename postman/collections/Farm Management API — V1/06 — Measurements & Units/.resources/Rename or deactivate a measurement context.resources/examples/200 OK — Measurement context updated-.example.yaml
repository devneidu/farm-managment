$kind: http-example
name: 200 OK — Measurement context updated.
request:
  url: "{{base_url}}/settings/measurement-contexts/{{context_id}}"
  method: PATCH
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "name": "Table eggs"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "01a1045e-4812-722e-a358-827f49841712",
          "name": "Table eggs",
          "is_active": true,
          "created_at": "2026-10-04T00:45:08+00:00",
          "updated_at": "2026-10-04T00:45:08+00:00"
        },
        "meta": {},
        "message": "Measurement context updated."
      }
order: 1000
