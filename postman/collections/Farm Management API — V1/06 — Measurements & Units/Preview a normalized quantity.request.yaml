$kind: http-request
description: |-
  **WHAT IT DOES**
  Live preview of what a compound entry ("3 crates + 14 eggs") normalises to - the same engine every module uses when saving. Use it to show the total as the user types.

  **WHEN TO USE IT**
  Live total preview while the user types a compound quantity such as "3 crates + 14 pieces".

  **IMPORTANT INPUTS**
  - Required body fields: `components`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `measurement.view` (taken from the current farm context; never sent by the client).
  - Package units (bag, crate, bottle) convert only through a context (`crop_type`, `custom` measurement context or `inventory_item`); without it the API answers `422 conversion_context_required`.
  - `entered` is what the user typed; `normalized` is the canonical-unit total (g, ml, m², °C or the count unit); `total` is in `result_unit` (default: package target unit).
  - A package unit needs `context`; otherwise `422 conversion_context_required` (or `ambiguous_conversion`). The API never guesses.
  - Nothing is stored.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Unit codes come from `GET /master/units?dimension=...`; do not hard-code them.
  - Units must come from `GET /master/units?dimension=...`.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`measurement.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `measurement-preview`: 120 per minute per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/measurements/normalize`

  **REQUEST BODY** (`application/json`)
  - `components` — array, **required**, min 1 items, max 10 items
  - `components[].quantity` — string, **required**
  - `components[].unit` — string, **required**, max 32 chars
  - `context` — object, optional
  - `context.type` — enum, **required**. What a package conversion is about. The context is what makes "1 bag = ? kg" answerable: a bag of maize and a bag of feed differ. Stored as a (type, id) pair - the id always identifies a real, validated entity, never display text - so later phases can add their own types (for example `inventory_item`, id = the item's UUID) without a schema change. . Values: `crop_type`, `inventory_item`, `custom`
  - `context.id` — string, **required**, max 36 chars
  - `result_unit` — string, optional, max 32 chars, nullable

  Server-owned fields — NOT accepted, sending any of them is a `422`: `farm_id`.

  **VARIABLES USED**
  - `{{context_id}}` — captured by "Create a measurement context"

  **BUSINESS RULES**
  - `entered` is what the user typed; `normalized` is the canonical-unit total (g, ml, m², °C or the count unit); `total` is in `result_unit` (default: package target unit).
  - A package unit needs `context`; otherwise `422 conversion_context_required` (or `ambiguous_conversion`). The API never guesses.
  - Nothing is stored.

  **SUCCESS**
  `200 OK`

  `data` fields: `entered`, `normalized`, `total`, `snapshot`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `measurement.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/measurements/normalize"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "components": [
        {
          "quantity": "3",
          "unit": "crate"
        },
        {
          "quantity": "14",
          "unit": "piece"
        }
      ],
      "context": {
        "type": "custom",
        "id": "{{context_id}}"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Preview a normalized quantity.resources/examples
order: 11000
