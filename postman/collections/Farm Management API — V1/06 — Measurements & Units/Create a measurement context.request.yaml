$kind: http-request
description: |-
  **WHAT IT DOES**
  Creates a custom context a package conversion can attach to (for example "Eggs" for crates of eggs).

  **WHEN TO USE IT**
  "+ Add" next to the context picker.

  **IMPORTANT INPUTS**
  - Required body fields: `name`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `measurement.manage` (taken from the current farm context; never sent by the client).
  - Duplicate name (ignoring case/spaces) is `409 measurement_context_exists` with `details.existing_id`.

  **WHAT TO DO NEXT**
  Define a package conversion for it.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`measurement.manage`** — granted to: `owner`, `manager`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `measurement-write`: 60 per hour per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/settings/measurement-contexts`

  **REQUEST BODY** (`application/json`)
  - `name` — string, **required**, max 100 chars, min 2 chars, pattern `^[\pL\pN][\pL\pN \-'.&()\/]*$`

  Server-owned fields — NOT accepted, sending any of them is a `422`: `farm_id`, `id`.

  **BUSINESS RULES**
  - Duplicate name (ignoring case/spaces) is `409 measurement_context_exists` with `details.existing_id`.
  - Requires `measurement.manage`.

  **SUCCESS**
  `201 Created` — message: "Measurement context created."

  `data` fields: `id`, `name`, `is_active`, `created_at`, `updated_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `measurement.manage`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `409` — A context with this name already exists.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/settings/measurement-contexts"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "name": "Eggs"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("context_id", String(v)); else console.warn("Could not capture context_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/Create a measurement context.resources/examples
order: 6000
