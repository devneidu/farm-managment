$kind: http-request
description: |-
  **WHAT IT DOES**
  The signed-in user's own profile (`id`, `email`, `name`, verification/provider info). It is user-level, not farm-scoped.

  **WHEN TO USE IT**
  The profile/account settings screen.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Needs only a verified email (no farm required), so it also works for a user who has no active farm.

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — signed-in, email-verified user (no farm needed).

  **ACCESS**
  Any verified user.

  **URL**
  `GET {{base_url}}/account`

  **BUSINESS RULES**
  - Needs only a verified email (no farm required), so it also works for a user who has no active farm.

  **SUCCESS**
  `200 OK`

  `data` fields: `id`, `name`, `email`, `email_verified_at`, `has_password`, `providers`, `locale`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — other codes: `account_suspended`, `email_verification_required`.
url: "{{base_url}}/account"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Get my account.resources/examples
order: 2000
