$kind: http-request
description: |-
  **WHAT IT DOES**
  Changes the signed-in user's password. Other sessions of the account are not revoked by this call.

  **WHEN TO USE IT**
  "Change password" in account settings.

  **IMPORTANT INPUTS**
  - Required body fields: `current_password`, `password`, `password_confirmation`.

  **IMPORTANT BEHAVIOR**
  - Updates the password hash.
  - `current_password` must match; the new password needs 8-72 characters with a letter and a number and a matching `password_confirmation`.
  - A Google-only account that never set a password gets `409 password_not_set`.
  - Rate limited.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — signed-in, email-verified user (no farm needed). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Any verified user.
  Rate limited by limiter `account-password`: 5 per 10 minutes per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `PUT {{base_url}}/account/password`

  **REQUEST BODY** (`application/json`)
  - `current_password` — string, **required**, max 255 chars
  - `password` — string, **required**
  - `password_confirmation` — string, **required**

  **VARIABLES USED**
  - `{{password}}` — Environment input: the farm owner's password.
  - `{{new_password}}` — Environment input: a new password used by the password reset / change requests.

  **BUSINESS RULES**
  - `current_password` must match; the new password needs 8-72 characters with a letter and a number and a matching `password_confirmation`.
  - A Google-only account that never set a password gets `409 password_not_set`.
  - Rate limited.

  **SUCCESS**
  `200 OK` — message: "Password changed."

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — other codes: `account_suspended`, `email_verification_required`.
  - `409` — `password_not_set`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/account/password"
method: PUT
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_password": "{{password}}",
      "password": "{{new_password}}",
      "password_confirmation": "{{new_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        pm.environment.set("password", pm.variables.replaceIn("{{new_password}}"));
      }
    language: text/javascript
examples: ./.resources/Change my password.resources/examples
order: 4000
