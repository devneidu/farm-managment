$kind: http-request
description: "**Public - no authentication.** ACTIVE shops only. Filters `q, state, city, category, seller_type, verified (1/0), sort=newest|name, per_page<=50`. Returns the public allow-list only; `contact_methods` names channels, never values."
url: "{{base_url}}/public/marketplace/shops?q=poultry&state=Oyo&category=livestock&verified=1&sort=newest&per_page=20"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
queryParams:
  q: poultry
  state: Oyo
  category: livestock
  verified: "1"
  sort: newest
  per_page: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
order: 16000
