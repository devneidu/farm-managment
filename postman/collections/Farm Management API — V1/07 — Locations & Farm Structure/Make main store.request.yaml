$kind: http-request
description: |-
  **WHAT IT DOES**
  Marks the store as the farm's main store (where stock goes when no store is named). The previous main store stops being main. Idempotent. Requires `location.manage`.
  
  The main store cannot be deactivated: `PATCH /storage-locations/{id}` with `is_active:false` is `409 main_store_required` until another store is made main. Only an active store can be main (`409 location_inactive`).
  
  `POST {{base_url}}/storage-locations/{{store_id}}/make-main`
url: "{{base_url}}/storage-locations/{{store_id}}/make-main"
method: POST
headers:
  - key: Accept
    value: "application/json"
  - key: Origin
    value: "{{frontend_origin}}"
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
  - key: Content-Type
    value: "application/json"
examples: ./.resources/Make main store.resources/examples
order: 9003
