$kind: http-request
description: |-
  **WHAT IT DOES**
  A batch location (called a *production area* in the API) is where a batch or crop project physically lives (pen, pond, field, plot). Cycles reference it through `production_area_id`.

  **WHEN TO USE IT**
  "Add pen/pond/plot", or inline inside the batch/project form.

  **IMPORTANT INPUTS**
  - Required body fields: `name`, `type`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `location.manage` (taken from the current farm context; never sent by the client).
  - `type`: `house`, `pen`, `pond`, `field`, `plot`, `other`. `parent_id` must be a location of this farm.
  - Zero batch locations is valid: cycles can omit the area.

  **WHAT TO DO NEXT**
  Use the returned `id` as `production_area_id`.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`location.manage`** — granted to: `owner`, `manager`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `location-write`: 60 per hour per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/production-areas`

  **REQUEST BODY** (`application/json`)
  - `name` — string, **required**, max 100 chars, min 1 chars
  - `type` — enum, **required**. Values: `house`, `pen`, `pond`, `field`, `plot`, `other`
  - `parent_id` — string (uuid), optional, nullable. Always references a location, never a batch location or storage location.
  - `is_active` — boolean, optional

  **VARIABLES USED**
  - `{{location_id}}` — captured by "Create a location"

  **BUSINESS RULES**
  - `type`: `house`, `pen`, `pond`, `field`, `plot`, `other`. `parent_id` must be a location of this farm.
  - Zero batch locations is valid: cycles can omit the area.
  - Requires `location.manage`.

  **SUCCESS**
  `201 Created` — message: "Place created."

  `data` fields: `id`, `kind`, `name`, `type`, `type_label`, `parent_id`, `path`, `path_label`, `depth`, `is_active`, `created_at`, `updated_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `location.manage`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `409` — `duplicate_location`, `location_inactive`, `location_depth_exceeded`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/production-areas"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "name": "Pen 1",
      "type": "pen",
      "parent_id": "{{location_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("area_id", String(v)); else console.warn("Could not capture area_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/Create a batch location (pen, house, pond or plot).resources/examples
order: 6000
