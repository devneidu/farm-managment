$kind: http-example
name: 409 — The main store cannot be deactivated
request:
  url: "{{base_url}}/storage-locations/{{store_id}}/make-main"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "This is the main store. Make another store the main store before deactivating it.",
        "code": "main_store_required",
        "request_id": "01a1b13d-de56-7377-b9dc-4beda577ccc7"
      }
