$kind: http-example
request:
  url: "{{base_url}}/locations"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "name": "Poultry House 1",
        "type": "house"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "This kind of place already has that name under this parent, including inactive places.",
        "code": "duplicate_location",
        "request_id": "01a1045e-4ae8-73c9-a17c-e5035052501f"
      }
order: 2000
