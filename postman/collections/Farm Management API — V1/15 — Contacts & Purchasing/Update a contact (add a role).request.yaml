$kind: http-request
description: |-
  **WHAT IT DOES**
  Edits a contact. Deactivating (`is_active: false`) hides it from NEW documents (`409 contact_inactive`) but keeps history.

  **WHEN TO USE IT**
  Editing a contact or adding a role.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{supplier_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `contact.manage` (taken from the current farm context; never sent by the client).
  - A supplier with purchases cannot lose the supplier role and a customer with sales cannot lose the customer role (`409 contact_in_use`).

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`contact.manage`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `finance-write`: 240 per hour per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `PATCH {{base_url}}/contacts/{{supplier_id}}`

  **PATH PARAMETERS**
  - `{{supplier_id}}` — UUID. Captured by "Create a contact (supplier)" (15 — Contacts & Purchasing) or from the list endpoint of this resource.

  **REQUEST BODY** (`application/json`)
  - `name` — string, optional, max 150 chars
  - `kind` — enum, optional. Values: `person`, `business`
  - `roles` — array, optional, min 1 items, max 2 items. Values: `supplier`, `customer`
  - `phone` — string, optional, max 40 chars, nullable
  - `email` — string (email), optional, max 190 chars, nullable
  - `address` — string, optional, max 500 chars, nullable
  - `notes` — string, optional, max 5000 chars, nullable
  - `is_active` — boolean, optional. false = deactivate (history is kept; inactive contacts cannot be chosen on new purchases or transactions).

  **VARIABLES USED**
  - `{{supplier_id}}` — captured by "Create a contact (supplier)"

  **BUSINESS RULES**
  - A supplier with purchases cannot lose the supplier role and a customer with sales cannot lose the customer role (`409 contact_in_use`).

  **SUCCESS**
  `200 OK` — message: "Contact updated."

  `data` fields: `id`, `name`, `kind`, `roles`, `phone`, `email`, `address`, `notes`, `is_active`, `created_by`, `created_at`, `updated_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `contact.manage`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `409` — `contact_exists`, `contact_in_use`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/contacts/{{supplier_id}}"
method: PATCH
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "roles": [
        "supplier",
        "customer"
      ],
      "notes": "Also buys our spent layers"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Update a contact (add a role).resources/examples
order: 5000
