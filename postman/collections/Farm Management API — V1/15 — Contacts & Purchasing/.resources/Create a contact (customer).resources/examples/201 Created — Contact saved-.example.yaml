$kind: http-example
name: 201 Created — Contact saved.
request:
  url: "{{base_url}}/contacts"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "name": "Mama Put Restaurant",
        "kind": "business",
        "roles": [
          "customer"
        ],
        "phone": "08030000000",
        "address": "12 Market Road, Ibadan"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "01a1045e-8d77-7352-865c-f90431a3d690",
          "name": "Mama Put Restaurant",
          "kind": "business",
          "roles": [
            "customer"
          ],
          "phone": "08030000000",
          "email": null,
          "address": "12 Market Road, Ibadan",
          "notes": null,
          "is_active": true,
          "created_by": "01a1045e-3bbd-71f5-b8b6-0aa8ede5c0b5",
          "created_at": "2026-10-04T00:45:08.000000Z",
          "updated_at": "2026-10-04T00:45:08.000000Z"
        },
        "meta": {},
        "message": "Contact saved."
      }
order: 1000
