$kind: http-example
name: 422 — new_item.unit missing
request:
  url: "{{base_url}}/purchases"
  method: POST
  headers:
    - key: Accept
      value: "application/json"
    - key: Content-Type
      value: "application/json"
    - key: X-Farm-Id
      value: "{{farm_id}}"
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
      disabled: true
  body:
    type: json
    content: |-
      {
          "recorded_at": "{{recorded_at_2h}}",
          "idempotency_key": "{{purchase_key}}",
          "items": [
              {
                  "kind": "stock",
                  "new_item": {
                      "name": "Layer Mash",
                      "category": "feed"
                  },
                  "components": [
                      {
                          "quantity": "25",
                          "unit": "kg"
                      }
                  ],
                  "amount": "15000.00"
              }
          ]
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "message": "The items.0.new_item.unit field is required when items.0.new_item is present.",
          "code": "validation_failed",
          "request_id": "01a1c1e5-426a-7186-aaa4-e14d74dad801",
          "errors": {
              "items.0.new_item.unit": [
                  "The items.0.new_item.unit field is required when items.0.new_item is present."
              ]
          }
      }
