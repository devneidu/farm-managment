$kind: http-example
name: 201 Created — existing item reused (item_reused true)
request:
  url: "{{base_url}}/purchases"
  method: POST
  headers:
    - key: Accept
      value: "application/json"
    - key: Content-Type
      value: "application/json"
    - key: X-Farm-Id
      value: "{{farm_id}}"
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
