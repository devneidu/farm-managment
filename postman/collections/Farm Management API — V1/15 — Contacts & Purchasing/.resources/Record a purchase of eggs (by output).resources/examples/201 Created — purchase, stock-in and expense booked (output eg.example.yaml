$kind: http-example
name: 201 Created — purchase, stock-in and expense booked (output eggs)
request:
  url: "{{base_url}}/purchases"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "supplier_reference": "MKT-2210",
        "recorded_at": "{{recorded_at}}",
        "idempotency_key": "{{$guid}}",
        "notes": "Eggs bought at the market",
        "items": [
          {
            "kind": "stock",
            "output": "eggs",
            "storage_location_id": "{{store_id}}",
            "components": [
              {
                "quantity": "30",
                "unit": "piece"
              }
            ],
            "amount": "4500.00"
          }
        ]
      }
