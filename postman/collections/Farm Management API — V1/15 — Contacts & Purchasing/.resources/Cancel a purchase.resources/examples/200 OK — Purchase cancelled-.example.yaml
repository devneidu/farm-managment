$kind: http-example
name: 200 OK — Purchase cancelled.
request:
  url: "{{base_url}}/purchases/{{purchase_c_id}}/cancel"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "reason": "Supplier invoiced twice",
        "recorded_at": "{{recorded_at}}",
        "idempotency_key": "{{$guid}}"
      }
