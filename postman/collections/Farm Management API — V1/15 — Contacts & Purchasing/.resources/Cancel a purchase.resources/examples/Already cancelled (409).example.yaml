$kind: http-example
request:
  url: "{{base_url}}/purchases/{{purchase_c_id}}/cancel"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "reason": "Again",
        "recorded_at": "{{recorded_at}}",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "This purchase has already been cancelled.",
        "code": "purchase_already_cancelled",
        "request_id": "01a1045e-9242-73aa-9226-ad41b98eab68"
      }
order: 2000
