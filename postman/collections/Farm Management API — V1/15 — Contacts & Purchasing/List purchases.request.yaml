$kind: http-request
description: |-
  **WHAT IT DOES**
  Paginated purchases. Filters: `status` (`active`|`cancelled`), `contact_id`, `production_cycle_id`, `search` (reference or supplier reference), `from`/`to` (farm-local days), `page`, `per_page`.

  **WHEN TO USE IT**
  The purchases list.

  **IMPORTANT INPUTS**
  - Query filters: `status`, `contact_id`, `production_cycle_id`, `search`, `from`, `to`, `page`, `per_page`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `purchase.view` (taken from the current farm context; never sent by the client).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`purchase.view`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/purchases`

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `status` — enum. Values: `active`, `cancelled`
  - `contact_id` — string (uuid)
  - `production_cycle_id` — string (uuid)
  - `search` — string, max 100 chars
  - `from` — string (date)
  - `to` — string (date)
  - `page` — integer, min 1
  - `per_page` — integer, min 1, max 100

  **SUCCESS**
  `200 OK`

  `data` is an array of objects with fields: `id`, `reference`, `status`, `contact_id`, `contact_name`, `production_cycle_id`, `supplier_reference`, `recorded_at`, `total_amount`, `currency`, `finance_category`, `records_expense`, `finance_transaction_id`, `finance_reversal_transaction_id`, `notes`, `corrects_purchase_id`, `cancelled_at`, `cancel_reason`, `items`, `created_by`, `created_at`.

  `meta`: `current_page`, `per_page`, `last_page`, `total`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `purchase.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/purchases?status=active"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: status
    value: active
  - key: contact_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: production_cycle_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: search
    value: ""
    disabled: true
    description: string — max 100 chars
  - key: from
    value: ""
    disabled: true
    description: string (date)
  - key: to
    value: ""
    disabled: true
    description: string (date)
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/List purchases.resources/examples
order: 8000
