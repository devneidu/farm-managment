$kind: http-request
description: |-
  **WHAT IT DOES**
  One contact: `name`, `kind` (`person`|`business`), `roles` (`supplier` and/or `customer`), phone, email, address, notes and the active flag. Foreign contacts are `404`.

  **WHEN TO USE IT**
  A contact detail screen.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{supplier_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `contact.view` (taken from the current farm context; never sent by the client).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`contact.view`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/contacts/{{supplier_id}}`

  **PATH PARAMETERS**
  - `{{supplier_id}}` — UUID. Captured by "Create a contact (supplier)" (15 — Contacts & Purchasing) or from the list endpoint of this resource.

  **VARIABLES USED**
  - `{{supplier_id}}` — captured by "Create a contact (supplier)"

  **BUSINESS RULES**
  - Requires `contact.view` (Owner, Manager, Finance).

  **SUCCESS**
  `200 OK`

  `data` fields: `id`, `name`, `kind`, `roles`, `phone`, `email`, `address`, `notes`, `is_active`, `created_by`, `created_at`, `updated_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `contact.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
url: "{{base_url}}/contacts/{{supplier_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Show a contact.resources/examples
order: 4000
