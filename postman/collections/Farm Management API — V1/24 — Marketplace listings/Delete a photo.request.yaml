$kind: http-request
description: Removes the row and the stored file.
url: "{{base_url}}/marketplace/shops/{{shop_id}}/listings/{{listing_id}}/images/{{listing_image_id}}"
method: DELETE
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
examples: ./.resources/Delete a photo.resources/examples
order: 20000
