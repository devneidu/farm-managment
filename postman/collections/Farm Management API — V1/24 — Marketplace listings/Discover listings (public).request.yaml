$kind: http-request
description: "**Public - no authentication.** Only `published` listings of `active` shops. Filters: `q`, `product_kind`, `species`, `crop_type`, `state`, `city`, `min_price`, `max_price` (naira per unit; combine with `unit`), `unit`, `negotiable`, `fulfilment` (`pickup|seller_delivery`, a `both` listing matches either), `delivers_to`, `shop`, `verified`; `sort=newest|price_asc|price_desc|relevance`; `per_page` <=50. Quantities are `seller_declared`; contact details, farm ids and inventory are never returned."
url: "{{base_url}}/public/marketplace/listings?q=chicken&product_kind=livestock&min_price=1000&max_price=20000&unit=head&sort=price_asc&per_page=20"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
queryParams:
  q: chicken
  product_kind: livestock
  min_price: "1000"
  max_price: "20000"
  unit: head
  sort: price_asc
  per_page: "20"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        pm.test("Our published listing is in the feed", function () { pm.expect(json.data.map(l => l.slug)).to.include(pm.environment.get("listing_slug")); });
      }
    language: text/javascript
examples: ./.resources/Discover listings (public).resources/examples
order: 21000
