$kind: http-request
description: "Streams the stored image for shop members (drafts included). `X-Content-Type-Options: nosniff`."
url: "{{base_url}}/marketplace/shops/{{shop_id}}/listings/{{listing_id}}/images/{{listing_image_id}}/file"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 19000
