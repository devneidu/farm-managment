$kind: http-request
description: |-
  **WHAT IT DOES**
  Appends a `reversal` outcome and, when the original added population, one compensating reversal record (-live). The project returns to `active` so a replacement outcome can be recorded.

  **WHEN TO USE IT**
  "Undo" a wrong outcome; then record a replacement if needed.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{breeding_project_b_id}}`, `{{outcome_b_id}}`.
  - Required body fields: `reason`, `recorded_at`, `idempotency_key`.
  - `recorded_at` = when it really happened (UTC, no milliseconds); `idempotency_key` = one UUID per user action.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `breeding.reverse` (taken from the current farm context; never sent by the client).
  - Reversal outcome + compensating population movement.
  - `409 insufficient_population` if the hatched animals have since died or been sold. A reversal cannot be reversed (`409 outcome_already_reversed`).
  - The generated `breeding_outcome` record cannot be reversed through `/records/{id}/reverse` (`409 reverse_via_breeding_outcome`).
  - This is a correction, not an edit: history is kept and a new opposite row is appended.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Derived numbers (population, stock, outstanding, totals) are authoritative on the server: refetch the affected resource and the dashboard after saving.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`breeding.reverse`** — granted to: `owner`, `manager`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `breeding-write`: 120 per hour per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/breeding-projects/{{breeding_project_b_id}}/outcomes/{{outcome_b_id}}/reverse`

  **PATH PARAMETERS**
  - `{{breeding_project_b_id}}` — UUID. Captured by "Start a breeding project (second attempt)" (12 — Breeding) or from the list endpoint of this resource.
  - `{{outcome_b_id}}` — UUID. Captured by "Record an outcome (second project)" (12 — Breeding) or from the list endpoint of this resource.

  **REQUEST BODY** (`application/json`)
  - `reason` — string, **required**, max 2000 chars
  - `recorded_at` — string (date-time), **required**, `YYYY-MM-DDTHH:MM:SS` + `Z` or `+HH:MM` (no milliseconds)
  - `idempotency_key` — string, **required**, max 80 chars, pattern `^[A-Za-z0-9._:-]+$`

  **VARIABLES USED**
  - `{{breeding_project_b_id}}` — captured by "Start a breeding project (second attempt)"
  - `{{outcome_b_id}}` — captured by "Record an outcome (second project)"

  **BUSINESS RULES**
  - `409 insufficient_population` if the hatched animals have since died or been sold. A reversal cannot be reversed (`409 outcome_already_reversed`).
  - The generated `breeding_outcome` record cannot be reversed through `/records/{id}/reverse` (`409 reverse_via_breeding_outcome`).
  - Requires `breeding.reverse` (Owner, Manager).

  **SUCCESS**
  `201 Created` — message: "Reversal recorded."

  `data` fields: `id`, `breeding_project_id`, `production_cycle_id`, `kind`, `live_count`, `loss_count`, `outcome_date`, `operational_record_id`, `reverses_outcome_id`, `corrects_outcome_id`, `reversed_by_outcome_id`, `reason`, `recorded_at`, `notes`, `created_by`, `created_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `breeding.reverse`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `409` — `cycle_closed`, `outcome_already_reversed`, `idempotency_conflict`, `insufficient_population`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/breeding-projects/{{breeding_project_b_id}}/outcomes/{{outcome_b_id}}/reverse"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "reason": "Hatch count entered for the wrong batch",
      "recorded_at": "{{recorded_at}}",
      "idempotency_key": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Reverse a breeding outcome.resources/examples
order: 9000
