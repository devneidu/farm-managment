$kind: http-request
description: |-
  **WHAT IT DOES**
  A derived timeline: `started`, `expected_outcome` (exact date or window; status `pending`, `overdue`, `done`, `cancelled`, `not_estimated`), each check, and the actual outcome.

  **WHEN TO USE IT**
  The timeline tab of a breeding project.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{breeding_project_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `breeding.view` (taken from the current farm context; never sent by the client).
  - Expected dates are reference information, not promises.

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`breeding.view`** — granted to: `owner`, `manager`, `farm_worker`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/breeding-projects/{{breeding_project_id}}/milestones`

  **PATH PARAMETERS**
  - `{{breeding_project_id}}` — UUID. Captured by "Start a breeding project (incubation)" (12 — Breeding) or from the list endpoint of this resource.

  **VARIABLES USED**
  - `{{breeding_project_id}}` — captured by "Start a breeding project (incubation)"

  **BUSINESS RULES**
  - Expected dates are reference information, not promises.

  **SUCCESS**
  `200 OK`

  `data` is an array of objects with fields: `code`, `date`, `from`, `to`, `status`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `breeding.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
url: "{{base_url}}/breeding-projects/{{breeding_project_id}}/milestones"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Project milestones.resources/examples
order: 6000
