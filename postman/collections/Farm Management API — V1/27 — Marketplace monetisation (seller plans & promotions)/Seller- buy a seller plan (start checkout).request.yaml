$kind: http-request
name: "Seller: buy a seller plan (start checkout)"
description: |-
  **WHAT IT DOES**
  Needs `billing.manage` (owner, manager). Creates a PENDING payment at the current configured price (frozen) and returns `authorization_url` for Paystack. Nothing is activated. Prepaid; renewing the same plan extends the current period. A repeat within 30 minutes returns the same pending payment (200).

  **INPUTS**
  - `plan_id`, `interval_days` 30|365

  **ERRORS**
  `409` monetisation_disabled, plan_not_purchasable, subscription_active, shop_not_active; `403` staff; `422`; `502` gateway_unavailable; `503` payments_unavailable

  **BOUNDARY**
  Farmvest collects only its own service fees. No commission, escrow, wallet, payout or buyer-seller payment. Nothing is activated by a redirect: only server-side Paystack confirmation of reference, amount and currency activates a benefit.
url: "{{base_url}}/marketplace/shops/{{shop_id}}/subscription/checkout"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "plan_id": "{{seller_plan_id}}",
      "interval_days": 30
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200, 201 (502/503 when Paystack is not configured or reachable)", function () { pm.expect(pm.response.code).to.be.oneOf([200, 201, 502, 503]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        { const v = json.data.reference; if (v !== undefined && v !== null) { pm.environment.set("payment_reference", v); } }
      }
    language: text/javascript
order: 5000
