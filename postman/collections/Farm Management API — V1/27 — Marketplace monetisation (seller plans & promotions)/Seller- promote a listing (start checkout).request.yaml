$kind: http-request
name: "Seller: promote a listing (start checkout)"
description: |-
  **WHAT IT DOES**
  Needs `billing.manage`. The listing must be published and not already promoted. Same payment flow; the promotion starts when payment is confirmed.

  **INPUTS**
  - `package_id`

  **ERRORS**
  `409` monetisation_disabled, package_not_available, listing_not_promotable, promotion_active, shop_not_active; `403`; `404`; `422`; `502`; `503`

  **BOUNDARY**
  Farmvest collects only its own service fees. No commission, escrow, wallet, payout or buyer-seller payment. Nothing is activated by a redirect: only server-side Paystack confirmation of reference, amount and currency activates a benefit.
url: "{{base_url}}/marketplace/shops/{{shop_id}}/listings/{{listing_id}}/promotions/checkout"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "package_id": "{{promotion_package_id}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200, 201 (502/503 when Paystack is not configured or reachable)", function () { pm.expect(pm.response.code).to.be.oneOf([200, 201, 502, 503]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        { const v = json.data.reference; if (v !== undefined && v !== null) { pm.environment.set("payment_reference", v); } }
      }
    language: text/javascript
order: 6000
