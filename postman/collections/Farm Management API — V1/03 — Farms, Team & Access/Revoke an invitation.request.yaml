$kind: http-request
description: |-
  **WHAT IT DOES**
  Revokes a pending invitation so its link no longer works. Frees the team-limit slot.

  **WHEN TO USE IT**
  "Revoke" on a pending invitation.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{invitation_b_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `team.invite` (taken from the current farm context; never sent by the client).
  - Invitation status `revoked`.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`team.invite`** — granted to: `owner`, `manager`. (Documentation only: the request never contains a permission string.)

  **URL**
  `DELETE {{base_url}}/farm/invitations/{{invitation_b_id}}`

  **PATH PARAMETERS**
  - `{{invitation_b_id}}` — UUID. Captured by "Invite a team member (finance)" (03 — Farms, Team & Access) or from the list endpoint of this resource.

  **VARIABLES USED**
  - `{{invitation_b_id}}` — captured by "Invite a team member (finance)"

  **BUSINESS RULES**
  - Requires `team.invite`. `409` if the invitation is not pending.

  **SUCCESS**
  `200 OK` — message: "Invitation revoked."

  `data` fields: `id`, `email`, `role`, `role_label`, `status`, `expires_at`, `last_sent_at`, `created_at`, `invited_by`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `team.invite`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `409` — Invitation already accepted or revoked.
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
url: "{{base_url}}/farm/invitations/{{invitation_b_id}}"
method: DELETE
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Revoke an invitation.resources/examples
order: 12000
