$kind: http-example
name: 200 OK — Role updated.
request:
  url: "{{base_url}}/farm/members/{{membership_chidi_id}}"
  method: PATCH
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "role": "finance"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "01a1045e-42b8-7333-bbde-81c209d462e2",
          "role": "finance",
          "role_label": "Finance",
          "status": "active",
          "joined_at": "2026-10-04T00:45:08+00:00",
          "is_current_user": false,
          "user": {
            "id": "01a1045e-4251-709f-a2f4-bfa626691fbc",
            "name": null,
            "email": "chidi.worker@example.com"
          }
        },
        "meta": {},
        "message": "Role updated."
      }
order: 1000
