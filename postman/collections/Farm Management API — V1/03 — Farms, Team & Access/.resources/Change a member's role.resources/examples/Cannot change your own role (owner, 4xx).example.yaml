$kind: http-example
request:
  url: "{{base_url}}/farm/members/{{membership_owner_id}}"
  method: PATCH
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "role": "manager"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "A farm must keep at least one owner. Ownership transfer is not supported yet.",
        "code": "last_owner",
        "request_id": "01a1045e-ba90-71ae-96c0-2cd2a05d06ae"
      }
order: 2000
