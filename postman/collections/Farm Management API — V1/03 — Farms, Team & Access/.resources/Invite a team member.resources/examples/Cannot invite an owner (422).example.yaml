$kind: http-example
request:
  url: "{{base_url}}/farm/invitations"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "email": "dr.bello.vet@example.com",
        "role": "owner"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The Owner role cannot be assigned. Ownership transfer is not supported yet.",
        "code": "ownership_transfer_unsupported",
        "request_id": "01a1045e-3f3c-730a-b79e-56bf0efd9c27"
      }
order: 3000
