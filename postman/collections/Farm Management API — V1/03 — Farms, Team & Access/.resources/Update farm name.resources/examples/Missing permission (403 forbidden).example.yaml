$kind: http-example
request:
  url: "{{base_url}}/farm"
  method: PATCH
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "name": "Okafor Integrated Farms Ltd"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "You are not allowed to perform this action.",
        "code": "forbidden",
        "request_id": "01a1045e-3e62-70d6-845c-5b3560ae8d78"
      }
order: 2000
