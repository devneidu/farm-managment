$kind: http-example
request:
  url: "{{base_url}}/farm"
  method: PATCH
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "name": ""
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The name field is required.",
        "code": "validation_failed",
        "request_id": "01a1045e-3e7a-72c8-aecd-b9fabcdf65ec",
        "errors": {
          "name": [
            "The name field is required."
          ]
        }
      }
order: 3000
