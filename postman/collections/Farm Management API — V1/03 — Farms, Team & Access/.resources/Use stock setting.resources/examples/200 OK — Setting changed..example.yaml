$kind: http-example
name: 200 OK — Setting changed.
request:
  url: "{{base_url}}/farm"
  method: PATCH
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "settings": {
          "use_stock_for_usage": true
        }
      }
