$kind: http-request
description: |-
  **WHAT IT DOES**
  The farm's subscription: `plan`, `status`, period dates, `cancel_at_period_end`, `effective_plan` and `subscription_inactive`. Every farm always has a subscription (new farms start on the default plan).

  **WHEN TO USE IT**
  Billing/plan screen.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `subscription.view` (taken from the current farm context; never sent by the client).
  - `effective_plan` is the plan actually honoured; when a paid period lapsed `subscription_inactive` is `true` and the default plan applies.

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`subscription.view`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/subscription`

  **BUSINESS RULES**
  - Requires `subscription.view` (Owner, Manager, Finance).
  - `effective_plan` is the plan actually honoured; when a paid period lapsed `subscription_inactive` is `true` and the default plan applies.

  **SUCCESS**
  `200 OK`

  `data` fields: `id`, `status`, `billing_interval`, `starts_at`, `current_period_start`, `current_period_end`, `cancel_at_period_end`, `cancelled_at`, `ends_at`, `subscription_inactive`, `plan`, `effective_plan`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `subscription.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
url: "{{base_url}}/subscription"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Get the farm subscription.resources/examples
order: 1000
