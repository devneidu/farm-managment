$kind: http-request
description: |-
  **WHAT IT DOES**
  Cancels a sale without rewriting history: compensating stock movements and population records are appended, an unpaid invoice is voided and the sale becomes `cancelled`.

  **WHEN TO USE IT**
  "Cancel sale".

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{sale_b_id}}`.
  - Required body fields: `reason`, `recorded_at`, `idempotency_key`.
  - `recorded_at` = when it really happened (UTC, no milliseconds); `idempotency_key` = one UUID per user action.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `sale.cancel` (taken from the current farm context; never sent by the client).
  - Compensating movements/records, invoice void, sale `cancelled`. No money.
  - MONEY IS NEVER IMPLIED: while payments are live the cancel is `409 sale_has_payments` (`details.amount_paid`). Reverse the payments first.
  - `409 cycle_closed` when a livestock cycle was closed; `409 sale_already_cancelled`.
  - A cancelled sale can be replaced once with `corrects_sale_id` on a new `POST /sales` (needs `sale.cancel`).
  - This is a correction, not an edit: history is kept and a new opposite row is appended.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Derived numbers (population, stock, outstanding, totals) are authoritative on the server: refetch the affected resource and the dashboard after saving.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`sale.cancel`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `finance-write`: 240 per hour per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/sales/{{sale_b_id}}/cancel`

  **PATH PARAMETERS**
  - `{{sale_b_id}}` — UUID. Captured by "Record a sale and issue its invoice in one step" (17 — Sales, Invoices & Payments) or from the list endpoint of this resource.

  **REQUEST BODY** (`application/json`)
  - `reason` — string, **required**, max 2000 chars
  - `recorded_at` — string (date-time), **required**, `YYYY-MM-DDTHH:MM:SS` + `Z` or `+HH:MM` (no milliseconds). When the goods/animals came back (explicit offset); the stock and population compensation is dated here.
  - `idempotency_key` — string, **required**, max 80 chars, pattern `^[A-Za-z0-9._:-]+$`

  **VARIABLES USED**
  - `{{sale_b_id}}` — captured by "Record a sale and issue its invoice in one step"

  **BUSINESS RULES**
  - MONEY IS NEVER IMPLIED: while payments are live the cancel is `409 sale_has_payments` (`details.amount_paid`). Reverse the payments first.
  - `409 cycle_closed` when a livestock cycle was closed; `409 sale_already_cancelled`.
  - A cancelled sale can be replaced once with `corrects_sale_id` on a new `POST /sales` (needs `sale.cancel`).
  - The sale's stock-out and population record cannot be reversed individually (`409 reverse_via_sale`).
  - Requires `sale.cancel` (Owner, Manager, Finance).

  **SUCCESS**
  `200 OK` — message: "Sale cancelled."

  `data` fields: `id`, `reference`, `status`, `contact_id`, `customer_name`, `recorded_at`, `total_amount`, `currency`, `finance_category`, `payment_status`, `amount_paid`, `outstanding`, `invoice`, `notes`, `corrects_sale_id`, `cancelled_at`, `cancel_reason`, `items`, `created_by`, `created_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `sale.cancel`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `409` — `sale_already_cancelled`, `sale_has_payments`, `cycle_closed`, `idempotency_conflict`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/sales/{{sale_b_id}}/cancel"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "reason": "Customer returned the manure",
      "recorded_at": "{{recorded_at}}",
      "idempotency_key": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Cancel a sale.resources/examples
order: 18000
