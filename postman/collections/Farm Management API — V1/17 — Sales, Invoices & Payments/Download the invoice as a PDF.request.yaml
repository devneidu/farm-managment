$kind: http-request
description: |-
  **WHAT IT DOES**
  Streams `application/pdf` (`Content-Disposition: inline; filename="INV-....pdf"`), rendered on demand from the snapshot plus live paid/balance figures.

  **WHEN TO USE IT**
  "Download PDF" / print.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{invoice_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `invoice.view` (taken from the current farm context; never sent by the client).
  - Rate limited (30/min). Cross-farm access is `404`.

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Fetch with credentials as a Blob and open/save it; do not link to it from another origin. Sending by email/WhatsApp is not part of V1.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`invoice.view`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `report-download`: 30 per minute per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `GET {{base_url}}/invoices/{{invoice_id}}/pdf`

  **PATH PARAMETERS**
  - `{{invoice_id}}` — UUID. Captured by "Issue the invoice for a sale" (17 — Sales, Invoices & Payments) or from the list endpoint of this resource.

  **VARIABLES USED**
  - `{{invoice_id}}` — captured by "Issue the invoice for a sale"

  **BUSINESS RULES**
  - Rate limited (30/min). Cross-farm access is `404`.

  **SUCCESS**
  `200 OK`

  Non-JSON body (`application/pdf`).

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `invoice.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/invoices/{{invoice_id}}/pdf"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
examples: ./.resources/Download the invoice as a PDF.resources/examples
order: 10000
