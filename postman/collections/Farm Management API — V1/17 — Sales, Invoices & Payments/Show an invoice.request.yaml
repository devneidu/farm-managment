$kind: http-request
description: |-
  **WHAT IT DOES**
  The issued invoice with snapshot lines, `payment_status` (`unpaid`|`partially_paid`|`paid`), `total_amount`, `amount_paid`, `outstanding`, `is_overdue` and its payments. Invoice state (`issued`|`void`) is separate from payment state.

  **WHEN TO USE IT**
  An invoice detail with its payments.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{invoice_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `invoice.view` (taken from the current farm context; never sent by the client).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`invoice.view`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/invoices/{{invoice_id}}`

  **PATH PARAMETERS**
  - `{{invoice_id}}` — UUID. Captured by "Issue the invoice for a sale" (17 — Sales, Invoices & Payments) or from the list endpoint of this resource.

  **VARIABLES USED**
  - `{{invoice_id}}` — captured by "Issue the invoice for a sale"

  **SUCCESS**
  `200 OK`

  `data` fields: `id`, `reference`, `sale_id`, `sale_reference`, `status`, `payment_status`, `issue_date`, `due_date`, `is_overdue`, `total_amount`, `amount_paid`, `outstanding`, `currency`, `customer`, `seller_name`, `notes`, `voided_at`, `void_reason`, `items`, `payments`, `created_by`, `created_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `invoice.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
url: "{{base_url}}/invoices/{{invoice_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Show an invoice.resources/examples
order: 9000
