$kind: http-example
request:
  url: "{{base_url}}/payments/{{payment_b_id}}/reverse"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "reason": "Mobile money transfer bounced",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "This payment is a reversal or has already been reversed.",
        "code": "payment_already_reversed",
        "request_id": "01a1045e-a6f5-71c3-a7df-efe2f2535129"
      }
order: 2000
