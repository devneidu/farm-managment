$kind: http-example
request:
  url: "{{base_url}}/invoices/{{invoice_id}}/payments"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "amount": "999999.00",
        "method": "cash",
        "received_on": "{{today}}",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The payment is more than the amount still owed on this invoice.",
        "code": "payment_exceeds_balance",
        "request_id": "01a1045e-a32f-7098-ae21-51cacac3cf3a",
        "details": {
          "outstanding": "57000.00",
          "amount": "999999.00"
        }
      }
order: 2000
