$kind: http-example
request:
  url: "{{base_url}}/sales/{{sale_id}}/cancel"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "reason": "Customer returned the manure",
        "recorded_at": "{{recorded_at}}",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Reverse the payments received on this sale before cancelling it.",
        "code": "sale_has_payments",
        "request_id": "01a1045e-a866-7226-bde4-14cf401f0271",
        "details": {
          "amount_paid": "87000.00"
        }
      }
order: 2000
