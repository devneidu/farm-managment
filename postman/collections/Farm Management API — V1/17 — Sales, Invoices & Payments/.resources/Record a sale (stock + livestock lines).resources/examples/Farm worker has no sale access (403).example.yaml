$kind: http-example
request:
  url: "{{base_url}}/sales"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "contact_id": "{{customer_id}}",
        "recorded_at": "{{recorded_at_2h}}",
        "idempotency_key": "{{sale_key}}",
        "notes": "Weekly delivery to the restaurant",
        "items": [
          {
            "kind": "stock",
            "inventory_item_id": "{{item_eggs_id}}",
            "storage_location_id": "{{store_id}}",
            "components": [
              {
                "quantity": "90",
                "unit": "piece"
              }
            ],
            "amount": "27000.00"
          },
          {
            "kind": "livestock",
            "production_cycle_id": "{{cycle_id}}",
            "head_count": 12,
            "description": "Spent layers",
            "amount": "60000.00"
          }
        ]
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "You are not allowed to perform this action.",
        "code": "forbidden",
        "request_id": "01a1045e-97e3-7394-ab41-02eb74b5cb63"
      }
order: 5000
