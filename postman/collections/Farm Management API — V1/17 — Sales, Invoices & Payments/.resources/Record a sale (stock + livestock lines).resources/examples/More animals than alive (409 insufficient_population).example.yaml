$kind: http-example
request:
  url: "{{base_url}}/sales"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "contact_id": "{{customer_id}}",
        "recorded_at": "{{recorded_at_2h}}",
        "idempotency_key": "{{$guid}}",
        "items": [
          {
            "kind": "livestock",
            "production_cycle_id": "{{cycle_id}}",
            "head_count": 100000,
            "amount": "1000.00"
          }
        ]
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "This event would produce a negative population, including in the dated ledger history.",
        "code": "insufficient_population",
        "request_id": "01a1045e-96c4-715e-bd64-6cd34d11aad0"
      }
order: 3000
