$kind: http-example
request:
  url: "{{base_url}}/sales"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "contact_id": "{{customer_id}}",
        "recorded_at": "{{recorded_at_2h}}",
        "idempotency_key": "{{$guid}}",
        "items": [
          {
            "kind": "stock",
            "inventory_item_id": "{{item_eggs_id}}",
            "storage_location_id": "{{store_id}}",
            "components": [
              {
                "quantity": "999999",
                "unit": "piece"
              }
            ],
            "amount": "1000.00"
          }
        ]
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "There is not enough stock in this location.",
        "code": "insufficient_stock",
        "request_id": "01a1045e-975c-72e3-a52b-8b0351e64a55",
        "details": {
          "available": {
            "quantity": "510",
            "unit": "piece"
          },
          "requested": {
            "quantity": "999999",
            "unit": "piece"
          }
        }
      }
order: 4000
