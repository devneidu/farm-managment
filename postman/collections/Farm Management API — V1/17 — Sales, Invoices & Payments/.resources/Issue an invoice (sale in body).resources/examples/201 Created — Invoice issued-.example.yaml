$kind: http-example
name: 201 Created — Invoice issued.
request:
  url: "{{base_url}}/invoices"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "sale_id": "{{sale_c_id}}",
        "due_date": "{{date_in_14d}}",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
