$kind: http-example
name: 201 Created — Invoice issued.
request:
  url: "{{base_url}}/sales/{{sale_id}}/invoice"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "due_date": "{{date_in_14d}}",
        "notes": "Net 14 days",
        "idempotency_key": "{{$guid}}"
      }
