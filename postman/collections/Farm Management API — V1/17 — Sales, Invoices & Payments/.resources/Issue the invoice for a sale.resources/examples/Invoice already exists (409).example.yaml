$kind: http-example
request:
  url: "{{base_url}}/sales/{{sale_id}}/invoice"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "due_date": "{{date_in_14d}}",
        "notes": "Net 14 days",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "This sale already has a live invoice; void it before issuing another.",
        "code": "invoice_exists",
        "request_id": "01a1045e-9971-71fe-b18d-79b184bc0a71"
      }
order: 2000
