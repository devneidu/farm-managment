$kind: http-example
name: 201 Created — Sale recorded.
request:
  url: "{{base_url}}/sales"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "contact_id": "{{customer_id}}",
        "recorded_at": "{{recorded_at_2h}}",
        "idempotency_key": "{{$guid}}",
        "items": [
          {
            "kind": "other",
            "description": "Manure (25 kg bags)",
            "amount": "5000.05"
          }
        ],
        "invoice": {
          "due_date": "{{date_in_14d}}",
          "notes": "Cash on collection"
        }
      }
