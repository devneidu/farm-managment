$kind: http-request
description: |-
  **WHAT IT DOES**
  Creates the customer DOCUMENT for a sale. The invoice snapshots the customer, seller, currency, total and every line when issued, so later edits to contacts or items never change it. It books nothing.

  **WHEN TO USE IT**
  "Create invoice" on a sale.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{sale_id}}`.
  - Required body fields: `sale_id`, `idempotency_key`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `invoice.create` (taken from the current farm context; never sent by the client).
  - Creates the invoice and its snapshot lines. No income, no stock or population effect.
  - One live invoice per sale: `409 invoice_exists`. A cancelled sale cannot be invoiced (`409 sale_cancelled`). `issue_date` defaults to today (between the sale day and today); `due_date` >= issue date.
  - Void an invoice with `POST /invoices/{id}/void`; the sale can then be invoiced again.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Derived numbers (population, stock, outstanding, totals) are authoritative on the server: refetch the affected resource and the dashboard after saving.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`invoice.create`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `finance-write`: 240 per hour per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/sales/{{sale_id}}/invoice`

  **PATH PARAMETERS**
  - `{{sale_id}}` — UUID. Captured by "Record a sale (stock + livestock lines)" (17 — Sales, Invoices & Payments) or from the list endpoint of this resource.

  **REQUEST BODY** (`application/json`)
  - `sale_id` — string (uuid), **required**. The sale to invoice. Required on POST /invoices; taken from the URL on POST /sales/{sale}/invoice.
  - `issue_date` — string (date), optional, nullable. Farm-local day; defaults to today, never before the sale or in the future.
  - `due_date` — string (date), optional, nullable
  - `notes` — string, optional, max 2000 chars, nullable
  - `idempotency_key` — string, **required**, max 80 chars, pattern `^[A-Za-z0-9._:-]+$`

  **VARIABLES USED**
  - `{{sale_id}}` — captured by "Record a sale (stock + livestock lines)"

  **BUSINESS RULES**
  - One live invoice per sale: `409 invoice_exists`. A cancelled sale cannot be invoiced (`409 sale_cancelled`). `issue_date` defaults to today (between the sale day and today); `due_date` >= issue date.
  - Void an invoice with `POST /invoices/{id}/void`; the sale can then be invoiced again.
  - Requires `invoice.create` (Owner, Manager, Finance).

  **SUCCESS**
  `201 Created` — message: "Invoice issued."

  `data` fields: `id`, `reference`, `sale_id`, `sale_reference`, `status`, `payment_status`, `issue_date`, `due_date`, `is_overdue`, `total_amount`, `amount_paid`, `outstanding`, `currency`, `customer`, `seller_name`, `notes`, `voided_at`, `void_reason`, `items`, `payments`, `created_by`, `created_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `invoice.create`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `409` — `invoice_exists`, `sale_cancelled`, `idempotency_conflict`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/sales/{{sale_id}}/invoice"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "due_date": "{{date_in_14d}}",
      "notes": "Net 14 days",
      "idempotency_key": "{{$guid}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("invoice_id", String(v)); else console.warn("Could not capture invoice_id from data.id"); }
        { const v = get(json, "data.reference"); if (v !== undefined && v !== null) pm.environment.set("invoice_reference", String(v)); else console.warn("Could not capture invoice_reference from data.reference"); }
      }
    language: text/javascript
examples: ./.resources/Issue the invoice for a sale.resources/examples
order: 7000
