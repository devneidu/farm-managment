$kind: http-request
description: |-
  **WHAT IT DOES**
  Paginated invoices. Filters: `status` (`issued`|`void`), `payment_status` (`unpaid`|`partially_paid`|`paid`), `overdue`, `contact_id`, `sale_id`, `search`, `from`, `to`, `page`, `per_page`.

  **WHEN TO USE IT**
  The invoices list (unpaid/overdue filters).

  **IMPORTANT INPUTS**
  - Query filters: `status`, `payment_status`, `overdue`, `contact_id`, `sale_id`, `search`, `from`, `to`, ....

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `invoice.view` (taken from the current farm context; never sent by the client).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`invoice.view`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/invoices`

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `status` — enum. Values: `issued`, `void`
  - `payment_status` — enum. Values: `unpaid`, `partially_paid`, `paid`
  - `overdue` — boolean. true = issued, not fully paid and past its due date.
  - `contact_id` — string (uuid)
  - `sale_id` — string (uuid)
  - `search` — string, max 100 chars
  - `from` — string (date)
  - `to` — string (date)
  - `page` — integer, min 1
  - `per_page` — integer, min 1, max 100

  **SUCCESS**
  `200 OK`

  `data` is an array of objects with fields: `id`, `reference`, `sale_id`, `sale_reference`, `status`, `payment_status`, `issue_date`, `due_date`, `is_overdue`, `total_amount`, `amount_paid`, `outstanding`, `currency`, `customer`, `seller_name`, `notes`, `voided_at`, `void_reason`, `items`, `payments`, `created_by`, `created_at`.

  `meta`: `current_page`, `per_page`, `last_page`, `total`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `invoice.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/invoices?status=issued"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: status
    value: issued
  - key: payment_status
    value: ""
    disabled: true
    description: "enum: unpaid | partially_paid | paid"
  - key: overdue
    value: ""
    disabled: true
    description: true = issued, not fully paid and past its due date. — boolean
  - key: contact_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: sale_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: search
    value: ""
    disabled: true
    description: string — max 100 chars
  - key: from
    value: ""
    disabled: true
    description: string (date)
  - key: to
    value: ""
    disabled: true
    description: string (date)
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/List invoices.resources/examples
order: 8000
