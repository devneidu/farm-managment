$kind: http-request
description: |-
  **WHAT IT DOES**
  One payment row: `amount`, `method`, `payment_reference`, `received_on`, the invoice it belongs to, the income ledger row it created (`finance_transaction_id`) and, for reversals, `reverses_payment_id`/`reason`. `is_reversed` tells whether it was later reversed.

  **WHEN TO USE IT**
  A payment detail view.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{payment_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `payment.view` (taken from the current farm context; never sent by the client).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`payment.view`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/payments/{{payment_id}}`

  **PATH PARAMETERS**
  - `{{payment_id}}` — UUID. Captured by "Record a payment (partial)" (17 — Sales, Invoices & Payments) or from the list endpoint of this resource.

  **VARIABLES USED**
  - `{{payment_id}}` — captured by "Record a payment (partial)"

  **SUCCESS**
  `200 OK`

  `data` fields: `id`, `reference`, `entry_type`, `invoice_id`, `invoice_reference`, `amount`, `currency`, `method`, `payment_reference`, `received_on`, `recorded_at`, `notes`, `finance_transaction_id`, `reverses_payment_id`, `reversed_by_payment_id`, `is_reversed`, `reason`, `created_by`, `created_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `payment.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
url: "{{base_url}}/payments/{{payment_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Show a payment.resources/examples
order: 13000
