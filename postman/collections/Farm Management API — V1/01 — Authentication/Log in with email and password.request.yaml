$kind: http-request
description: |-
  **WHAT IT DOES**
  Starts the browser session (cookie) and returns the standard auth state. ALWAYS route on `data.next_action`: `verify_email` (the user is logged in but restricted), `complete_farm_setup`, `no_active_farm` or `none`.

  **WHEN TO USE IT**
  The login form.

  **IMPORTANT INPUTS**
  - Required body fields: `email`, `password`.

  **IMPORTANT BEHAVIOR**
  - Creates a session; regenerates the session id.
  - Wrong email or wrong password return the SAME `401 invalid_credentials`. A suspended account is `403 account_suspended`. Rate limited (`429`).
  - Needs the CSRF cookie and a stateful `Origin` first (see "Initialise CSRF cookie").

  **WHAT TO DO NEXT**
  Route by `next_action`.

  **FARM DISCOVERY (GAP-07)**
  `data.farms` lists every farm the user ACTIVELY belongs to (`id`, `name`, `role`; oldest membership first). `data.farm` stays the default farm (the oldest active membership). To work in another farm send its `farms[].id` as the `X-Farm-Id` header, then refetch `GET /farm` (membership + permissions) and `GET /subscription/entitlements` and clear farm-scoped caches. There is no switch endpoint. Permissions are never listed here.

  **MARKETPLACE-ONLY SELLERS (Phase 22)**
  `data.marketplace.shop_count` = Marketplace shops the user belongs to (any status). `next_action = "marketplace"` is returned only for a verified user with NO active farm who belongs to at least one shop: route to the seller dashboard (`GET /marketplace/my/shops`). A brand-new account with no shop still gets `complete_farm_setup` (offer "open a shop instead" -> `POST /marketplace/shops`, no farm needed). A user with a farm keeps `none`. Farm endpoints still answer `403 onboarding_required` / `no_active_farm`; `POST /onboarding/farm` remains available.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Public** — no session required. State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Everyone.
  Rate limited by limiter `auth-login`: 5 per minute per email+IP and 30 per minute per IP (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/auth/login`

  **REQUEST BODY** (`application/json`)
  - `email` — string (email), **required**, max 254 chars
  - `password` — string, **required**, max 255 chars

  **VARIABLES USED**
  - `{{email}}` — Environment input: the farm owner's email.
  - `{{password}}` — Environment input: the farm owner's password.

  **BUSINESS RULES**
  - Wrong email or wrong password return the SAME `401 invalid_credentials`. A suspended account is `403 account_suspended`. Rate limited (`429`).
  - Needs the CSRF cookie and a stateful `Origin` first (see "Initialise CSRF cookie").

  **SUCCESS**
  `200 OK` — message: "Logged in."

  `data` fields: `authenticated`, `email_verified`, `onboarded`, `has_active_farm`, `next_action`, `user`, `farm`.

  **ERRORS**
  - `403` — other codes: `account_suspended`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/auth/login"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Log in with email and password.resources/examples
order: 7000
