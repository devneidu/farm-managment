$kind: http-example
request:
  url: "{{base_url}}/auth/login"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "{{invitee_email}}",
        "password": "{{new_password}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "authenticated": true,
          "email_verified": true,
          "onboarded": true,
          "has_active_farm": false,
          "next_action": "no_active_farm",
          "user": {
            "id": "01a1045e-4251-709f-a2f4-bfa626691fbc",
            "email": "chidi.worker@example.com",
            "name": null,
            "email_verified_at": "2026-10-04T00:45:08+00:00",
            "has_password": true,
            "platform_role": null,
            "providers": [],
            "locale": null
          },
          "farm": null,
          "farms": [],
          "marketplace": {
            "shop_count": 0
          }
        },
        "meta": {},
        "message": "Logged in."
      }
order: 4000
