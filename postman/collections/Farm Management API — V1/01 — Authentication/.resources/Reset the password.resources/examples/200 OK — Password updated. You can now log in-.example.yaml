$kind: http-example
name: 200 OK — Password updated. You can now log in.
request:
  url: "{{base_url}}/auth/password/reset"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "email": "{{invitee_email}}",
        "reset_token": "{{reset_token}}",
        "password": "{{new_password}}",
        "password_confirmation": "{{new_password}}"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": null,
        "meta": {},
        "message": "Password updated. You can now log in."
      }
order: 1000
