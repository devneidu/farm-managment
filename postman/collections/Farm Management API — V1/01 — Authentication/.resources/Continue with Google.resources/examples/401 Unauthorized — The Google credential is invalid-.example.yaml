$kind: http-example
name: 401 Unauthorized — The Google credential is invalid.
request:
  url: "{{base_url}}/auth/google"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "credential": "REPLACE_WITH_GOOGLE_ID_TOKEN"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The Google credential is invalid.",
        "code": "invalid_google_credential",
        "request_id": "01a1045e-be52-7346-9e75-cfa45c92af20"
      }
order: 1000
