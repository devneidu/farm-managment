$kind: http-example
request:
  url: "{{base_url}}/auth/me"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Unauthenticated.",
