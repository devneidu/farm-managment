$kind: http-request
description: |-
  **WHAT IT DOES**
  Submits the 6-digit code from the verification email. On success the user's email is marked verified and the returned auth state has `next_action: "complete_farm_setup"`.

  **WHEN TO USE IT**
  Submit of the OTP screen.

  **IMPORTANT INPUTS**
  - Required body fields: `code`.

  **IMPORTANT BEHAVIOR**
  - Sets `email_verified_at`.
  - Codes expire after 10 minutes, are single use, and are invalidated after 5 wrong attempts (request a new one with Resend).
  - All failures (wrong, expired, used) return the same `422` with `errors.code` so the API never reveals which.
  - The code in the Postman body is `{{otp_code}}`: paste the code from the email/log into the `otp_code` environment variable.

  **WHAT TO DO NEXT**
  Read `next_action` (normally `complete_farm_setup`) and show the farm-name screen.

  **FARM DISCOVERY (GAP-07)**
  `data.farms` lists every farm the user ACTIVELY belongs to (`id`, `name`, `role`; oldest membership first). `data.farm` stays the default farm (the oldest active membership). To work in another farm send its `farms[].id` as the `X-Farm-Id` header, then refetch `GET /farm` (membership + permissions) and `GET /subscription/entitlements` and clear farm-scoped caches. There is no switch endpoint. Permissions are never listed here.

  **MARKETPLACE-ONLY SELLERS (Phase 22)**
  `data.marketplace.shop_count` = Marketplace shops the user belongs to (any status). `next_action = "marketplace"` is returned only for a verified user with NO active farm who belongs to at least one shop: route to the seller dashboard (`GET /marketplace/my/shops`). A brand-new account with no shop still gets `complete_farm_setup` (offer "open a shop instead" -> `POST /marketplace/shops`, no farm needed). A user with a farm keeps `none`. Farm endpoints still answer `403 onboarding_required` / `no_active_farm`; `POST /onboarding/farm` remains available.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — signed-in user (a restricted, unverified user is accepted). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Any signed-in user.
  Rate limited by limiter `auth-otp-verify`: 10 per 10 minutes per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/auth/email/verify`

  **REQUEST BODY** (`application/json`)
  - `code` — string, **required**, pattern `^\d{6}$`

  **VARIABLES USED**
  - `{{otp_code}}` — Environment input: the 6-digit email verification code (copy from the email / `storage/logs/laravel.log`).

  **BUSINESS RULES**
  - Codes expire after 10 minutes, are single use, and are invalidated after 5 wrong attempts (request a new one with Resend).
  - All failures (wrong, expired, used) return the same `422` with `errors.code` so the API never reveals which.
  - The code in the Postman body is `{{otp_code}}`: paste the code from the email/log into the `otp_code` environment variable.

  **SUCCESS**
  `200 OK` — message: "Email verified."

  `data` fields: `authenticated`, `email_verified`, `onboarded`, `has_active_farm`, `next_action`, `user`, `farm`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — other codes: `account_suspended`.
  - `409` — Email already verified.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/auth/email/verify"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "{{otp_code}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Verify email with OTP.resources/examples
order: 4000
