$kind: http-request
description: |-
  **WHAT IT DOES**
  Sets the new password using the `reset_token`. The user is NOT logged in by this call and every existing session is revoked, so they must log in again.

  **WHEN TO USE IT**
  Submit of the new-password form.

  **IMPORTANT INPUTS**
  - Required body fields: `email`, `reset_token`, `password`, `password_confirmation`.

  **IMPORTANT BEHAVIOR**
  - Updates the password, revokes sessions and tokens.
  - `reset_token` is single use. A used/expired/wrong token is `422` on `reset_token`.
  - Password rules: 8-72 characters with a letter and a number.

  **WHAT TO DO NEXT**
  Send the user to the login screen (reset does not log in).

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Public** — no session required. State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Everyone.
  Rate limited by limiter `auth-reset-password`: 10 per 10 minutes per IP (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/auth/password/reset`

  **REQUEST BODY** (`application/json`)
  - `email` — string (email), **required**, max 254 chars
  - `reset_token` — string, **required**, max 128 chars
  - `password` — string, **required**
  - `password_confirmation` — string, **required**

  **VARIABLES USED**
  - `{{invitee_email}}` — Environment input: the email of the person you invite.
  - `{{reset_token}}` — captured by "Verify a password-reset code"
  - `{{new_password}}` — Environment input: a new password used by the password reset / change requests.

  **BUSINESS RULES**
  - `reset_token` is single use. A used/expired/wrong token is `422` on `reset_token`.
  - Password rules: 8-72 characters with a letter and a number.

  **SUCCESS**
  `200 OK` — message: "Password updated. You can now log in."

  **ERRORS**
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/auth/password/reset"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{invitee_email}}",
      "reset_token": "{{reset_token}}",
      "password": "{{new_password}}",
      "password_confirmation": "{{new_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Reset the password.resources/examples
order: 10000
