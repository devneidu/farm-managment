$kind: http-request
description: |-
  **WHAT IT DOES**
  Exchanges the emailed code for a short-lived, single-use `reset_token` (`expires_in` seconds, default 15 minutes) to send to the reset endpoint.

  **WHEN TO USE IT**
  Submit of the reset-code screen.

  **IMPORTANT INPUTS**
  - Required body fields: `email`, `code`.

  **IMPORTANT BEHAVIOR**
  - Consumes the code, issues the token.
  - The code is single use and wrong attempts are counted. Unknown email, wrong, expired or used code all give the same `422`. Email-verification codes are rejected.
  - Treat `reset_token` as a secret: keep it in memory, never in the URL.

  **WHAT TO DO NEXT**
  Keep `reset_token` in memory and call `POST /auth/password/reset`.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Public** — no session required. State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Everyone.
  Rate limited by limiter `auth-reset-verify`: 10 per 10 minutes per email+IP (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/auth/password/verify-otp`

  **REQUEST BODY** (`application/json`)
  - `email` — string (email), **required**, max 254 chars
  - `code` — string, **required**, pattern `^\d{6}$`

  **VARIABLES USED**
  - `{{invitee_email}}` — Environment input: the email of the person you invite.
  - `{{reset_otp_code}}` — Environment input: the 6-digit password-reset code.

  **BUSINESS RULES**
  - The code is single use and wrong attempts are counted. Unknown email, wrong, expired or used code all give the same `422`. Email-verification codes are rejected.
  - Treat `reset_token` as a secret: keep it in memory, never in the URL.

  **SUCCESS**
  `200 OK` — message: "Code verified."

  `data` fields: `reset_token`, `expires_in`.

  **ERRORS**
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/auth/password/verify-otp"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{invitee_email}}",
      "code": "{{reset_otp_code}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.reset_token"); if (v !== undefined && v !== null) pm.environment.set("reset_token", String(v)); else console.warn("Could not capture reset_token from data.reset_token"); }
      }
    language: text/javascript
examples: ./.resources/Verify a password-reset code.resources/examples
order: 9000
