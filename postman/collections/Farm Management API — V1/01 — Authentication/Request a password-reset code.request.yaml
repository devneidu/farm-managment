$kind: http-request
description: |-
  **WHAT IT DOES**
  Starts a password reset by emailing a 6-digit code. The response is ALWAYS the same `200` whether or not the email is registered (no account enumeration).

  **WHEN TO USE IT**
  "Forgot password" form.

  **IMPORTANT INPUTS**
  - Required body fields: `email`.

  **IMPORTANT BEHAVIOR**
  - Sends an OTP email when the account exists.
  - A per-account cooldown applies silently. Strictly rate limited.

  **WHAT TO DO NEXT**
  Show the code screen and call `POST /auth/password/verify-otp`.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Public** — no session required. State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Everyone.
  Rate limited by limiter `auth-forgot-password`: 5 per hour per email+IP and 30 per hour per IP (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/auth/password/forgot`

  **REQUEST BODY** (`application/json`)
  - `email` — string (email), **required**, max 254 chars

  **VARIABLES USED**
  - `{{invitee_email}}` — Environment input: the email of the person you invite.

  **BUSINESS RULES**
  - A per-account cooldown applies silently. Strictly rate limited.

  **SUCCESS**
  `200 OK` — message: "If an account exists for that email, a reset code has been sent."

  **ERRORS**
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/auth/password/forgot"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{invitee_email}}"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("otp_email", pm.variables.replaceIn("{{invitee_email}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Request a password-reset code.resources/examples
order: 8000
