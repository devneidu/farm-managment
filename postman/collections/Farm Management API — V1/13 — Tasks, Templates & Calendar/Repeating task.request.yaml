$kind: http-request
description: |-
  **WHAT IT DOES**
  The "Add task" form with a `repeat` block: creates a repeating series (a schedule) and the tasks that are due today through the next 30 days. Without `repeat`, `POST /tasks` creates one task (see "Create a task").

  **WHEN TO USE IT**
  The user chose Repeat on the Add task form.

  **IMPORTANT INPUTS**
  - `repeat.pattern`: `daily`, `weekly` (with `weekdays` 1=Mon..7=Sun) or `monthly` (days 29-31 use the last day of shorter months); `repeat.every` 1-52.
  - `repeat.ends.type`: `days` (+`days`), `date` (+`date`), `batch_end` (needs `production_cycle_id` or `breeding_project_id`; the series ends and its future open tasks are cancelled when the batch is closed) or `never`.
  - `reminders`: any of `on_the_day`, `1_day`, `2_days`, `7_days` (07:00 farm-local; `on_the_day` fires at least 1 hour before `due_time`).

  **IMPORTANT BEHAVIOR**
  - Requires `task.manage`. 201 `data` = `{schedule, tasks}`. Never creates operational records.
  - `idempotency_key` is the schedule's key: a replay returns the same series, a changed payload is `409 idempotency_conflict`.
  - Coming repeats beyond the 30-day horizon appear on `GET /calendar` as `upcoming_repeat` items and are generated nightly.
  - `422` keys are dotted: `repeat.ends.type`, `repeat.weekdays`, `reminders.0`.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Full flow with examples: `docs/api/FRONTEND-TASKS-FLOW.md`; reference: `docs/api/PHASE-12-WORK.md`.
url: "{{base_url}}/tasks"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "title": "Weigh a sample of 20 birds",
      "category": "growth_monitoring",
      "due_date": "{{date_in_7d}}",
      "production_cycle_id": "{{cycle_id}}",
      "reminders": ["1_day"],
      "repeat": {
        "pattern": "weekly",
        "every": 1,
        "weekdays": [5],
        "ends": { "type": "batch_end" }
      },
      "idempotency_key": "{{task_repeat_key}}"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("task_repeat_key", pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.schedule.id"); if (v !== undefined && v !== null) pm.environment.set("schedule_id", String(v)); else console.warn("Could not capture schedule_id from data.schedule.id"); }
        { const v = get(json, "data.tasks.0.id"); if (v !== undefined && v !== null) pm.environment.set("series_task_id", String(v)); else console.warn("Could not capture series_task_id from data.tasks.0.id"); }
      }
    language: text/javascript
examples: ./.resources/Repeating task.resources/examples
order: 21000
