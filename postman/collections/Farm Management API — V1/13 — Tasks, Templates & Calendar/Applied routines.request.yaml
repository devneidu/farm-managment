$kind: http-request
description: |-
  **WHAT IT DOES**
  Lists the routines applied on the farm, newest first, each with its start date, when it was applied and task counts.

  **WHEN TO USE IT**
  A batch's "Routines" tab.

  **IMPORTANT INPUTS**
  - `production_cycle_id`, `breeding_project_id`, `target=general`, `work_template_id`, `status` (`active` default, `removed`, `all`).

  **IMPORTANT BEHAVIOR**
  - Requires `task.view`. `task_counts {open, completed, cancelled}` is live.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Full flow with examples: `docs/api/FRONTEND-ROUTINES-FLOW.md`; reference: `docs/api/PHASE-12-WORK.md`.
url: "{{base_url}}/template-applications?production_cycle_id={{cycle_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: production_cycle_id
    value: "{{cycle_id}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); });
      }
    language: text/javascript
examples: ./.resources/Applied routines.resources/examples
order: 27600
