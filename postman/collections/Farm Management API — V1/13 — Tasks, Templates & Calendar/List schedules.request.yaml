$kind: http-request
description: |-
  **WHAT IT DOES**
  Schedules (recurrence rules). Filters: `status` (`active`|`ended`), `production_cycle_id`, `breeding_project_id`. Requires `task.manage`.

  **WHEN TO USE IT**
  Managers' recurring schedules list.

  **IMPORTANT INPUTS**
  - Query filters: `status`, `production_cycle_id`, `breeding_project_id`, `page`, `per_page`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `task.manage` (taken from the current farm context; never sent by the client).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`task.manage`** — granted to: `owner`, `manager`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/schedules`

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `status` — enum. Values: `active`, `ended`
  - `production_cycle_id` — string (uuid)
  - `breeding_project_id` — string (uuid)
  - `page` — integer, min 1
  - `per_page` — integer, min 1, max 100

  **SUCCESS**
  `200 OK`

  `data` is an array of objects with fields: `id`, `status`, `title`, `category`, `instructions`, `recurrence`, `interval_value`, `weekdays`, `starts_on`, `ends_on`, `occurrence_limit`, `due_time`, `reminder_offsets`, `production_cycle_id`, `breeding_project_id`, `template_application_id`, `assigned_user_id`, `assigned_role`, `linked_record_type`, `requires_evidence`, `tasks_count`, `open_tasks_count`.

  `meta`: `current_page`, `per_page`, `last_page`, `total`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `task.manage`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/schedules?status=active"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: status
    value: active
  - key: production_cycle_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: breeding_project_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/List schedules.resources/examples
order: 17000
