$kind: http-request
description: |-
  **WHAT IT DOES**
  Creates a one-step farm routine from a task, or from its whole series when the task repeats (repeat, ends, reminders, category, instructions and due time are copied; offset 0).

  **WHEN TO USE IT**
  The "Save as routine" action on a task.

  **IMPORTANT INPUTS**
  - `name` (required).
  - `scope`: `any_batch` (default for a batch task), `same_kind` (only batches of the same species / crop) or `general` (default for a task with no batch).

  **IMPORTANT BEHAVIOR**
  - Requires `task.manage`. Creates no task.
  - 422 `scope` for a task with no batch and a batch scope; 422 when a general routine would need the batch (`batch_end`, record link).

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Full flow with examples: `docs/api/FRONTEND-ROUTINES-FLOW.md`; reference: `docs/api/PHASE-12-WORK.md`.
url: "{{base_url}}/tasks/{{series_task_id}}/save-as-routine"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
        "name": "Water line checks",
        "scope": "same_kind"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("template_farm_id", String(v)); else console.warn("Could not capture template_farm_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/Save as routine.resources/examples
order: 27200
