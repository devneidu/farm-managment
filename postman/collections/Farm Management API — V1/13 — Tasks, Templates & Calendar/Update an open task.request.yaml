$kind: http-request
description: |-
  **WHAT IT DOES**
  Edits an OPEN task. `farm_id`, `status`, `production_cycle_id` and `breeding_project_id` cannot be changed.

  **WHEN TO USE IT**
  Editing an open task.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{task_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `task.manage` (taken from the current farm context; never sent by the client).
  - `409 task_not_open` once completed or cancelled.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`task.manage`** — granted to: `owner`, `manager`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `work-write`: 240 per hour per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `PATCH {{base_url}}/tasks/{{task_id}}`

  **PATH PARAMETERS**
  - `{{task_id}}` — UUID. Captured by "Create a task" (13 — Tasks, Templates & Calendar) or from the list endpoint of this resource.

  **REQUEST BODY** (`application/json`)
  - `title` — string, optional, max 200 chars
  - `category` — enum, optional. Closed task vocabulary served by GET /master/task-categories. . Values: `feeding_watering`, `egg_collection`, `vaccination_medication`, `breeding_reproduction`, `growth_monitoring`, `record_keeping`, `maintenance_repair`, `cleaning_sanitation`, `movement_rotation`, `procurement_orders`, `irrigation`, `crop_care`, `harvest`, `payment`, `other`
  - `instructions` — string, optional, max 5000 chars, nullable
  - `due_time` — string, optional, nullable
  - `reminder_offsets` — array, optional, max 5 items, nullable
  - `linked_record_type` — enum, optional, nullable. Values: `feed_use`, `egg_collection`, `milk`, `mortality`, `weight`, `temperature`, `water`, `irrigation`, `weeding`, `fertilizer_application`, `pesticide_application`, `land_preparation`, `planting`, `establishment_check`, `growth_stage`, `crop_loss`, `crop_harvest`, `pest_observation`, `general_note`, `population_adjustment`, `health`, `breeding_check`, `breeding_outcome`, `null`
  - `requires_evidence` — boolean, optional
  - `assigned_role` — any, optional
  - `due_date` — string (date), optional
  - `assigned_user_id` — string (uuid), optional, nullable

  Server-owned fields — NOT accepted, sending any of them is a `422`: `farm_id`, `status`, `production_cycle_id`, `breeding_project_id`.

  **VARIABLES USED**
  - `{{task_id}}` — captured by "Create a task"

  **BUSINESS RULES**
  - `409 task_not_open` once completed or cancelled.
  - Requires `task.manage`.

  **SUCCESS**
  `200 OK` — message: "Task updated."

  `data` fields: `id`, `reference`, `status`, `due_state`, `title`, `category`, `instructions`, `due_date`, `due_time`, `due_at`, `timezone`, `reminder_offsets`, `production_cycle_id`, `breeding_project_id`, `schedule_id`, `occurrence_date`, `assigned_user_id`, `assigned_user_name`, `assigned_role`, `linked_record_type`, `requires_evidence`, `completion`, `cancellation`, `created_by`, `created_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `task.manage`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `409` — `task_not_open`, `cycle_closed`, `project_not_active`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/tasks/{{task_id}}"
method: PATCH
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "due_time": "09:00",
      "instructions": "Weigh 20 random birds from Pen 1; record the combined weight"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Update an open task.resources/examples
order: 12000
