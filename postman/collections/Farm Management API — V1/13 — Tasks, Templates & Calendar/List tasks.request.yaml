$kind: http-request
description: |-
  **WHAT IT DOES**
  Paginated tasks visible to the caller. Managers see every task; other roles see tasks assigned to them, to their role, created by them, plus their role's relevant categories.

  **WHEN TO USE IT**
  The tasks list (Today/Overdue/Upcoming tabs) and the dashboard work block.

  **IMPORTANT INPUTS**
  - Query filters: `status`, `due_state`, `production_cycle_id`, `breeding_project_id`, `schedule_id`, `category`, `assigned_to`, `from`, ....

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `task.view` (taken from the current farm context; never sent by the client).
  - Filters: `status` (`open`|`completed`|`cancelled`), `due_state`, `production_cycle_id`, `breeding_project_id`, `schedule_id`, `category`, `assigned_to` (`me` or a user id), `from`/`to` (due dates), `page`, `per_page`.
  - A task outside your visibility is `404`, not `403`.

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`task.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/tasks`

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `status` — enum. Values: `open`, `completed`, `cancelled`
  - `due_state` — enum. Derived: upcoming | due_today | overdue (open tasks) | completed | cancelled.. Values: `upcoming`, `due_today`, `overdue`, `completed`, `cancelled`
  - `production_cycle_id` — string (uuid)
  - `breeding_project_id` — string (uuid)
  - `schedule_id` — string (uuid)
  - `category` — enum. Values: `feeding_watering`, `egg_collection`, `vaccination_medication`, `breeding_reproduction`, `growth_monitoring`, `record_keeping`, `maintenance_repair`, `cleaning_sanitation`, `movement_rotation`, `procurement_orders`, `irrigation`, `crop_care`, `harvest`, `payment`, `other`
  - `assigned_to` — string, max 36 chars. "me" or a member's user id.
  - `from` — string (date)
  - `to` — string (date)
  - `page` — integer, min 1
  - `per_page` — integer, min 1, max 100

  **BUSINESS RULES**
  - Filters: `status` (`open`|`completed`|`cancelled`), `due_state`, `production_cycle_id`, `breeding_project_id`, `schedule_id`, `category`, `assigned_to` (`me` or a user id), `from`/`to` (due dates), `page`, `per_page`.
  - A task outside your visibility is `404`, not `403`.

  **SUCCESS**
  `200 OK`

  `data` is an array of objects with fields: `id`, `reference`, `status`, `due_state`, `title`, `category`, `instructions`, `due_date`, `due_time`, `due_at`, `timezone`, `reminder_offsets`, `production_cycle_id`, `breeding_project_id`, `schedule_id`, `occurrence_date`, `assigned_user_id`, `assigned_user_name`, `assigned_role`, `linked_record_type`, `requires_evidence`, `completion`.

  `meta`: `current_page`, `per_page`, `last_page`, `total`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `task.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/tasks?status=open&due_state=upcoming"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: status
    value: open
  - key: due_state
    value: upcoming
  - key: production_cycle_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: breeding_project_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: schedule_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: category
    value: ""
    disabled: true
    description: "enum: feeding_watering | egg_collection | vaccination_medication | breeding_reproduction | growth_monitoring | record_keeping | maintenance_repair | cleaning_sanitation | movement_rotation | procurement_orders | irrigation | crop_care | harvest | payment | other"
  - key: assigned_to
    value: ""
    disabled: true
    description: "\"me\" or a member's user id. — string — max 36 chars"
  - key: from
    value: ""
    disabled: true
    description: string (date)
  - key: to
    value: ""
    disabled: true
    description: string (date)
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/List tasks.resources/examples
order: 10000
