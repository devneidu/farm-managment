$kind: http-request
description: |-
  **WHAT IT DOES**
  Applies a routine to a batch (or to nothing, for a general routine), counting day 1 from `start_date`.

  **WHEN TO USE IT**
  The confirm button of the "Use routine" flow.

  **IMPORTANT INPUTS**
  - `production_cycle_id` (or `breeding_project_id`); leave both out for a general routine.
  - `start_date` (optional), `confirm_reapply` (see "Apply routine again"), `idempotency_key` (required).

  **IMPORTANT BEHAVIOR**
  - Requires `task.manage`. 201 `data` is the application (`id`, `status`, `start_date`, counts).
  - 409 `template_already_applied` with `details {times_applied, last_applied_at, applications}` when it was applied to the same target before and `confirm_reapply` is not true.
  - 409 `cycle_closed`, `project_not_active`, `template_inactive`, `idempotency_conflict`; 422 when the routine does not fit the batch.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Full flow with examples: `docs/api/FRONTEND-ROUTINES-FLOW.md`; reference: `docs/api/PHASE-12-WORK.md`.
url: "{{base_url}}/work-templates/{{template_farm_id}}/apply"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
        "production_cycle_id": "{{cycle_id}}",
        "start_date": "2026-10-20",
        "idempotency_key": "{{routine_apply_key}}"
    }
scripts:
  - type: beforeRequest
    code: "pm.collectionVariables.set(\"routine_apply_key\", pm.variables.replaceIn(\"{{$guid}}\"));"
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("template_application_id", String(v)); else console.warn("Could not capture template_application_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/Apply routine.resources/examples
order: 27400
