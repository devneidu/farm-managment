$kind: http-request
description: |-
  **WHAT IT DOES**
  Applies the same routine to the same batch a second time, after the user confirmed.

  **WHEN TO USE IT**
  The user pressed "Apply again" on the already-applied warning.

  **IMPORTANT INPUTS**
  - `confirm_reapply: true`.

  **IMPORTANT BEHAVIOR**
  - Creates a new application with its own schedules and tasks; the earlier one is untouched.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Full flow with examples: `docs/api/FRONTEND-ROUTINES-FLOW.md`; reference: `docs/api/PHASE-12-WORK.md`.
url: "{{base_url}}/work-templates/{{template_farm_id}}/apply"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
        "production_cycle_id": "{{cycle_id}}",
        "start_date": "2026-10-27",
        "confirm_reapply": true,
        "idempotency_key": "{{routine_apply_key}}"
    }
scripts:
  - type: beforeRequest
    code: "pm.collectionVariables.set(\"routine_apply_key\", pm.variables.replaceIn(\"{{$guid}}\"));"
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("template_application_id", String(v)); else console.warn("Could not capture template_application_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/Apply routine again.resources/examples
order: 27500
