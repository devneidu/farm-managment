$kind: http-request
description: |-
  **WHAT IT DOES**
  For a task that belongs to a repeating series: ends the old schedule the day before this task's date, cancels its open tasks from this date on (completed tasks are never touched) and creates a new schedule from this date with the changes. One transaction, idempotent.

  **WHEN TO USE IT**
  The user chose "Edit this and all future" on a repeating task. "This task only" is `PATCH /tasks/{id}`.

  **IMPORTANT INPUTS**
  - Any task field (`title`, `category`, `instructions`, `due_date` = new first day (not earlier than this task), `due_time`, `reminders`, `reminder_offsets`, `assigned_user_id`, `assigned_role`, `linked_record_type`, `requires_evidence`); fields not sent carry over from this task.
  - `repeat`: send to change the pattern; omit to keep the old rule.
  - `idempotency_key` (required).

  **IMPORTANT BEHAVIOR**
  - Requires `task.manage`. 201 `data` = `{schedule, tasks, previous_schedule_id}`.
  - Errors: `409 task_not_in_series`, `409 task_not_open`, `409 cycle_closed`, `409 idempotency_conflict`.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Full flow with examples: `docs/api/FRONTEND-TASKS-FLOW.md`; reference: `docs/api/PHASE-12-WORK.md`.
url: "{{base_url}}/tasks/{{series_task_id}}/edit-series"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "title": "Weigh a sample of 30 birds",
      "due_time": "08:00",
      "idempotency_key": "{{task_edit_series_key}}"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("task_edit_series_key", pm.variables.replaceIn("{{$guid}}"));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.schedule.id"); if (v !== undefined && v !== null) pm.environment.set("schedule_id", String(v)); else console.warn("Could not capture schedule_id from data.schedule.id"); }
      }
    language: text/javascript
examples: ./.resources/Edit series.resources/examples
order: 22000
