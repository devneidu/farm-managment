$kind: http-request
description: |-
  **WHAT IT DOES**
  Templates that fit a cycle (or `breeding_project_id`) by kind, operation, species/crop. The user chooses Apply, Clone-edit-apply, or ignores it: nothing applies automatically.

  **WHEN TO USE IT**
  A "Suggested plans" panel after a batch/project or breeding project is created.

  **IMPORTANT INPUTS**
  - Query filters: `source`, `applies_to`, `is_active`, `production_cycle_id`, `breeding_project_id`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `task.view` (taken from the current farm context; never sent by the client).
  - Platform templates (`source: platform`) are read-only; farm templates are the farm's own. Template content is configuration, not veterinary or agronomic advice.

  **WHAT TO DO NEXT**
  Apply, or clone-edit-apply.

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`task.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/work-templates/recommended`

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `source` — enum. Values: `platform`, `farm`
  - `applies_to` — enum. Values: `production_cycle`, `breeding_project`
  - `is_active` — boolean
  - `production_cycle_id` — string (uuid). Recommended endpoint: exactly one of these.
  - `breeding_project_id` — string (uuid)

  **VARIABLES USED**
  - `{{cycle_id}}` — captured by "Start a livestock batch"

  **BUSINESS RULES**
  - Platform templates (`source: platform`) are read-only; farm templates are the farm's own. Template content is configuration, not veterinary or agronomic advice.

  **SUCCESS**
  `200 OK`

  `data` is an array of objects with fields: `id`, `source`, `code`, `name`, `description`, `applies_to`, `cycle_kind`, `operation_type_id`, `species_id`, `crop_type_id`, `breeding_workflow`, `version`, `is_active`, `cloned_from_id`, `application_id`, `items`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `task.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/work-templates/recommended?production_cycle_id={{cycle_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: production_cycle_id
    value: "{{cycle_id}}"
  - key: source
    value: ""
    disabled: true
    description: "enum: platform | farm"
  - key: applies_to
    value: ""
    disabled: true
    description: "enum: production_cycle | breeding_project"
  - key: is_active
    value: ""
    disabled: true
    description: boolean
  - key: breeding_project_id
    value: ""
    disabled: true
    description: string (uuid)
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const row = (get(json, "data") || []).find((r) => true); const v = row && get(row, "id"); if (v !== undefined && v !== null) pm.environment.set("template_platform_id", String(v)); else console.warn("Could not capture template_platform_id"); }
      }
    language: text/javascript
examples: ./.resources/Recommended templates for a cycle.resources/examples
order: 2000
