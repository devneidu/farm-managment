$kind: http-example
name: "200 OK — Off"
request:
  url: "{{base_url}}/calendar-feed"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "enabled": false,
          "include_milestones": false,
          "https_url": null,
          "webcal_url": null
        },
        "meta": {},
        "message": null
      }
order: 2000
