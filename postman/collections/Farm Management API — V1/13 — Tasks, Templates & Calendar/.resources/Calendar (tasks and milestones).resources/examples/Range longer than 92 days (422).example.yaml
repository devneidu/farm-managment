$kind: http-example
request:
  url: "{{base_url}}/calendar?from={{date_30d_ago}}&to={{date_in_90d}}"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  queryParams:
    - key: from
      value: "{{date_30d_ago}}"
    - key: to
      value: "{{date_in_90d}}"
    - key: production_cycle_id
      value: ""
      disabled: true
      description: string (uuid)
    - key: breeding_project_id
      value: ""
      disabled: true
      description: string (uuid)
    - key: category
      value: ""
      disabled: true
      description: "enum: feeding_watering | egg_collection | vaccination_medication | breeding_reproduction | growth_monitoring | record_keeping | maintenance_repair | cleaning_sanitation | movement_rotation | procurement_orders | irrigation | crop_care | harvest | payment | other"
    - key: assigned_to
      value: ""
      disabled: true
      description: string — max 36 chars
    - key: include_milestones
      value: ""
      disabled: true
      description: Set to false to list tasks only. — boolean
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The calendar range is limited to 92 days.",
        "code": "validation_failed",
        "request_id": "01a1045e-8c98-72b0-a5b2-207ad3f6ed7b",
        "errors": {
          "to": [
            "The calendar range is limited to 92 days."
          ]
        }
      }
order: 2000
