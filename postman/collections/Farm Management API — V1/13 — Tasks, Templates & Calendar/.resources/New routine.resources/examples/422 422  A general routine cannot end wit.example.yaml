$kind: http-example
name: "422 — A general routine cannot end with a batch"
request:
  url: "{{base_url}}/work-templates"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
          "name": "Bad",
          "applies_to": "farm",
          "items": [
              {
                  "title": "Daily",
                  "category": "other",
                  "repeat": {
                      "pattern": "daily",
                      "ends": {
                          "type": "batch_end"
                      }
                  }
              }
          ]
      }
response:
  statusCode: 422
  statusText: "Unprocessable Content"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "message": "A general routine has no batch to end with.",
          "code": "validation_failed",
          "request_id": "01a1ac3c-9935-7078-9f43-7106271c1c23",
          "errors": {
              "items.0.repeat.ends.type": [
                  "A general routine has no batch to end with."
              ]
          }
      }
