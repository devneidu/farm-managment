$kind: http-example
request:
  url: "{{base_url}}/master/task-categories"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "code": "feeding_watering",
            "label": "Feeding / watering"
          },
          {
            "code": "egg_collection",
            "label": "Egg collection"
          }
        ],
        "meta": {},
        "message": null
      }
order: 1000
