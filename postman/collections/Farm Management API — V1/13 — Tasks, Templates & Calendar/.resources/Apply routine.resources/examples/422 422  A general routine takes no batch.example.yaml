$kind: http-example
name: "422 — A general routine takes no batch"
request:
  url: "{{base_url}}/work-templates/{{template_farm_id}}/apply"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
          "production_cycle_id": "01a1ac3c-7f21-7084-8b1d-e44228289412",
          "idempotency_key": "capture-apply-0006"
      }
response:
  statusCode: 422
  statusText: "Unprocessable Content"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "message": "This is a general routine; apply it without a batch.",
          "code": "validation_failed",
          "request_id": "01a1ac3c-98c4-73c9-ba56-062b464536f4",
          "errors": {
              "production_cycle_id": [
                  "This is a general routine; apply it without a batch."
              ]
          }
      }
