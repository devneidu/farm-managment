$kind: http-example
name: "422 — The routine does not fit this batch"
request:
  url: "{{base_url}}/work-templates/{{template_farm_id}}/apply"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
          "production_cycle_id": "01a1ac3c-809d-7363-8c74-ca436065bddb",
          "idempotency_key": "capture-apply-0004"
      }
response:
  statusCode: 422
  statusText: "Unprocessable Content"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "message": "This template does not fit the selected production cycle.",
          "code": "validation_failed",
          "request_id": "01a1ac3c-9677-712a-9e24-f7e502743865",
          "errors": {
              "production_cycle_id": [
                  "This template does not fit the selected production cycle."
              ]
          }
      }
