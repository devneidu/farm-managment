$kind: http-example
name: "409 — Already applied (ask the user to confirm)"
request:
  url: "{{base_url}}/work-templates/{{template_farm_id}}/apply"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
          "production_cycle_id": "01a1ac3c-7f21-7084-8b1d-e44228289412",
          "start_date": "2026-10-27",
          "idempotency_key": "capture-apply-0002"
      }
response:
  statusCode: 409
  statusText: "Conflict"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "message": "This routine was already applied to this target. Send confirm_reapply=true to apply it again.",
          "code": "template_already_applied",
          "request_id": "01a1ac3c-936e-702d-bd66-c7c9c8e4b4e4",
          "details": {
              "times_applied": 1,
              "last_applied_at": "2026-10-14T11:00:00.000000Z",
              "applications": [
                  {
                      "id": "01a1ac3c-912b-73aa-86d6-353e661157d5",
                      "applied_at": "2026-10-14T11:00:00.000000Z",
                      "start_date": "2026-10-20",
                      "tasks_created": 28
                  }
              ]
          }
      }
