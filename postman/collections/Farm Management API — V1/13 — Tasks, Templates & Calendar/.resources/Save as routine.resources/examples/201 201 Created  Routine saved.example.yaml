$kind: http-example
name: "201 Created — Routine saved."
request:
  url: "{{base_url}}/tasks/{{series_task_id}}/save-as-routine"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
          "name": "Water line checks",
          "scope": "same_kind"
      }
