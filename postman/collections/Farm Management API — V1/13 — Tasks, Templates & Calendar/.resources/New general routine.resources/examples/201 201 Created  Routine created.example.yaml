$kind: http-example
name: "201 Created — Routine created."
request:
  url: "{{base_url}}/work-templates"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
          "name": "Monthly farm walk",
          "applies_to": "farm",
          "items": [
              {
                  "title": "Walk the fences and gates",
                  "category": "maintenance_repair",
                  "repeat": {
                      "pattern": "monthly",
                      "every": 1,
                      "ends": {
                          "type": "never"
                      }
                  },
                  "reminders": [
                      "2_days"
                  ]
              }
          ]
      }
response:
  statusCode: 201
  statusText: "Created"
  headers:
    Content-Type: application/json
  body:
