$kind: http-example
name: "200 OK — Removing again changes nothing"
request:
  url: "{{base_url}}/template-applications/{{template_application_id}}/remove"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
