$kind: http-example
name: "404 — Unknown or switched-off link"
request:
  url: "{{calendar_feed_url}}"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The requested resource was not found.",
        "code": "not_found",
        "request_id": "01a1a755-6382-73bc-8e44-14a539b4404e"
      }
order: 1000
