$kind: http-example
name: "409 — The task does not repeat"
request:
  url: "{{base_url}}/tasks/{{series_task_id}}/edit-series"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "title": "Weigh a sample of 30 birds",
        "due_time": "08:00",
        "idempotency_key": "{{task_edit_series_key}}"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "This task does not repeat; edit it directly.",
        "code": "task_not_in_series",
        "request_id": "01a1a755-5abd-7134-b48c-c17267f59ccc"
      }
order: 2000
