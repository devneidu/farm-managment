$kind: http-example
request:
  url: "{{base_url}}/tasks"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "title": "Weigh a sample of 20 birds",
        "category": "growth_monitoring",
        "due_date": "{{date_in_7d}}",
        "due_time": "08:00",
        "production_cycle_id": "{{cycle_id}}",
        "linked_record_type": "weight",
        "requires_evidence": true,
        "assigned_user_id": "{{user_id}}",
        "instructions": "Weigh 20 random birds from Pen 1 and record the total",
        "idempotency_key": "{{task_key}}"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "You are not allowed to perform this action.",
        "code": "forbidden",
        "request_id": "01a1045e-854b-71a4-9f6c-4bc89c9743d4"
      }
order: 3000
