$kind: http-example
name: "201 Created — Applied again"
request:
  url: "{{base_url}}/work-templates/{{template_farm_id}}/apply"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
          "production_cycle_id": "01a1ac3c-7f21-7084-8b1d-e44228289412",
          "start_date": "2026-10-27",
          "confirm_reapply": true,
          "idempotency_key": "capture-apply-0003"
      }
response:
  statusCode: 201
  statusText: "Created"
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "data": {
              "id": "01a1ac3c-947d-7209-bfce-60d73b39093b",
              "work_template_id": "01a1ac3c-838e-7193-8fcd-921886e0d150",
              "template_version": 1,
              "production_cycle_id": "01a1ac3c-7f21-7084-8b1d-e44228289412",
              "breeding_project_id": null,
              "status": "active",
              "start_date": "2026-10-27",
              "schedules_created": 3,
              "tasks_created": 20,
              "skipped_past": 0,
              "skipped_no_anchor": 0,
              "removed_at": null,
              "tasks_cancelled": 0,
              "created_by": "01a1ac3c-7d9a-73a4-961e-4cc559ed1203",
              "applied_at": "2026-10-14T11:00:00.000000Z",
              "created_at": "2026-10-14T11:00:00.000000Z"
          },
          "meta": [],
          "message": "Template applied."
      }
