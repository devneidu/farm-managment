$kind: http-example
name: "201 Created — Repeating task created."
request:
  url: "{{base_url}}/tasks"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "title": "Weigh a sample of 20 birds",
        "category": "growth_monitoring",
        "due_date": "{{date_in_7d}}",
        "production_cycle_id": "{{cycle_id}}",
        "reminders": ["1_day"],
        "repeat": {
          "pattern": "weekly",
          "every": 1,
          "weekdays": [5],
          "ends": { "type": "batch_end" }
        },
        "idempotency_key": "{{task_repeat_key}}"
      }
