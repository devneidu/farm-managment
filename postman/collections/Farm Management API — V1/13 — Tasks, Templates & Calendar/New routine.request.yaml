$kind: http-request
description: |-
  **WHAT IT DOES**
  Creates a farm routine: a named set of steps. Each step uses the task form's language (`repeat`, `reminders`) and counts from an anchor; the default anchor `start_date` is the date chosen when the routine is used (day 1 = `offset_days` 0).

  **WHEN TO USE IT**
  The Routines page "New routine" form.

  **IMPORTANT INPUTS**
  - `applies_to`: `production_cycle` (a batch; add `cycle_kind` / `species_id` / `crop_type_id` to limit it, leave them out for any batch), `breeding_project`, or `farm` (general, no batch).
  - `items[]`: `title`, `category`, `anchor` (default `start_date`), `offset_days`, `due_time`, `reminders` (`on_the_day|1_day|2_days|7_days`), `repeat {pattern, every, weekdays, ends{type: days|date|batch_end|never, days, date}}`.

  **IMPORTANT BEHAVIOR**
  - Requires `task.manage`. 201 `data` is the routine with `step_count`, `scope`, `scope_label`.
  - General routines cannot use `batch_end`, a record link or filters (422).
  - Editing later is `PATCH /work-templates/{id}` (version + 1; applied routines are never changed).

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Full flow with examples: `docs/api/FRONTEND-ROUTINES-FLOW.md`; reference: `docs/api/PHASE-12-WORK.md`.
url: "{{base_url}}/work-templates"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
        "name": "Broiler weekly care",
        "description": "What I do every week with a new flock.",
        "applies_to": "production_cycle",
        "cycle_kind": "livestock",
        "species_id": "01a1ac3b-cde2-729c-8779-9d17487ba446",
        "items": [
            {
                "title": "Check chicks and brooder heat",
                "category": "growth_monitoring",
                "anchor": "start_date",
                "offset_days": 0,
                "due_time": "07:00",
                "reminders": [
                    "on_the_day"
                ]
            },
            {
                "title": "Weigh a sample of 30 birds",
                "category": "growth_monitoring",
                "anchor": "start_date",
                "offset_days": 6,
                "reminders": [
                    "1_day",
                    "on_the_day"
                ],
                "repeat": {
                    "pattern": "weekly",
                    "every": 1,
                    "weekdays": [
                        5
                    ],
                    "ends": {
                        "type": "days",
                        "days": 35
                    }
                }
            },
            {
                "title": "Clean drinkers",
                "category": "cleaning_sanitation",
                "anchor": "start_date",
                "offset_days": 1,
                "repeat": {
                    "pattern": "daily",
                    "every": 1,
                    "ends": {
                        "type": "batch_end"
                    }
                }
            }
        ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("template_farm_id", String(v)); else console.warn("Could not capture template_farm_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/New routine.resources/examples
order: 27000
