$kind: http-example
name: 201 Created — Operational record saved.
request:
  url: "{{base_url}}/records"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "type": "crop_loss",
        "production_cycle_id": "{{crop_cycle_id}}",
        "recorded_at": "{{recorded_at_2h}}",
        "idempotency_key": "{{$guid}}",
        "details": {
          "units_lost": 12,
          "cause": "Flooding after heavy rain",
          "affected_area": {
            "quantity": "0.1",
            "unit": "hectare"
          }
        }
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "01a1045e-6f6d-723a-8ff5-bdb1989c263c",
