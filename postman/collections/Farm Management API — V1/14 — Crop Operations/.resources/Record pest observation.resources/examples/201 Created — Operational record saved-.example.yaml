$kind: http-example
name: 201 Created — Operational record saved.
request:
  url: "{{base_url}}/records"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "type": "pest_observation",
        "production_cycle_id": "{{crop_cycle_id}}",
        "recorded_at": "{{recorded_at_2h}}",
        "idempotency_key": "{{$guid}}",
        "details": {
          "issue": "Yam beetle damage on lower leaves",
          "severity": "moderate",
          "action": "Spraying scheduled for Monday"
        }
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "01a1045e-6f0d-700e-9499-d5dd063884b9",
          "production_cycle_id": "01a1045e-505b-72ef-b497-d1ec4ef86059",
          "type": "pest_observation",
          "details": {
            "issue": "Yam beetle damage on lower leaves",
            "severity": "moderate",
            "action": "Spraying scheduled for Monday"
          },
          "measurement": null,
          "population_delta": 0,
          "recorded_at": "2026-10-03T22:44:06.000000Z",
          "notes": null,
          "reverses_record_id": null,
          "corrects_record_id": null,
          "reversed_by_record_id": null,
          "inventory_movement_id": null,
          "created_by": "01a1045e-3bbd-71f5-b8b6-0aa8ede5c0b5",
          "created_at": "2026-10-04T00:45:08.000000Z",
          "attachments": []
        },
        "meta": {},
        "message": "Operational record saved."
      }
order: 1000
