$kind: http-example
request:
  url: "{{base_url}}/insights?severity=info"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  queryParams:
    - key: severity
      value: info
    - key: limit
      value: ""
      disabled: true
      description: Most insights to return, 1-50 (default 50). — integer — min 1, max 50
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": [
          {
            "id": "medicine_withdrawal:farm",
            "code": "medicine_withdrawal",
            "severity": "info",
            "title": "Medicine withdrawal in effect",
            "message": "1 medicine line is still inside the withdrawal period; check before selling eggs, milk or meat.",
            "why": {
              "rule": "medicine_withdrawal",
              "lines": 1,
              "cycles": 1,
              "latest_ends_at": "2026-10-10T22:44:06.000000Z"
            },
            "subject": null,
            "data": {
              "latest_ends_at": "2026-10-10T22:44:06.000000Z"
            }
          }
        ],
        "meta": {
          "total": 1,
          "by_severity": {
            "critical": 0,
            "warning": 0,
