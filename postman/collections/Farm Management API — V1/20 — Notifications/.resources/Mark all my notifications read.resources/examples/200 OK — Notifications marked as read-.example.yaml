$kind: http-example
name: 200 OK — Notifications marked as read.
request:
  url: "{{base_url}}/notifications/read-all"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "updated": 1
        },
        "meta": {},
        "message": "Notifications marked as read."
      }
order: 1000
