$kind: http-example
name: 200 OK — Preferences updated.
request:
  url: "{{base_url}}/settings/notifications"
  method: PUT
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "channels": {
          "in_app": true,
          "email": true
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "channels": {
            "in_app": true,
            "email": true
          }
        },
        "meta": {},
        "message": "Preferences updated."
      }
order: 1000
