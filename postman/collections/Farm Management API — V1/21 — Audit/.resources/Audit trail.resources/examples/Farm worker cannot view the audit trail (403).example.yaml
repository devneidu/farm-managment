$kind: http-example
request:
  url: "{{base_url}}/audit?from={{date_7d_ago}}&to={{today}}&resource_type=operational_record"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  queryParams:
    - key: from
      value: "{{date_7d_ago}}"
