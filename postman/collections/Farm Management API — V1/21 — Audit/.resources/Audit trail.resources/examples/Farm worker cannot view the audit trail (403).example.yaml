      value: ""
      disabled: true
      description: string (uuid)
    - key: action
      value: ""
      disabled: true
      description: Exact action code, for example `record.reversed` or `team.member_role_changed`. — string — max 60 chars
    - key: resource_id
      value: ""
      disabled: true
      description: Everything that happened to one resource (including the reversal/correction rows that point at it). — string (uuid)
    - key: request_id
      value: ""
      disabled: true
      description: string — max 100 chars
    - key: production_cycle_id
      value: ""
      disabled: true
      description: string (uuid)
    - key: page
      value: ""
      disabled: true
      description: integer — min 1
    - key: per_page
      value: ""
      disabled: true
      description: integer — min 1, max 100
