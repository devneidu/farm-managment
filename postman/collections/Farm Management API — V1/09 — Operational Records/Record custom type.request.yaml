$kind: http-request
description: |-
  **WHAT IT DOES**
  Records a farm-made (or public) type against a batch or crop project: `type: "custom"`, `custom_record_type_id`, and `details` = the type's visible field keys.

  **WHEN TO USE IT**
  The record form built from the type's field list (`GET /master/record-types` -> `custom_fields`, or `GET /master/record-operations/custom:{id}`).

  **IMPORTANT BEHAVIOR**
  - Requires `record.create`. The type must be visible to the farm, active and fit the batch (`applies_to`, species / crop): otherwise `422` on `custom_record_type_id` (an unknown type and another farm's private type give the same answer).
  - Numbers are stored as exact decimal strings, whole numbers as integers, yes/no as booleans. Unknown or hidden keys are `422`.
  - No measurement, population, stock or money effect. Reverse with `POST /records/{id}/reverse`.

  ---
  **REFERENCE (detail)**


  **AUTHENTICATION**
  **Required** — Sanctum session cookie.

  **URL**
  `POST {{base_url}}/records`

  **SUCCESS**
  `201 Created` - the record with `type_name`, `custom_record_type_id`, `custom_schema_version` and `custom.fields[]` (label + value).

  **ERRORS**
  - `403`, `409 cycle_closed` / `idempotency_conflict`, `422 validation_failed`.
url: "{{base_url}}\/records"
method: POST
headers:
  - key: Accept
    value: "application\/json"
  - key: Origin
    value: "{{frontend_origin}}"
    description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
  - key: Content-Type
    value: "application\/json"
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
  - key: X-Farm-Id
    value: "{{farm_id}}"
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
    disabled: true
body:
  type: json
  content: |-
    {
      "production_cycle_id": "{{cycle_id}}",
      "type": "custom",
      "custom_record_type_id": "{{custom_record_type_id}}",
      "recorded_at": "{{recorded_at}}",
      "notes": "Morning round",
      "idempotency_key": "{{$guid}}",
      "details": {
        "crates_collected": "12.5",
        "cracked_eggs": 3,
        "shell_colour": "Brown",
        "checked_on": "2026-02-01",
        "house_clean": true,
        "remark": "Feed low"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
    language: text/javascript
examples: ./.resources/Record custom type.resources/examples
order: 43999
