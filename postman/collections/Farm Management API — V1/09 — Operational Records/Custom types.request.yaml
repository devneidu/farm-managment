$kind: http-request
description: |-
  **WHAT IT DOES**
  Lists the record types this farm made (`source: farm`) and the public ones (`source: public`), A-Z, with each type's field list, `version`, `in_use`, `records_count` (this farm's records) and `can_edit`.

  **WHEN TO USE IT**
  The "Record types" settings page. For the record forms use `GET /master/record-types` or the cycle's `available_record_types`.

  **IMPORTANT INPUTS**
  - `include_archived=true`, `source=farm|public`, `applies_to=livestock|crop|both`.

  **IMPORTANT BEHAVIOR**
  - Requires `master_data.view` (every role). Another farm's private types never appear.
  - `fields[].locked` is true once records use the type (see the edit rules on "Edit custom type").

  **FRONTEND NOTES**
  - See `docs/api/FRONTEND-CUSTOM-RECORDS-FLOW.md`.

  ---
  **REFERENCE (detail)**


  **AUTHENTICATION**
  **Required** — Sanctum session cookie.

  **URL**
  `GET {{base_url}}/custom-record-types`

  **ERRORS**
  - `401 unauthenticated`, `403 forbidden`, `422 validation_failed`.
url: "{{base_url}}\/custom-record-types"
method: GET
headers:
  - key: Accept
    value: "application\/json"
  - key: Origin
    value: "{{frontend_origin}}"
    description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
  - key: X-Farm-Id
    value: "{{farm_id}}"
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
    disabled: true
queryParams:
  - key: include_archived
    value: ""
    disabled: true
    description: "boolean: true | false"
  - key: source
    value: ""
    disabled: true
    description: "enum: farm | public"
  - key: applies_to
    value: ""
    disabled: true
    description: "enum: livestock | crop | both"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Custom types.resources/examples
order: 42000
