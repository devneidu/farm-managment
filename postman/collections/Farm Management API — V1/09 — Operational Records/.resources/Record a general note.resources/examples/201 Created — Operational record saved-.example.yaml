$kind: http-example
name: 201 Created — Operational record saved.
request:
  url: "{{base_url}}/records"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "type": "general_note",
        "production_cycle_id": "{{cycle_id}}",
        "recorded_at": "{{recorded_at_3h}}",
        "idempotency_key": "{{$guid}}",
        "details": {
          "text": "Vaccination team visited the farm; pens 1 and 2 inspected."
        }
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "01a1045e-6648-7118-a353-4feb5726a55c",
          "production_cycle_id": "01a1045e-4eb5-7020-85dc-ac87e0bd8aef",
          "type": "general_note",
          "details": {
            "text": "Vaccination team visited the farm; pens 1 and 2 inspected."
          },
          "measurement": null,
          "population_delta": 0,
          "recorded_at": "2026-10-03T21:44:06.000000Z",
          "notes": null,
          "reverses_record_id": null,
          "corrects_record_id": null,
          "reversed_by_record_id": null,
          "inventory_movement_id": null,
          "created_by": "01a1045e-3bbd-71f5-b8b6-0aa8ede5c0b5",
          "created_at": "2026-10-04T00:45:08.000000Z",
          "attachments": []
        },
        "meta": {},
        "message": "Operational record saved."
      }
order: 1000
