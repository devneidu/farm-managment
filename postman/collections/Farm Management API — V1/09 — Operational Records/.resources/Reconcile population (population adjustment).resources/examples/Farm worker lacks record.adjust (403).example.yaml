$kind: http-example
request:
  url: "{{base_url}}/records"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "type": "population_adjustment",
        "production_cycle_id": "{{cycle_id}}",
        "recorded_at": "{{recorded_at}}",
        "idempotency_key": "{{$guid}}",
        "details": {
          "expected_population": 495,
          "actual_population": 493,
          "reason": "Physical recount after house clean-out"
        }
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "You are not allowed to perform this action.",
        "code": "forbidden",
        "request_id": "01a1045e-6734-700d-a667-89cd3fad5a60"
      }
order: 3000
