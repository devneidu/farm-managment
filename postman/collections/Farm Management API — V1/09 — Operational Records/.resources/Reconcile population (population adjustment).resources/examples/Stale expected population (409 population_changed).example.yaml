$kind: http-example
request:
  url: "{{base_url}}/records"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "type": "population_adjustment",
        "production_cycle_id": "{{cycle_id}}",
        "recorded_at": "{{recorded_at}}",
        "idempotency_key": "{{$guid}}",
        "details": {
          "expected_population": 999,
          "actual_population": 990,
          "reason": "Test"
        }
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The ledger population changed; refresh the expected count before reconciling.",
        "code": "population_changed",
        "request_id": "01a1045e-66e9-706f-a05f-75978f384cfb"
      }
order: 2000
