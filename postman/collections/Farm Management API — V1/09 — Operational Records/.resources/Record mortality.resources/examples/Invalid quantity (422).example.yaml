$kind: http-example
request:
  url: "{{base_url}}/records"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "type": "mortality",
        "production_cycle_id": "{{cycle_id}}",
        "recorded_at": "{{recorded_at_3h}}",
        "idempotency_key": "{{$guid}}",
        "details": {
          "quantity": 0,
          "cause": "Test"
        }
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The details.quantity must be a positive whole-number count of at most 12 digits.",
        "code": "validation_failed",
        "request_id": "01a1045e-638a-708e-b7fc-036afb75c126",
        "errors": {
          "details.quantity": [
            "The details.quantity must be a positive whole-number count of at most 12 digits."
          ]
        }
      }
order: 3000
