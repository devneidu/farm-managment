$kind: http-example
request:
  url: "{{base_url}}/records"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "type": "feed_use",
        "production_cycle_id": "{{cycle_id}}",
        "recorded_at": "{{recorded_at_3h}}",
        "idempotency_key": "{{$guid}}",
        "details": {
          "feed_name": "Layer Grower Mash",
          "components": [
            {
              "quantity": "25",
              "unit": "kg"
            }
          ],
          "inventory": {
            "item_id": "{{item_feed_id}}",
            "storage_location_id": "{{store_id}}"
          }
        }
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "You are not allowed to perform this action.",
        "code": "forbidden",
        "request_id": "01a1045e-621c-71af-ac8f-1ba300ac1e2f"
      }
order: 3000
