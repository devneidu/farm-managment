$kind: http-example
request:
  url: "{{base_url}}/records"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "type": "feed_use",
        "production_cycle_id": "{{cycle_id}}",
        "recorded_at": "{{recorded_at_3h}}",
        "idempotency_key": "{{$guid}}",
        "details": {
          "feed_name": "Layer Grower Mash",
          "components": [
            {
              "quantity": "99999",
              "unit": "kg"
            }
          ],
          "inventory": {
            "item_id": "{{item_feed_id}}",
            "storage_location_id": "{{store_id}}"
          }
        }
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "There is not enough stock in this location.",
        "code": "insufficient_stock",
        "request_id": "01a1045e-6192-7086-a504-0d89139f8731",
        "details": {
          "available": {
            "quantity": "250",
            "unit": "kg"
          },
          "requested": {
            "quantity": "99999",
            "unit": "kg"
          }
        }
      }
order: 2000
