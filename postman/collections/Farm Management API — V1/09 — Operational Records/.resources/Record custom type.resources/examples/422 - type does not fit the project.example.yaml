$kind: http-example
name: "422 - type does not fit the project"
request:
  url: "{{base_url}}\/records"
  method: POST
  headers:
    - key: Accept
      value: "application\/json"
    - key: Origin
      value: "{{frontend_origin}}"
      description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
    - key: Content-Type
      value: "application\/json"
    - key: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
      description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "production_cycle_id": "{{cycle_id}}",
        "type": "custom",
        "custom_record_type_id": "{{custom_record_type_id}}",
        "recorded_at": "{{recorded_at}}",
        "notes": "Morning round",
        "idempotency_key": "{{$guid}}",
        "details": {
          "crates_collected": "12.5",
          "cracked_eggs": 3,
          "shell_colour": "Brown",
          "checked_on": "2026-02-01",
          "house_clean": true,
          "remark": "Feed low"
        }
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "This record type is for livestock batches, not crop projects.",
        "code": "validation_failed",
        "request_id": "01a1bcc2-2cba-70a4-96d4-86980b3da299",
        "errors": {
          "custom_record_type_id": [
            "This record type is for livestock batches, not crop projects."
          ]
        }
      }
