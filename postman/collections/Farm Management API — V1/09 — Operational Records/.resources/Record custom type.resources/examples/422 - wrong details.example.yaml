$kind: http-example
name: "422 - wrong details"
request:
  url: "{{base_url}}\/records"
  method: POST
  headers:
    - key: Accept
      value: "application\/json"
    - key: Origin
      value: "{{frontend_origin}}"
      description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
    - key: Content-Type
      value: "application\/json"
    - key: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
      description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "production_cycle_id": "{{cycle_id}}",
        "type": "custom",
        "custom_record_type_id": "{{custom_record_type_id}}",
        "recorded_at": "{{recorded_at}}",
        "notes": "Morning round",
        "idempotency_key": "{{$guid}}",
        "details": {
          "crates_collected": "900",
          "shell_colour": "Green",
          "surprise": "x"
        }
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The details field must be an array. (and 2 more errors)",
        "code": "validation_failed",
        "request_id": "01a1bcc2-2b10-7310-a319-6e4f23c339aa",
        "errors": {
          "details": [
            "The details field must be an array."
          ],
          "details.crates_collected": [
            "It must be at most 500."
          ],
          "details.shell_colour": [
            "The selected details.shell colour is invalid."
          ]
        }
      }
