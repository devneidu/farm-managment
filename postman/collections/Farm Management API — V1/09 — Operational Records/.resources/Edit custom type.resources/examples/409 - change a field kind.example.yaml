$kind: http-example
name: "409 - change a field kind"
request:
  url: "{{base_url}}\/custom-record-types\/{{custom_record_type_id}}"
  method: PATCH
  headers:
    - key: Accept
      value: "application\/json"
    - key: Origin
      value: "{{frontend_origin}}"
      description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
    - key: Content-Type
      value: "application\/json"
    - key: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
      description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "fields": [
          {
            "key": "crates_collected",
            "max": "500",
            "min": "0",
            "kind": "number",
            "unit": "crates",
            "label": "Crates",
            "hidden": false,
            "required": true
          },
          {
            "key": "cracked_eggs",
            "kind": "short_text",
            "label": "Cracked eggs",
            "hidden": false,
            "required": false
          },
          {
            "key": "shell_colour",
            "kind": "choose_one",
            "label": "Shell colour",
            "hidden": false,
            "options": [
              "White",
              "Brown",
              "Mixed",
              "Cream"
            ],
            "required": false
          },
          {
            "key": "checked_on",
            "kind": "date",
            "label": "Checked on",
            "hidden": false,
            "required": false
          },
          {
            "key": "house_clean",
            "kind": "yes_no",
            "label": "House clean",
            "hidden": false,
            "required": false
          },
          {
            "key": "remark",
            "kind": "short_text",
            "label": "Remark",
            "hidden": true,
            "required": false
          }
        ]
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The field \"Cracked eggs\" already has records, so its type cannot change. Add a new field instead.",
        "code": "custom_type_in_use",
        "request_id": "01a1bcc2-35b2-7123-bbc6-b086ddd1df4a",
        "details": {
          "field_key": "cracked_eggs",
          "rule": "kind"
        }
      }
