$kind: http-example
name: "409 - delete a field that has records"
request:
  url: "{{base_url}}\/custom-record-types\/{{custom_record_type_id}}"
  method: PATCH
  headers:
    - key: Accept
      value: "application\/json"
    - key: Origin
      value: "{{frontend_origin}}"
      description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
    - key: Content-Type
      value: "application\/json"
    - key: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
      description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "fields": [
          {
            "key": "cracked_eggs",
            "kind": "whole_number",
            "label": "Cracked eggs",
            "hidden": false,
            "required": false
          },
          {
            "key": "shell_colour",
            "kind": "choose_one",
            "label": "Shell colour",
            "hidden": false,
            "options": [
              "White",
              "Brown",
              "Mixed",
              "Cream"
            ],
            "required": false
          },
          {
            "key": "checked_on",
            "kind": "date",
            "label": "Checked on",
            "hidden": false,
            "required": false
          },
          {
            "key": "house_clean",
            "kind": "yes_no",
            "label": "House clean",
            "hidden": false,
            "required": false
          },
          {
            "key": "remark",
            "kind": "short_text",
            "label": "Remark",
            "hidden": true,
            "required": false
          }
        ]
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The field \"Crates collected\" already has records, so it cannot be deleted. Hide it instead.",
        "code": "custom_type_in_use",
        "request_id": "01a1bcc2-3086-7287-aa5a-8bd5c961ec49",
        "details": {
          "field_key": "crates_collected",
          "rule": "delete"
        }
      }
