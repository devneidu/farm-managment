$kind: http-example
name: "422 - more than 15 fields"
request:
  url: "{{base_url}}\/custom-record-types"
  method: POST
  headers:
    - key: Accept
      value: "application\/json"
    - key: Origin
      value: "{{frontend_origin}}"
      description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
    - key: Content-Type
      value: "application\/json"
    - key: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
      description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "name": "Big",
        "applies_to": "both",
        "fields": [
          {
            "label": "F1",
            "kind": "short_text"
          },
          {
            "label": "... 16 fields",
            "kind": "short_text"
          }
        ]
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The fields field must not have more than 15 items.",
        "code": "validation_failed",
        "request_id": "01a1bcc2-26b3-72dd-a7df-a9b851b1dad6",
        "errors": {
          "fields": [
            "The fields field must not have more than 15 items."
          ]
        }
      }
