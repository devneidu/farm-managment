$kind: http-example
name: "201 Created - record type created"
request:
  url: "{{base_url}}\/custom-record-types"
  method: POST
  headers:
    - key: Accept
      value: "application\/json"
    - key: Origin
      value: "{{frontend_origin}}"
      description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
    - key: Content-Type
      value: "application\/json"
    - key: X-XSRF-TOKEN
      value: "{{xsrf_token}}"
      description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "name": "Egg check",
        "description": "Quick daily check of the egg room",
        "applies_to": "livestock",
        "fields": [
          {
            "label": "Crates collected",
            "kind": "number",
            "unit": "crates",
            "min": "0",
            "max": "500",
            "required": true
          },
          {
            "label": "Cracked eggs",
            "kind": "whole_number"
          },
          {
            "label": "Shell colour",
            "kind": "choose_one",
            "options": [
              "White",
              "Brown",
              "Mixed"
            ]
          },
          {
            "label": "Checked on",
            "kind": "date"
          },
          {
            "label": "House clean",
            "kind": "yes_no"
          },
          {
            "label": "Remark",
            "kind": "short_text"
          }
        ]
      }
