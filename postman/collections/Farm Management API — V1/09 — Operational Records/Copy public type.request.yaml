$kind: http-request
description: |-
  **WHAT IT DOES**
  Copies a PUBLIC, active record type into this farm: a private, editable copy (version 1, same fields) with an optional new `name`.

  **IMPORTANT BEHAVIOR**
  - Requires `master_data.manage`. Only public active types can be copied (`404` otherwise); a name already used on the farm is `409 duplicate_name`.
  - While the farm has an active copy, the public original is no longer offered in its record forms.

  ---
  **REFERENCE (detail)**


  **AUTHENTICATION**
  **Required** — Sanctum session cookie.

  **URL**
  `POST {{base_url}}/custom-record-types/{{public_record_type_id}}/copy`
url: "{{base_url}}\/custom-record-types\/{{public_record_type_id}}\/copy"
method: POST
headers:
  - key: Accept
    value: "application\/json"
  - key: Origin
    value: "{{frontend_origin}}"
    description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
  - key: Content-Type
    value: "application\/json"
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
  - key: X-Farm-Id
    value: "{{farm_id}}"
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
    disabled: true
body:
  type: json
  content: |-
    {
      "name": "Visitor log"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
    language: text/javascript
examples: ./.resources/Copy public type.resources/examples
order: 46000
