$kind: http-request
description: |-
  **WHAT IT DOES**
  Archives a record type of this farm: it leaves every record form; existing records stay readable. `/unarchive` restores it.

  **IMPORTANT BEHAVIOR**
  - Requires `master_data.manage`. `409 type_already_archived` / `409 type_not_archived`. Public types are `404` (the platform archives those).

  ---
  **REFERENCE (detail)**


  **AUTHENTICATION**
  **Required** — Sanctum session cookie.

  **URL**
  `POST {{base_url}}/custom-record-types/{{custom_record_type_id}}/archive`
url: "{{base_url}}\/custom-record-types\/{{custom_record_type_id}}\/archive"
method: POST
headers:
  - key: Accept
    value: "application\/json"
  - key: Origin
    value: "{{frontend_origin}}"
    description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: "CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script."
  - key: X-Farm-Id
    value: "{{farm_id}}"
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
    disabled: true
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 or 409", function () { pm.expect(pm.response.code).to.be.oneOf([200, 409]); });
    language: text/javascript
examples: ./.resources/Archive custom type.resources/examples
order: 45000
