$kind: http-request
description: |-
  **WHAT IT DOES**
  One record with `details`, derived `measurement`, `population_delta`, reversal/correction links and attachments.

  **WHEN TO USE IT**
  A record detail view with evidence and reversal links.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{record_mortality_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `record.view` (taken from the current farm context; never sent by the client).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`record.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/records/{{record_mortality_id}}`

  **PATH PARAMETERS**
  - `{{record_mortality_id}}` — UUID. Captured by "Record mortality" (09 — Operational Records) or from the list endpoint of this resource.

  **VARIABLES USED**
  - `{{record_mortality_id}}` — captured by "Record mortality"

  **SUCCESS**
  `200 OK`

  `data` fields: `id`, `production_cycle_id`, `type`, `details`, `measurement`, `population_delta`, `recorded_at`, `notes`, `reverses_record_id`, `corrects_record_id`, `reversed_by_record_id`, `inventory_movement_id`, `created_by`, `created_at`, `attachments`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `record.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
url: "{{base_url}}/records/{{record_mortality_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Show a record.resources/examples
order: 17000
