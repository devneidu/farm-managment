  ## 5. Response conventions

  * Success: `{"data": ..., "meta": {}, "message": null}`. Lists: `data` is an array and `meta` is `{current_page, per_page, last_page, total}` (some also add counters such as `unread_count`).
  * Errors: `{"message": "...", "code": "...", "request_id": "...", "errors": {...}?, "details": {...}?}`. `errors` only on `422` (keys like `details.quantity`); `details` carries structured context (for example plan limits). Branch on `code`, never on `message`.
  * Every response has an `X-Request-Id` header, echoed as `request_id` in errors: quote it when reporting a problem.
  * Status/`code`: `401 unauthenticated`, `403 forbidden` (and `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`, `platform_admin_required`, `platform_write_forbidden`), `404 not_found`, `409 conflict` (domain codes such as `insufficient_stock`), `419 session_expired`, `422 validation_failed`, `429 too_many_requests` (+ `Retry-After`).

  ## 6. Identifiers

  Domain resources are identified by **UUIDv7 strings** (`019f0000-0000-7000-8000-000000000001`). Never use sequential integers. Human-readable references (`BAT-2026-00001`, `CRP-...`, `BRD-...`, `TSK-...`, `INV-...`) are display codes only: always send the UUID `id`. Master data additionally has stable `code`s (`chicken`, `poultry`) that you may branch on. `GET /farm/members/{id}` takes the **membership** id, not the user id.

  ## 7. Idempotency

  Mutating endpoints that create real-world events require an `idempotency_key` **in the request body** (1-80 characters: letters, digits, `.`, `_`, `:`, `-`; exports and schedules need at least 8). Same key + same payload returns the original result (usually `201`) and applies no second side effect; same key + changed payload is `409 idempotency_conflict`. Generate one UUID per user action and reuse it only when retrying that same action. The collection uses `{{$guid}}`; requests that demonstrate replay store the key in a variable first.

  ## 8. Money, quantities and time

  * Money is a decimal **string** with at most two decimals (`"1500.50"`); totals are computed by the API with exact arithmetic. Never use JavaScript floats for authoritative money. Plan prices are integer minor units (`amount_minor`, kobo).
  * Quantities are exact decimal strings in `{quantity, unit}` components (`12 bag + 18 kg`); package units resolve only through a configured context/conversion. Responses include `entered`, `normalized` (canonical g/ml/piece/head/celsius) and a replayable `snapshot`.
  * Timestamps are UTC ISO-8601. `recorded_at` (when it really happened) is kept separately from `created_at` (when it was stored) and must be `YYYY-MM-DDTHH:MM:SS` followed by `Z` or an offset. Dates (`start_date`, `due_date`, `occurred_on`, report ranges) are farm-local calendar days `YYYY-MM-DD`.
  * Boolean query parameters: send `1` or `0` (the strings `true`/`false` are rejected by most endpoints).

  ## 9. Folders

  `00`-`22` are the reference, grouped by module. `90 — Platform Admin` is separate. `99 — Workflows` contains executable end-to-end flows. Requests marked with their own saved examples show real success and error responses (lists are truncated to the first two items).
variables:
  base_url: http://localhost:8000/api/v1
  frontend_origin: http://localhost:3000
  otp_email: ""
scripts:
  - type: http:beforeRequest
    code: |-
      // Farm Management API - collection pre-request script (runs before EVERY request).
      // 1) Sanctum SPA requirements of this API (verified against the backend):
      //    - a stateful Origin on EVERY request (SANCTUM_STATEFUL_DOMAINS), otherwise the session is ignored / register is 400;
      //    - on POST/PUT/PATCH/DELETE the header X-XSRF-TOKEN = URL-decoded value of the XSRF-TOKEN cookie issued by GET /auth/csrf-cookie.
      const origin = pm.environment.get("frontend_origin") || pm.collectionVariables.get("frontend_origin") || "http://localhost:3000";
      pm.variables.set("frontend_origin", origin);                       // also resolves the visible Origin header
      pm.request.headers.upsert({ key: "Origin", value: origin });
      pm.request.headers.upsert({ key: "Accept", value: "application/json" });
      // {{xsrf_token}} is refreshed by the collection Tests script after EVERY response (Laravel rotates the CSRF token on login/register/logout),
      // so it is the newest value; the cookie jar is only the fallback (first request, or after the variable was cleared).
      let xsrf = pm.environment.get("xsrf_token");
      if (!xsrf) { const c = pm.cookies.get("XSRF-TOKEN"); if (c) { xsrf = decodeURIComponent(c); pm.environment.set("xsrf_token", xsrf); } }
      xsrf = xsrf || "";
      pm.variables.set("xsrf_token", xsrf);                              // resolves the visible X-XSRF-TOKEN header
      if (!["GET", "HEAD", "OPTIONS"].includes(pm.request.method)) {
        if (xsrf) { pm.request.headers.upsert({ key: "X-XSRF-TOKEN", value: xsrf }); }
        else { console.warn("No XSRF-TOKEN cookie yet: send \"Initialise CSRF cookie\" (GET /auth/csrf-cookie) first."); }
      }
      // 2) Per-request dynamic values (local variables). Lagos is UTC+1 with no daylight saving.
      const H = 3600e3, D = 24 * H, now = Date.now();
      const iso = (ms) => new Date(ms).toISOString().replace(/\.\d{3}Z$/, "Z");
      const lagos = (days) => new Date(now + H + days * D).toISOString().slice(0, 10);
      pm.variables.set("recorded_at", iso(now - 1 * H));
      pm.variables.set("recorded_at_2h", iso(now - 2 * H));
      pm.variables.set("recorded_at_3h", iso(now - 3 * H));
      pm.variables.set("recorded_at_30h", iso(now - 30 * H));
      pm.variables.set("today", lagos(0));
      [[0, "date_today"], [7, "date_in_7d"], [14, "date_in_14d"], [30, "date_in_30d"], [60, "date_in_60d"], [90, "date_in_90d"], [-7, "date_7d_ago"], [-10, "date_10d_ago"], [-30, "date_30d_ago"]].forEach(([d, k]) => pm.variables.set(k, lagos(d)));
      pm.variables.set("month_start", lagos(0).slice(0, 8) + "01");
    language: text/javascript
  - type: http:afterResponse
    code: |-
      // Keep {{xsrf_token}} equal to the CURRENT XSRF-TOKEN cookie after EVERY response.
      // Laravel rotates the CSRF token whenever the session is regenerated (login, register, logout) and re-issues the cookie on that response;
      // a value remembered earlier (e.g. at "Initialise CSRF cookie") is then stale and the next write fails with 419 session_expired.
      // The new value is read from this response's Set-Cookie header (does not depend on the cookie jar API).
      let fresh;
      pm.response.headers.each(function (h) { if (String(h.key).toLowerCase() === "set-cookie" && /^XSRF-TOKEN=/.test(h.value)) { fresh = h.value.split(";")[0].slice("XSRF-TOKEN=".length); } });
      if (!fresh && pm.response.cookies) { fresh = pm.response.cookies.get("XSRF-TOKEN"); }
      if (!fresh) { fresh = pm.cookies.get("XSRF-TOKEN"); }
      if (fresh) { pm.environment.set("xsrf_token", decodeURIComponent(fresh)); }
      console.log("[csrf] xsrf_token " + (fresh ? "refreshed from this response" : "unchanged") + " (fingerprint " + String(pm.environment.get("xsrf_token") || "").slice(12, 24) + ")");
    language: text/javascript
