$kind: http-example
request:
  url: "{{base_url}}/inventory/stock-in"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "inventory_item_id": "{{item_fert_id}}",
        "storage_location_id": "{{store_id}}",
        "reason": "opening_balance",
        "components": [
          {
            "quantity": "2",
            "unit": "bag"
          }
        ],
        "recorded_at": "{{recorded_at_30h}}",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "No conversion is configured for bag in this context.",
        "code": "conversion_not_configured",
        "request_id": "01a1045e-5828-721c-8fd6-d0274586080c",
        "details": {
          "unit": "bag",
          "context": {
            "type": "inventory_item",
            "id": "01a1045e-5637-7074-bd1b-d498ec86d4cf",
            "label": "NPK 15-15-15"
          },
          "inactive": false
        }
      }
order: 4000
