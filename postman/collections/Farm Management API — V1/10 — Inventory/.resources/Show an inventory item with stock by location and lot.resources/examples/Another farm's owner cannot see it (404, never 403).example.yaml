$kind: http-example
request:
  url: "{{base_url}}/inventory/items/{{item_feed_id}}"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The requested resource was not found.",
        "code": "not_found",
        "request_id": "01a1045e-6064-73c6-ae9a-17e9969c96e5"
      }
order: 3000
