$kind: http-example
name: 200 OK — Inventory item updated.
request:
  url: "{{base_url}}/inventory/items/{{item_feed_id}}"
  method: PATCH
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "description": "Compounded grower mash (25 kg bags)",
        "low_stock_threshold": {
          "quantity": "75",
          "unit": "kg"
        }
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "01a1045e-54d6-72e9-93a7-37c66168067f",
          "name": "Layer Grower Mash",
          "category": "feed",
          "description": "Compounded grower mash (25 kg bags)",
          "stock_unit": "kg",
          "dimension": "weight",
          "tracks_lots": false,
          "tracks_expiry": false,
          "is_active": true,
          "stock": {
            "quantity": "318",
            "unit": "kg",
            "normalized": {
              "quantity": "318000",
              "unit": "g"
            }
          },
          "low_stock_threshold": {
            "quantity": "75",
            "unit": "kg"
          },
          "is_low_stock": false,
          "created_at": "2026-10-04T00:45:08.000000Z",
          "updated_at": "2026-10-04T00:45:08.000000Z"
        },
        "meta": {},
        "message": "Inventory item updated."
      }
order: 1000
