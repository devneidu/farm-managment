          "description": "Home-mixed starter ration",
          "version": 1,
          "is_active": true,
          "items": [
            {
              "ingredient_name": "Maize",
              "inclusion_percent": "55",
              "inventory_item_id": null
            },
            {
              "ingredient_name": "Soybean meal",
              "inclusion_percent": "30",
              "inventory_item_id": null
            }
          ],
          "created_at": "2026-10-04T00:45:08.000000Z",
          "updated_at": "2026-10-04T00:45:08.000000Z"
        },
        "meta": {},
        "message": "Feed formula created."
      }
order: 1000
