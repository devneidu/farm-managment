$kind: http-example
request:
  url: "{{base_url}}/inventory/stock-out"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "inventory_item_id": "{{item_feed_id}}",
        "storage_location_id": "{{store_id}}",
        "reason": "spoiled",
        "components": [
          {
            "quantity": "99999",
            "unit": "kg"
          }
        ],
        "recorded_at": "{{recorded_at_2h}}",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "There is not enough stock in this location.",
        "code": "insufficient_stock",
        "request_id": "01a1045e-5ca1-7103-bcd3-396781b6c2fc",
        "details": {
          "available": {
            "quantity": "293",
            "unit": "kg"
          },
          "requested": {
            "quantity": "99999",
            "unit": "kg"
          }
        }
      }
order: 2000
