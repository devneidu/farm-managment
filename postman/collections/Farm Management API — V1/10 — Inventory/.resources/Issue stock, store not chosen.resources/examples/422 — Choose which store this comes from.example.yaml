$kind: http-example
name: 422 — Choose which store this comes from
request:
  url: "{{base_url}}/inventory/stock-out"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "inventory_item_id": "{{item_feed_id}}",
        "reason": "donation",
        "components": [
          {
            "quantity": "2",
            "unit": "kg"
          }
        ],
        "recorded_at": "{{recorded_at_30h}}",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 422
  statusText: Unprocessable Content
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Choose which store this comes from.",
        "code": "validation_failed",
        "request_id": "01a1b13d-e161-7341-9fb4-600f4d06cde6",
        "errors": {
          "storage_location_id": [
            "Choose which store this comes from."
          ]
        }
      }
