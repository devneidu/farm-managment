$kind: http-example
request:
  url: "{{base_url}}/inventory/movements/{{movement_out_id}}/reverse"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "reason": "Entered against the wrong store",
        "recorded_at": "{{recorded_at}}",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "This movement is a reversal or has already been reversed.",
        "code": "movement_already_reversed",
        "request_id": "01a1045e-5ed9-73bb-8555-7e763fe70046"
      }
order: 2000
