$kind: http-request
description: |-
  **WHAT IT DOES**
  The farm-wide inventory ledger with the same filters as the per-item history plus `inventory_item_id`.

  **WHEN TO USE IT**
  The farm-wide stock ledger screen.

  **IMPORTANT INPUTS**
  - Query filters: `inventory_item_id`, `storage_location_id`, `inventory_lot_id`, `type`, `operational_record_id`, `health_record_id`, `purchase_id`, `sale_id`, ....

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `inventory.view` (taken from the current farm context; never sent by the client).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`inventory.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/inventory/movements`

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `inventory_item_id` — string (uuid)
  - `storage_location_id` — string (uuid)
  - `inventory_lot_id` — string (uuid)
  - `type` — enum. Values: `stock_in`, `stock_out`, `adjustment`, `transfer_out`, `transfer_in`, `reversal`
  - `operational_record_id` — string (uuid)
  - `health_record_id` — string (uuid)
  - `purchase_id` — string (uuid)
  - `sale_id` — string (uuid)
  - `recorded_from` — string (date)
  - `recorded_to` — string (date)
  - `page` — integer, min 1
  - `per_page` — integer, min 1, max 100

  **SUCCESS**
  `200 OK`

  `data` is an array of objects with fields: `id`, `inventory_item_id`, `storage_location_id`, `inventory_lot_id`, `lot`, `type`, `reason`, `justification`, `quantity_delta`, `quantity_delta_display`, `measurement`, `recorded_at`, `notes`, `operational_record_id`, `health_record_id`, `health_record_medicine_id`, `purchase_id`, `purchase_item_id`, `sale_id`, `sale_item_id`, `transfer_group_id`, `reverses_movement_id`.

  `meta`: `current_page`, `per_page`, `last_page`, `total`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `inventory.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/inventory/movements?type=stock_in"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: type
    value: stock_in
  - key: inventory_item_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: storage_location_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: inventory_lot_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: operational_record_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: health_record_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: purchase_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: sale_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: recorded_from
    value: ""
    disabled: true
    description: string (date)
  - key: recorded_to
    value: ""
    disabled: true
    description: string (date)
  - key: page
    value: ""
