$kind: http-request
description: |-
  **WHAT IT DOES**
  Stock-out with no `storage_location_id`: the one store holding the item is used. If the item is in several stores the answer is `422` on `storage_location_id` ("Choose which store this comes from."); in none, `409 insufficient_stock`.
  
  `POST {{base_url}}/inventory/stock-out`
url: "{{base_url}}/inventory/stock-out"
method: POST
headers:
  - key: Accept
    value: "application/json"
  - key: Origin
    value: "{{frontend_origin}}"
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
  - key: Content-Type
    value: "application/json"
body:
  type: json
  content: |-
    {
      "inventory_item_id": "{{item_feed_id}}",
      "reason": "donation",
      "components": [
        {
          "quantity": "2",
          "unit": "kg"
        }
      ],
      "recorded_at": "{{recorded_at_30h}}",
      "idempotency_key": "{{stockout_key}}"
    }
examples: ./.resources/Issue stock, store not chosen.resources/examples
order: 9002
