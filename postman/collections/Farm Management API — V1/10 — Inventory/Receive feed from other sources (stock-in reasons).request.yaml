$kind: http-request
description: |-
  **WHAT IT DOES**
  Adds feed to a feed item from a source other than a purchase: aid, gift, produced on the farm, received. A purchase with its cost is `POST /purchases`.

  **WHEN TO USE IT**
  "Feed In" with source Aid / Support, Donation, Produced on farm, Received, Opening balance or Other.

  **IMPORTANT BEHAVIOR**
  - Requires `inventory.manage`. One `stock_in`.
  - Feed is the only kind where `production` (home-made feed) is a manual reason: `by_item_kind.feed.in` says so, the flat list alone does not (GAP-05).

  **WHAT TO DO NEXT**
  Refetch `GET /inventory/items/{id}`.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Unit codes come from `GET /master/units?dimension=...`; do not hard-code them.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.
  - Derived numbers (population, stock, outstanding, totals) are authoritative on the server: refetch the affected resource and the dashboard after saving.


  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie (verified, onboarded, active member of the current farm). State-changing requests need `X-XSRF-TOKEN` and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required permission: **`inventory.manage`**.

  **URL**
  `POST {{base_url}}/inventory/stock-in`

  **REQUEST BODY** (`application/json`)
  - `output` / `inventory_item_id` — exactly one
  - `storage_location_id` — uuid (optional with `output`)
  - `reason` — `aid`, `donation`, `production`, `received`, `opening_balance`, `other`, `purchase`
  - `components[]`, `recorded_at`, `idempotency_key` — **required**
  - `notes` — optional

  **BUSINESS RULES**
  - Reasons come from `GET /master/inventory-options → reasons.by_item_kind.feed.in`.

  **SUCCESS**
  `201 Created` — the movement (see `reason_label`).

  **ERRORS**
  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403 forbidden` — the caller lacks the permission above.
  - `422 validation_failed` — reason not valid for this kind.
url: "{{base_url}}/inventory/stock-in"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "inventory_item_id": "{{item_feed_id}}",
      "storage_location_id": "{{store_id}}",
      "reason": "aid",
      "components": [
        {
          "quantity": "25",
          "unit": "kg"
        }
      ],
      "recorded_at": "{{recorded_at}}",
      "idempotency_key": "{{$guid}}",
      "notes": "Aid programme delivery"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("movement_feed_aid_id", String(v)); else console.warn("Could not capture movement_feed_aid_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/Receive feed from other sources (stock-in reasons).resources/examples
order: 19000
