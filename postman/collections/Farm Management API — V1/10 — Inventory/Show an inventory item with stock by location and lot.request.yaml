$kind: http-request
description: |-
  **WHAT IT DOES**
  One item with its total stock and the breakdown by storage location and lot. Totals are exact decimal strings (e.g. `"318"`), never floats.

  **WHEN TO USE IT**
  An item detail screen with stock by store and lot.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{item_feed_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `inventory.view` (taken from the current farm context; never sent by the client).

  **ITEM KIND (GAP-03)**
  Every item carries `kind` (`feed` | `eggs` | `milk` | `general`) and `is_system_managed` (`true` for the farm's automatic Eggs / Milk output items). Use `kind` to pick `GET /master/inventory-options → reasons.by_item_kind[kind]`; never infer it from the name or category.

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`inventory.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/inventory/items/{{item_feed_id}}`

  **PATH PARAMETERS**
  - `{{item_feed_id}}` — UUID. Captured by "Create an inventory item (feed)" (10 — Inventory) or from the list endpoint of this resource.

  **VARIABLES USED**
  - `{{item_feed_id}}` — captured by "Create an inventory item (feed)"

  **SUCCESS**
  `200 OK`

  `data` fields: `id`, `name`, `category`, `description`, `stock_unit`, `dimension`, `tracks_lots`, `tracks_expiry`, `is_active`, `stock`, `low_stock_threshold`, `is_low_stock`, `created_at`, `updated_at`, `balances`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `inventory.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
url: "{{base_url}}/inventory/items/{{item_feed_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        pm.test("items expose kind and is_system_managed", function () { const rows = Array.isArray(json.data) ? json.data : [json.data]; rows.forEach(function (i) { pm.expect(["feed", "eggs", "milk", "general"]).to.include(i.kind); pm.expect(i.is_system_managed).to.be.a("boolean"); }); });
      }
    language: text/javascript
examples: ./.resources/Show an inventory item with stock by location and lot.resources/examples
order: 8000
