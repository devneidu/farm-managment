$kind: http-request
description: |-
  **WHAT IT DOES**
  Adds stock for something not yet in the item list, in one step: `new_item {name, category, unit}` instead of `inventory_item_id`. An ACTIVE item with the same name and category is reused (`item_reused: true`); otherwise the item is created and the stock recorded in one transaction.
  
  **IMPORTANT INPUTS**
  - Exactly one of `inventory_item_id`, `new_item`, `output`.
  - `storage_location_id` is optional: omitted, the farm's main store is used (created as "Main Store" on first use).
  - Requires `inventory.manage`. Idempotent by `idempotency_key`.
  
  **ERRORS**
  `409 inventory_item_exists` (same name, other category or inactive item), `422 new_item.*`, `409 idempotency_conflict`.
  
  `POST {{base_url}}/inventory/stock-in`
url: "{{base_url}}/inventory/stock-in"
method: POST
headers:
  - key: Accept
    value: "application/json"
  - key: Origin
    value: "{{frontend_origin}}"
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
  - key: Content-Type
    value: "application/json"
body:
  type: json
  content: |-
    {
      "new_item": {
        "name": "Starter feed",
        "category": "feed",
        "unit": "kg"
      },
      "reason": "opening_balance",
      "components": [
        {
          "quantity": "40",
          "unit": "kg"
        }
      ],
      "recorded_at": "{{recorded_at_30h}}",
      "idempotency_key": "{{stockin_key}}"
    }
examples: ./.resources/Add stock, new item.resources/examples
order: 9001
