$kind: http-request
description: |-
  **WHAT IT DOES**
  Platform view of record types farms made (`source=farm`, default) or the public ones (`source=public`): fields, the making farm, `records_count`, `farms_using`, `copies_count`, `public_copy_id`. Counts only - never a farm's records.

  **IMPORTANT BEHAVIOR**
  - Any platform role reads. Filters `status`, `applies_to`, `q`, `page`, `per_page`.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** - Sanctum session of a platform admin.

  **URL**
  `GET {{base_url}}/platform-admin/custom-record-types`
url: "{{base_url}}\/platform-admin\/custom-record-types"
method: GET
headers:
  - key: Accept
    value: "application\/json"
  - key: Origin
    value: "{{frontend_origin}}"
    description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
queryParams:
  - key: source
    value: ""
    disabled: true
    description: "enum: farm | public (default farm)"
  - key: q
    value: ""
    disabled: true
    description: "name"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Custom types admin.resources/examples
order: 42000
