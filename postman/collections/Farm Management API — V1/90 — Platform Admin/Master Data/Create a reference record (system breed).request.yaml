$kind: http-request
description: |-
  **WHAT IT DOES**
  Creates a SYSTEM reference record of the given kind (here a breed visible to every farm). Required fields depend on the kind: `name` always; `code` (lowercase snake case) for kinds that have one; the parent id (`operation_type_id`, `species_id`, `crop_type_id`) for children; `category` for operation types.

  **WHEN TO USE IT**
  "New reference record".

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `admin` (taken from the current farm context; never sent by the client).
  - Audit entry. Farms see the new item in their selectors immediately.
  - Requires the platform `admin` role (a `support` role is read-only: `403 platform_write_forbidden`). Writes are rate limited (60/min).
  - Codes are stable and unique within their scope; they can never be changed later.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — signed-in, email-verified user holding a **platform role**. This is NOT a farm role. State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Platform role **`admin`** only (`support` is read-only: `403 platform_write_forbidden`; no grant: `403 platform_admin_required`).
  Farm roles (Owner, Manager, ...) confer nothing here.
  Rate limited by limiter `platform-admin-write`: 60 per minute per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/platform-admin/master/breeds`

  **REQUEST BODY** (`application/json`)
  See the example body; fields depend on the kind in the URL (see the Platform Admin master-data notes).

  **VARIABLES USED**
  - `{{species_chicken_id}}` — captured by "List species"

  **BUSINESS RULES**
  - Requires the platform `admin` role (a `support` role is read-only: `403 platform_write_forbidden`). Writes are rate limited (60/min).
  - Codes are stable and unique within their scope; they can never be changed later.

  **SUCCESS**
  `201 Created`

  `data` fields: `id`, `code`, `name`, `species`, `is_active`, `created_at`, `updated_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403 platform_admin_required` — no platform grant; `403 platform_write_forbidden` — read-only (`support`) role on a write endpoint; `account_suspended`, `email_verification_required`.
  - `404 not_found` — unknown id.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/platform-admin/master/breeds"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "species_id": "{{species_chicken_id}}",
      "name": "Kuroiler",
      "code": "kuroiler"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("master_breed_id", String(v)); else console.warn("Could not capture master_breed_id from data.id"); }
      }
    language: text/javascript
examples: ./.resources/Create a reference record (system breed).resources/examples
order: 5000
