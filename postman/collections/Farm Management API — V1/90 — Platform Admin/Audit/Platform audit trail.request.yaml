$kind: http-request
description: |-
  **WHAT IT DOES**
  Audit trail of platform-level actions (plan changes, suspensions, master-data and template edits, settings). Filters: `from`, `to`, `actor_id`, `action`, `resource_type`, `resource_id`, `request_id`, `page`, `per_page`.

  **WHEN TO USE IT**
  Platform audit screen.

  **IMPORTANT INPUTS**
  - Query filters: `from`, `to`, `actor_id`, `action`, `resource_type`, `resource_id`, `request_id`, `page`, ....

  **IMPORTANT BEHAVIOR**
  - Platform Admin read: needs a platform role (`admin` or `support`), not a farm role.
  - Any platform role (`admin` or `support`) may read.
  - Separate from the farm audit (`GET /audit`).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — signed-in, email-verified user holding a **platform role**. This is NOT a farm role.

  **ACCESS**
  Platform role **`admin` or `support`** (no grant: `403 platform_admin_required`).
  Farm roles (Owner, Manager, ...) confer nothing here.

  **URL**
  `GET {{base_url}}/platform-admin/audit-logs`

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `from` — string (date). Inclusive UTC days.
  - `to` — string (date)
  - `actor_id` — string (uuid)
  - `action` — string, max 60 chars. Exact action code, for example `platform.plan_updated`.
  - `resource_type` — string, max 40 chars
  - `resource_id` — string (uuid)
  - `request_id` — string, max 100 chars
  - `page` — integer, min 1
  - `per_page` — integer, min 1, max 100

  **BUSINESS RULES**
  - Any platform role (`admin` or `support`) may read.
  - Separate from the farm audit (`GET /audit`).

  **SUCCESS**
  `200 OK`

  `data` is an array of objects with fields: `id`, `action`, `resource`, `actor`, `changes`, `request_id`, `ip_address`, `performed_at`.

  `meta`: `current_page`, `per_page`, `last_page`, `total`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403 platform_admin_required` — no platform grant; `403 platform_write_forbidden` — read-only (`support`) role on a write endpoint; `account_suspended`, `email_verification_required`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/platform-admin/audit-logs?from={{date_7d_ago}}&to={{today}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
queryParams:
  - key: from
    value: "{{date_7d_ago}}"
  - key: to
    value: "{{today}}"
  - key: actor_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: action
    value: ""
    disabled: true
    description: Exact action code, for example `platform.plan_updated`. — string — max 60 chars
  - key: resource_type
    value: ""
    disabled: true
    description: string — max 40 chars
  - key: resource_id
    value: ""
    disabled: true
    description: string (uuid)
  - key: request_id
    value: ""
    disabled: true
    description: string — max 100 chars
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Platform audit trail.resources/examples
order: 1000
