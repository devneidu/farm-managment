$kind: http-request
description: Streams a stored seller photo for review, whatever the listing's state.
url: "{{base_url}}/platform-admin/marketplace/listings/{{listing_id}}/images/{{listing_image_id}}/file"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
    language: text/javascript
order: 5000
