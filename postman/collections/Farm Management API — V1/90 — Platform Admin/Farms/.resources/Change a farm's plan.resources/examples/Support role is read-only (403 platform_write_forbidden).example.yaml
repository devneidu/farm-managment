$kind: http-example
request:
  url: "{{base_url}}/platform-admin/farms/{{farm_id}}/subscription/plan"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "plan_id": "{{plan_business_id}}",
        "interval": "monthly",
        "reason": "Upgraded for the API handoff demo"
      }
response:
  statusCode: 403
  statusText: Forbidden
