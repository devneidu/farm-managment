$kind: http-request
description: |-
  **WHAT IT DOES**
  Replaces the plan's prices. `amount_minor` is an integer in kobo (150000 = ₦1,500.00). Intervals: `monthly`, `annual`, each at most once.

  **WHEN TO USE IT**
  Setting plan prices.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{plan_new_id}}`.
  - Required body fields: `prices`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `admin` (taken from the current farm context; never sent by the client).
  - Audit entry.
  - Requires the platform `admin` role (a `support` role is read-only: `403 platform_write_forbidden`). Writes are rate limited (60/min).
  - At most 2 prices; `amount_minor` >= 1.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — signed-in, email-verified user holding a **platform role**. This is NOT a farm role. State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Platform role **`admin`** only (`support` is read-only: `403 platform_write_forbidden`; no grant: `403 platform_admin_required`).
  Farm roles (Owner, Manager, ...) confer nothing here.
  Rate limited by limiter `platform-admin-write`: 60 per minute per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `PUT {{base_url}}/platform-admin/plans/{{plan_new_id}}/prices`

  **PATH PARAMETERS**
  - `{{plan_new_id}}` — UUID. Captured by "Create a plan" (90 — Platform Admin) or from the list endpoint of this resource.

  **REQUEST BODY** (`application/json`)
  - `prices` — array, **required**, min 1 items, max 2 items
  - `prices[].interval` — enum, **required**. Values: `monthly`, `annual`
  - `prices[].amount_minor` — integer, **required**, min 1, max 100000000000. Integer kobo.
  - `prices[].is_active` — boolean, optional

  **VARIABLES USED**
  - `{{plan_new_id}}` — captured by "Create a plan"

  **BUSINESS RULES**
  - Requires the platform `admin` role (a `support` role is read-only: `403 platform_write_forbidden`). Writes are rate limited (60/min).
  - At most 2 prices; `amount_minor` >= 1.

  **SUCCESS**
  `200 OK`

  `data` fields: `id`, `slug`, `name`, `description`, `currency`, `is_active`, `is_public`, `is_default`, `sort_order`, `subscribers_count`, `prices`, `features`, `limits`, `created_at`, `updated_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403 platform_admin_required` — no platform grant; `403 platform_write_forbidden` — read-only (`support`) role on a write endpoint; `account_suspended`, `email_verification_required`.
  - `404 not_found` — unknown id.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/platform-admin/plans/{{plan_new_id}}/prices"
method: PUT
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "prices": [
        {
          "interval": "monthly",
          "amount_minor": 150000
        },
        {
          "interval": "annual",
          "amount_minor": 1500000
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Set plan prices.resources/examples
order: 5000
