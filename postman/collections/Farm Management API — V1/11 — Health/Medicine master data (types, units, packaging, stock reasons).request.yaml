$kind: http-request
description: |-
  **WHAT IT DOES**
  Returns what the medicine form needs: `medicine_types`, `primary_units`, `package_units`, `withdrawal_days` limits and `reasons.in` / `reasons.out` for medicine stock.

  **IMPORTANT BEHAVIOR**
  - Requires `health.view`.
  - In `reasons.out`, `use` has `manual: false` and points to `POST /health-records`: medicine given to animals is recorded once, by a health record. `POST /inventory/stock-out` rejects `use` and `internal_use` for medicines (`422`). Manual reductions stay available: `donation`, `damaged`, `expired`, `spoiled`, `lost`, `disposal`, `other`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks the required permission(s); other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `opening_stock.lot.code`); `conversion_not_configured` / `invalid_conversion_ratio` for packaging problems.
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/master/medicine-options"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Medicine master data (types, units, packaging, stock reasons).resources/examples
order: 2000
