$kind: http-example
request:
  url: "{{base_url}}/health-records"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "production_cycle_id": "{{cycle_id}}",
        "type": "disease_issue",
        "recorded_at": "{{recorded_at_2h}}",
        "idempotency_key": "{{$guid}}",
        "details": {
          "problem_type": "other",
          "condition": "Fowl pox",
          "severity": "moderate",
          "symptoms": "Sneezing and watery eyes in Pen 1"
        },
        "animals_affected": 12
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "01a1045e-743c-70bd-8351-11409ea6268e",
          "production_cycle_id": "01a1045e-4eb5-7020-85dc-ac87e0bd8aef",
          "type": "disease_issue",
          "details": {
            "problem_type": "other",
