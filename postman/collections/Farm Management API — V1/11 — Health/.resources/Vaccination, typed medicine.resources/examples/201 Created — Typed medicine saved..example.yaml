$kind: http-example
name: 201 Created — Typed medicine saved.
request:
  url: "{{base_url}}/health-records"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "production_cycle_id": "{{cycle_id}}",
        "type": "vaccination",
        "recorded_at": "{{recorded_at_2h}}",
        "idempotency_key": "{{$guid}}",
        "details": {
          "problem_type": "routine_prevention",
          "target_disease": "Newcastle disease"
        },
        "animals_affected": 400,
        "follow_up_on": "{{date_in_14d}}",
        "notes": "Whole flock, Pen 1",
        "medicines": [
          {
            "medicine_name": "Local herbal mix",
            "dose_per_animal": [
              {
                "quantity": "0.5",
                "unit": "ml"
              }
            ],
            "dosage_instructions": "In drinking water",
            "withdrawal_days": 7
          }
        ]
      }
response:
  statusCode: 201
  statusText: Created
