$kind: http-request
description: |-
  **NEGATIVE: purpose is mandatory.** `production_purpose` is required on every new livestock batch; there is no default or inferred value. Omitting it (or sending `null`) is `422` with `errors.production_purpose`: "The production purpose field is required when kind is livestock." Existing batches created before this change keep a null purpose; only NEW batches must send one.

  Negative example (nothing is created, no initial population movement). 422 body: `message`, `code: "validation_failed"`, `request_id`, `errors` keyed by field. See docs/api/LIVESTOCK-BATCH-CREATION.md.
url: "{{base_url}}/production-cycles"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "kind": "livestock",
      "name": "Missing Purpose {{$timestamp}}",
      "operation_type_id": "{{op_poultry_id}}",
      "species_id": "{{species_chicken_id}}",
      "breed_id": "{{breed_chicken_system_id}}",
      "growth_stage": "chick",
      "initial_population": 500,
      "start_date": "{{date_30d_ago}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 422", function () { pm.expect(pm.response.code).to.eql(422); });
      const json = pm.response.json();
      pm.test("Standard validation envelope", function () { pm.expect(json.code).to.eql("validation_failed"); pm.expect(json).to.have.property("request_id"); });
      pm.test("Error is keyed by production_purpose", function () { pm.expect(json.errors).to.have.property("production_purpose"); pm.expect(Object.keys(json.errors)).to.eql(["production_purpose"]); });
      pm.test("No batch was created", function () { pm.expect(json).to.not.have.property("data"); });
    language: text/javascript
examples: ./.resources/Start a livestock batch — missing production_purpose (422).resources/examples
order: 4000
