$kind: http-request
description: |-
  **WHAT IT DOES**
  Paginated lifecycle events of the cycle (created, edited, closed, reopened) - not operational records. Use `GET /records` for what happened on the farm.

  **WHEN TO USE IT**
  The lifecycle history tab of a cycle.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{cycle_id}}`.
  - Query filters: `page`, `per_page`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `production_cycle.view` (taken from the current farm context; never sent by the client).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`production_cycle.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/production-cycles/{{cycle_id}}/activity`

  **PATH PARAMETERS**
  - `{{cycle_id}}` — UUID. Captured by "Start a livestock batch" (08 — Production Cycles) or from the list endpoint of this resource.

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `page` — integer, min 1
  - `per_page` — integer, min 1, max 100

  **VARIABLES USED**
  - `{{cycle_id}}` — captured by "Start a livestock batch"

  **SUCCESS**
  `200 OK`

  `data` is an array of objects with fields: `id`, `action`, `actor_id`, `changes`, `reason`, `recorded_at`, `created_at`.

  `meta`: `current_page`, `per_page`, `last_page`, `total`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `production_cycle.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/production-cycles/{{cycle_id}}/activity"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: page
    value: ""
    disabled: true
    description: integer — min 1
  - key: per_page
    value: ""
    disabled: true
    description: integer — min 1, max 100
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Cycle lifecycle activity.resources/examples
order: 13000
