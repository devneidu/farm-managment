$kind: http-request
description: |-
  **WHAT IT DOES**
  The same cycle resource shaped as the baseline production summary (Phase 7 baseline). For derived figures use the reports and the crop project endpoint.

  **WHEN TO USE IT**
  The baseline production summary card of a cycle.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{cycle_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `production_cycle.view` (taken from the current farm context; never sent by the client).

  **RECORD TYPES THIS CYCLE ACCEPTS (GAP-02)**
  Detail reads only: `data.available_record_types[]` = `{type, permissions_required}` for every record type `POST /records` accepts for this cycle right now (same cycle-kind and species-capability rules as record creation; `[]` for a closed cycle). It is not filtered by the member's permissions: keep a type when the member holds all of `permissions_required.always` (plus `when_inventory_linked` if the form links stock). Lists and write responses do not carry the field; refetch the detail after close/reopen.

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`production_cycle.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/production-cycles/{{cycle_id}}/summary`

  **PATH PARAMETERS**
  - `{{cycle_id}}` — UUID. Captured by "Start a livestock batch" (08 — Production Cycles) or from the list endpoint of this resource.

  **VARIABLES USED**
  - `{{cycle_id}}` — captured by "Start a livestock batch"

  **SUCCESS**
  `200 OK`

  `data` fields: `id`, `kind`, `name`, `reference`, `status`, `operation`, `production_area`, `start_date`, `planting_date`, `expected_end_date`, `end_date`, `notes`, `baseline_locked`, `livestock`, `crop`, `created_at`, `updated_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `production_cycle.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
url: "{{base_url}}/production-cycles/{{cycle_id}}/summary"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        pm.test("available_record_types lists the types this cycle accepts", function () { pm.expect(json.data.available_record_types).to.be.an("array"); json.data.available_record_types.forEach(function (t) { pm.expect(t).to.have.property("type"); pm.expect(t.permissions_required.always).to.be.an("array"); }); });
      }
    language: text/javascript
examples: ./.resources/Production summary.resources/examples
order: 12000
