$kind: http-request
description: |-
  **WHAT IT DOES**
  Ends an active cycle. A closed cycle accepts no new records, tasks, sales lines or breeding work and keeps all history readable.

  **WHEN TO USE IT**
  "Close batch/project" when production ends.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{cycle_pilot_id}}` — a throw-away Chicken batch the request starts itself (pre-request script; needs Flow S).
  - Required body fields: `end_date`, `reason`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `production_cycle.close` (taken from the current farm context; never sent by the client).
  - Sets status/end date and writes a lifecycle event. Does not create sale, finance or record entries.
  - `end_date` and `reason` are required. `409 invalid_status_transition` if already closed; `409 cycle_reconciliation_failed` if the derived population disagrees with the movement ledger.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`production_cycle.close`** — granted to: `owner`, `manager`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `production-cycle-write`: 60 per hour per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/production-cycles/{{cycle_pilot_id}}/close`

  **PATH PARAMETERS**
  - `{{cycle_pilot_id}}` — UUID. Started and captured by the pre-request script of "Close a production cycle" (a disposable Chicken batch named `Pilot flock <timestamp>`, so {{cycle_id}} is never closed). "Reopen a production cycle" reuses it, so run Close first.

  **REQUEST BODY** (`application/json`)
  - `end_date` — string (date), **required**
  - `reason` — string, **required**, max 2000 chars

  **VARIABLES USED**
  - `{{cycle_pilot_id}}` — started by the pre-request script of "Close a production cycle"

  **BUSINESS RULES**
  - `end_date` and `reason` are required. `409 invalid_status_transition` if already closed; `409 cycle_reconciliation_failed` if the derived population disagrees with the movement ledger.
  - Requires `production_cycle.close` (Owner, Manager).

  **SUCCESS**
  `200 OK` — message: "Production cycle closed."

  `data` fields: `id`, `kind`, `name`, `reference`, `status`, `operation`, `production_area`, `start_date`, `planting_date`, `expected_end_date`, `end_date`, `notes`, `baseline_locked`, `livestock`, `crop`, `created_at`, `updated_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `production_cycle.close`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `409` — `invalid_status_transition`, `cycle_reconciliation_failed`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/production-cycles/{{cycle_pilot_id}}/close"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "end_date": "{{today}}",
      "reason": "Batch sold out and house cleaned"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Close/Reopen need a batch that nothing else depends on, so they never touch {{cycle_id}} (Flow 3 and folders 09-17 keep using it).
      // A fresh disposable batch is started on every run (unique name), so a rerun never hits "already closed". Captures {{cycle_pilot_id}}.
      const bodyJson = { kind: "livestock", name: "Pilot flock " + Date.now(), operation_type_id: pm.environment.get("op_poultry_id"), species_id: pm.environment.get("species_chicken_id"), production_purpose: "meat", growth_stage: "chick", initial_population: 50, start_date: pm.variables.replaceIn("{{date_30d_ago}}"), production_area_id: pm.environment.get("area_id") };
      if (pm.environment.get("breed_id")) { bodyJson.breed_id = pm.environment.get("breed_id"); }
      pm.environment.unset("cycle_pilot_id");
      pm.sendRequest({ url: pm.variables.replaceIn("{{base_url}}/production-cycles"), method: "POST", header: { "Accept": "application/json", "Content-Type": "application/json", "Origin": pm.variables.replaceIn("{{frontend_origin}}"), "X-XSRF-TOKEN": pm.environment.get("xsrf_token") || "" }, body: { mode: "raw", raw: JSON.stringify(bodyJson) } }, function (err, res) {
        if (!err && res.code === 201) { pm.environment.set("cycle_pilot_id", res.json().data.id); } else { console.warn("Could not start the pilot batch (needs Flow S: op_poultry_id, species_chicken_id, area_id): " + (err || res.code)); }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        pm.test("The pilot batch (not {{cycle_id}}) is closed", function () { pm.expect(json.data.id).to.eql(pm.environment.get("cycle_pilot_id")); pm.expect(json.data.id).to.not.eql(pm.environment.get("cycle_id")); pm.expect(json.data.status).to.eql("closed"); pm.expect(json.data.end_date).to.be.a("string"); });
      }
    language: text/javascript
examples: ./.resources/Close a production cycle.resources/examples
order: 14000
