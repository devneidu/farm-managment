$kind: http-example
request:
  url: "{{base_url}}/production-cycles"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "kind": "livestock",
        "name": "Wrong Purpose {{$timestamp}}",
        "operation_type_id": "{{op_poultry_id}}",
        "species_id": "{{species_chicken_id}}",
        "production_purpose": "dairy",
        "growth_stage": "chick",
        "initial_population": 500,
        "start_date": "{{date_30d_ago}}"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Choose an active code from the selected reference catalogue.",
        "code": "validation_failed",
        "request_id": "01a12033-fee9-71ef-86a6-7cb521dca047",
        "errors": {
          "production_purpose": [
            "Choose an active code from the selected reference catalogue."
          ]
        }
      }
order: 1000
