$kind: http-example
request:
  url: "{{base_url}}/production-cycles"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "kind": "livestock",
        "name": "Wrong Breed {{$timestamp}}",
        "operation_type_id": "{{op_fishery_id}}",
        "species_id": "{{species_fish_id}}",
        "breed_id": "{{breed_cattle_id}}",
        "production_purpose": "table_fish",
        "growth_stage": "fingerling",
        "initial_population": 2000,
        "start_date": "{{date_30d_ago}}"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Breed does not belong to this species.",
        "code": "validation_failed",
        "request_id": "01a12034-0015-7019-b564-48e7b68c141d",
        "errors": {
          "breed_id": [
            "Breed does not belong to this species."
          ]
        }
      }
order: 1000
