$kind: http-example
name: Validation failure (422) — missing production_purpose and initial_population
request:
  url: "{{base_url}}/production-cycles"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "kind": "livestock",
        "name": "No population",
        "operation_type_id": "{{op_poultry_id}}",
        "species_id": "{{species_chicken_id}}",
        "start_date": "{{date_30d_ago}}"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The production purpose field is required when kind is livestock. (and 1 more error)",
        "code": "validation_failed",
        "request_id": "01a12034-04bd-70a5-a7d7-bdfa293a7109",
        "errors": {
          "production_purpose": [
            "The production purpose field is required when kind is livestock."
          ],
          "initial_population": [
            "The initial population field is required when kind is livestock."
          ]
        }
      }
order: 3000
