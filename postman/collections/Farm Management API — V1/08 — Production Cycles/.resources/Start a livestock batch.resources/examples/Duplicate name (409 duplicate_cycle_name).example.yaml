$kind: http-example
request:
  url: "{{base_url}}/production-cycles"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "kind": "livestock",
        "name": "October Broilers",
        "operation_type_id": "{{op_poultry_id}}",
        "species_id": "{{species_chicken_id}}",
        "breed_id": "{{breed_id}}",
        "initial_population": 500,
        "start_date": "{{date_30d_ago}}",
        "production_area_id": "{{area_id}}",
        "expected_end_date": "{{date_in_30d}}",
        "notes": "First flock of the season",
        "production_purpose": "meat",
        "growth_stage": "chick",
        "acquisition_price_per_animal": null,
        "supplier_contact_id": null
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "This farm already has a cycle of this kind with that name, including closed cycles.",
        "code": "duplicate_cycle_name",
        "request_id": "01a12034-040e-72f3-b9d3-d0a432e4ed29"
      }
order: 2000
