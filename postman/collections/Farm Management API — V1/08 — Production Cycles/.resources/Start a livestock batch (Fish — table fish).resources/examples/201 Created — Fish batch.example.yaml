$kind: http-example
request:
  url: "{{base_url}}/production-cycles"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "kind": "livestock",
        "name": "Catfish Pond {{$timestamp}}",
        "operation_type_id": "{{op_fishery_id}}",
        "species_id": "{{species_fish_id}}",
        "breed_id": "{{breed_fish_id}}",
        "production_purpose": "table_fish",
        "growth_stage": "fingerling",
        "acquisition_price_per_animal": "35.00",
        "supplier_contact_id": null,
        "initial_population": 2000,
        "start_date": "{{date_30d_ago}}"
      }
