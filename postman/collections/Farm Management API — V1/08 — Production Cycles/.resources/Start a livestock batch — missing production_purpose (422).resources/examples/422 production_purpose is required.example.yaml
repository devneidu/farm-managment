$kind: http-example
request:
  url: "{{base_url}}/production-cycles"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "kind": "livestock",
        "name": "Missing Purpose {{$timestamp}}",
        "operation_type_id": "{{op_poultry_id}}",
        "species_id": "{{species_chicken_id}}",
        "breed_id": "{{breed_chicken_system_id}}",
        "growth_stage": "chick",
        "initial_population": 500,
        "start_date": "{{date_30d_ago}}"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The production purpose field is required when kind is livestock.",
        "code": "validation_failed",
        "request_id": "01a12033-fe52-71f4-9af3-a74fb3bf01a3",
        "errors": {
          "production_purpose": [
            "The production purpose field is required when kind is livestock."
          ]
        }
      }
order: 1000
