$kind: http-request
description: |-
  **WHAT IT DOES**
  Edits descriptive fields of an ACTIVE cycle: `name`, `notes`, `production_area_id`, `expected_end_date`, `expected_germination_date`, `area`.

  **WHEN TO USE IT**
  Editing notes, area or expected dates of an active cycle.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{cycle_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `production_cycle.update` (taken from the current farm context; never sent by the client).
  - Writes a lifecycle event (see activity).
  - Baseline facts (kind, species, initial population, start date, planting units) cannot be changed once locked: `409 baseline_locked`. A closed cycle is `409 cycle_closed`. The livestock metadata set at creation (`production_purpose`, `growth_stage`, `acquisition_price_per_animal`, `supplier_contact_id`) is part of the baseline: sending any of them, even as null, is `409 baseline_locked`.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`production_cycle.update`** — granted to: `owner`, `manager`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `production-cycle-write`: 60 per hour per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `PATCH {{base_url}}/production-cycles/{{cycle_id}}`

  **PATH PARAMETERS**
  - `{{cycle_id}}` — UUID. Captured by "Start a livestock batch" (08 — Production Cycles) or from the list endpoint of this resource.

  **REQUEST BODY** (`application/json`)
  - `name` — string, optional, max 100 chars
  - `notes` — string, optional, max 5000 chars, nullable
  - `production_area_id` — string (uuid), optional, nullable
  - `expected_end_date` — string (date), optional, nullable
  - `expected_germination_date` — string (date), optional, nullable
  - `area` — object, optional, nullable
  - `area.quantity` — string|number, **required**
  - `area.unit` — string, **required**, max 32 chars

  **VARIABLES USED**
  - `{{cycle_id}}` — captured by "Start a livestock batch"

  **BUSINESS RULES**
  - Baseline facts (kind, species, initial population, start date, planting units) cannot be changed once locked: `409 baseline_locked`. A closed cycle is `409 cycle_closed`.
  - Requires `production_cycle.update` (Owner, Manager).

  **SUCCESS**
  `200 OK` — message: "Production cycle updated."

  `data` fields: `id`, `kind`, `name`, `reference`, `status`, `operation`, `production_area`, `start_date`, `planting_date`, `expected_end_date`, `end_date`, `notes`, `baseline_locked`, `livestock`, `crop`, `created_at`, `updated_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `production_cycle.update`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `409` — `baseline_locked`, `cycle_closed`, `duplicate_cycle_name`, `location_inactive`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/production-cycles/{{cycle_id}}"
method: PATCH
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "notes": "Moved to Pen 1 after brooding",
      "expected_end_date": "{{date_in_60d}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Edit an active cycle.resources/examples
order: 11000
