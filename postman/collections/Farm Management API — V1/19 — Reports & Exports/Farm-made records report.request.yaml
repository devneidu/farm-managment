$kind: http-request
description: |-
  **WHAT IT DOES**
  Records of farm-made record types per type, batch and number field: record count and the exact sum of each `number` / `whole_number` field. Reversed records are excluded.

  **IMPORTANT INPUTS**
  - `from`, `to` (farm-local days), `production_cycle_id`, `custom_record_type_id` (another farm's type is `422`).

  **IMPORTANT BEHAVIOR**
  - Needs `report.view`, `record.view` and `production_cycle.view`. CSV / Excel / PDF through "Request a report export" with `report: custom_records`.
  - `records` repeats on each field row; `summary.records` counts every record once.

  ---
  **REFERENCE (detail)**


  **AUTHENTICATION**
  **Required** — Sanctum session cookie.

  **URL**
  `GET {{base_url}}/reports/custom_records`
url: "{{base_url}}\/reports\/custom_records?from={{date_30d_ago}}&to={{today}}"
method: GET
headers:
  - key: Accept
    value: "application\/json"
  - key: Origin
    value: "{{frontend_origin}}"
    description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
  - key: X-Farm-Id
    value: "{{farm_id}}"
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
    disabled: true
queryParams:
  - key: from
    value: "{{date_30d_ago}}"
    description: "string (date)"
  - key: to
    value: "{{today}}"
    description: "string (date)"
  - key: production_cycle_id
    value: ""
    disabled: true
    description: "string (uuid)"
  - key: custom_record_type_id
    value: ""
    disabled: true
    description: "string (uuid)"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Farm-made records report.resources/examples
order: 41000
