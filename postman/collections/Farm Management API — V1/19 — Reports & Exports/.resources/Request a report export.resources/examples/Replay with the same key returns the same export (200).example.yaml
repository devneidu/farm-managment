$kind: http-example
request:
  url: "{{base_url}}/reports/exports"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "report": "income_expense",
        "format": "csv",
        "filters": {
          "from": "{{month_start}}",
          "to": "{{today}}"
        },
        "idempotency_key": "{{export_key}}"
      }
