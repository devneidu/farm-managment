$kind: http-example
request:
  url: "{{base_url}}/reports/income_expense?from={{month_start}}&to={{today}}"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  queryParams:
    - key: from
      value: "{{month_start}}"
    - key: to
      value: "{{today}}"
    - key: as_of
      value: ""
      disabled: true
      description: string (date)
    - key: production_cycle_id
      value: ""
      disabled: true
      description: string (uuid)
    - key: kind
      value: ""
      disabled: true
      description: "enum: livestock | crop"
    - key: status
      value: ""
      disabled: true
      description: "enum: active | closed | completed | cancelled"
    - key: per_page
      value: ""
      disabled: true
      description: integer — min 1, max 500
    - key: page
      value: ""
      disabled: true
      description: integer — min 1
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "You are not allowed to perform this action.",
        "code": "forbidden",
        "request_id": "01a1045e-afe6-70cb-929d-80eab5cae88c"
      }
order: 3000
