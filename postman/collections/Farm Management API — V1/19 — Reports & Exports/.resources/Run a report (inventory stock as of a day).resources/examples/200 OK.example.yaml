$kind: http-example
request:
  url: "{{base_url}}/reports/inventory_stock?as_of={{today}}"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  queryParams:
    - key: as_of
      value: "{{today}}"
    - key: from
      value: ""
      disabled: true
      description: string (date)
    - key: to
      value: ""
      disabled: true
      description: string (date)
    - key: production_cycle_id
      value: ""
      disabled: true
      description: string (uuid)
    - key: kind
      value: ""
      disabled: true
      description: "enum: livestock | crop"
    - key: status
      value: ""
      disabled: true
      description: "enum: active | closed | completed | cancelled"
    - key: per_page
      value: ""
      disabled: true
      description: integer — min 1, max 500
    - key: page
      value: ""
      disabled: true
      description: integer — min 1
