$kind: http-request
description: |-
  **WHAT IT DOES**
  Signed totals (reversals offset entries): `totals {income, expense, net}`, `by_category` and `by_cycle` (`production_cycle_id: null` = unallocated overhead). With `production_cycle_id` the response is that cycle's profitability.

  **WHEN TO USE IT**
  The finance overview and cycle profitability screens.

  **IMPORTANT INPUTS**
  - Query filters: `from`, `to`, `production_cycle_id`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `finance.view` (taken from the current farm context; never sent by the client).
  - All amounts are two-decimal strings. Cash basis: income appears when a PAYMENT is received.

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`finance.view`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/finance/summary`

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `from` — string (date). Inclusive farm-local days on occurred_on.
  - `to` — string (date)
  - `production_cycle_id` — string (uuid). Cycle profitability: only money allocated to this cycle.

  **BUSINESS RULES**
  - All amounts are two-decimal strings. Cash basis: income appears when a PAYMENT is received.

  **SUCCESS**
  `200 OK`

  `data` fields: `currency`, `from`, `to`, `production_cycle_id`, `totals`, `by_category`, `by_cycle`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `finance.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/finance/summary?from={{month_start}}&to={{today}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: from
    value: "{{month_start}}"
  - key: to
    value: "{{today}}"
  - key: production_cycle_id
    value: ""
    disabled: true
    description: "Cycle profitability: only money allocated to this cycle. — string (uuid)"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Finance summary and cycle profitability.resources/examples
order: 10000
