$kind: http-example
name: 200 — Farm Worker, expense form (no options)
request:
  url: "{{base_url}}/finance/form-options?direction=expense"
  method: GET
  headers:
    - key: Accept
      value: "application/json"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
          "data": {
              "direction": "expense",
              "options": [],
              "payment_methods": [
                  "cash",
                  "bank_transfer",
                  "pos",
                  "mobile_money",
                  "cheque",
                  "other"
              ],
              "settings": {
                  "use_stock_for_usage": false
              },
              "can_add_stock": true
          },
          "meta": [],
          "message": null
      }
