$kind: http-example
request:
  url: "{{base_url}}/expenses"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "finance_category_id": "{{cat_labour_id}}",
        "amount": "15000.555",
        "occurred_on": "{{today}}",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The amount must be an amount with at most two decimal places.",
        "code": "validation_failed",
        "request_id": "01a1045e-92ba-7316-86cf-8560a88c1584",
        "errors": {
          "amount": [
            "The amount must be an amount with at most two decimal places."
          ]
        }
      }
order: 2000
