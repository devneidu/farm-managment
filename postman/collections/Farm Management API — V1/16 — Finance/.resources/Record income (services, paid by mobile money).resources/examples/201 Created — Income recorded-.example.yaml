$kind: http-example
name: 201 Created — Income recorded.
request:
  url: "{{base_url}}/income"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "finance_category_id": "{{cat_services_id}}",
        "amount": "25000.00",
        "payment_method": "mobile_money",
        "description": "Hatching service for a neighbour",
        "occurred_on": "{{today}}",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "01a164f1-ab6b-7218-ad09-52787c8a2564",
