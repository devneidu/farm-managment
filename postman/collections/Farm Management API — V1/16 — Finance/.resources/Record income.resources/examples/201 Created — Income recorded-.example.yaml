$kind: http-example
name: 201 Created — Income recorded.
request:
  url: "{{base_url}}/income"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "finance_category_id": "{{cat_other_income_id}}",
        "amount": "5000.00",
        "occurred_on": "{{today}}",
        "description": "Sale of used feed bags",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
