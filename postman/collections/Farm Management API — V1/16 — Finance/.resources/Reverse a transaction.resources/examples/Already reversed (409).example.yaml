$kind: http-example
request:
  url: "{{base_url}}/finance/transactions/{{transaction_id}}/reverse"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "reason": "Receipt belonged to another farm",
        "idempotency_key": "{{$guid}}"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "This transaction is a reversal or has already been reversed.",
        "code": "transaction_already_reversed",
        "request_id": "01a1045e-948c-7100-ad2c-229a4502bc14"
      }
order: 2000
