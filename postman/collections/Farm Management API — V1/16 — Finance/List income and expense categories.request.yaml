$kind: http-request
description: |-
  **WHAT IT DOES**
  The platform finance categories (`is_system: true`). Expense: feed, medicine_veterinary, seed_planting_material, fertilizer_agrochemical, livestock_purchase, labour, transport, utilities, equipment_repairs, general_supplies, other_expense. Income: livestock_sales, egg_sales, milk_sales, crop_sales, other_income. Filter with `direction`.

  **WHEN TO USE IT**
  Category dropdowns of the money forms.

  **IMPORTANT INPUTS**
  - Query filters: `direction`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `finance.view` (taken from the current farm context; never sent by the client).
  - Custom farm categories are not built in V1. Requires `finance.view` (Owner, Manager, Finance).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`finance.view`** — granted to: `owner`, `manager`, `finance`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/finance/categories`

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `direction` — enum. Values: `income`, `expense`

  **BUSINESS RULES**
  - Custom farm categories are not built in V1. Requires `finance.view` (Owner, Manager, Finance).

  **SUCCESS**
  `200 OK`

  `data` is an array of objects with fields: `id`, `code`, `name`, `direction`, `is_system`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `finance.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/finance/categories"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: direction
    value: ""
    disabled: true
    description: "enum: income | expense"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const row = (get(json, "data") || []).find((r) => get(r, "code") === "labour"); const v = row && get(row, "id"); if (v !== undefined && v !== null) pm.environment.set("cat_labour_id", String(v)); else console.warn("Could not capture cat_labour_id"); }
        { const row = (get(json, "data") || []).find((r) => get(r, "code") === "utilities"); const v = row && get(row, "id"); if (v !== undefined && v !== null) pm.environment.set("cat_utilities_id", String(v)); else console.warn("Could not capture cat_utilities_id"); }
        { const row = (get(json, "data") || []).find((r) => get(r, "code") === "other_income"); const v = row && get(row, "id"); if (v !== undefined && v !== null) pm.environment.set("cat_other_income_id", String(v)); else console.warn("Could not capture cat_other_income_id"); }
        { const row = (get(json, "data") || []).find((r) => get(r, "code") === "egg_sales"); const v = row && get(row, "id"); if (v !== undefined && v !== null) pm.environment.set("cat_egg_sales_id", String(v)); else console.warn("Could not capture cat_egg_sales_id"); }
        { const row = (get(json, "data") || []).find((r) => get(r, "code") === "services"); const v = row && get(row, "id"); if (v !== undefined && v !== null) pm.environment.set("cat_services_id", String(v)); else console.warn("Could not capture cat_services_id"); }
      }
    language: text/javascript
examples: ./.resources/List income and expense categories.resources/examples
order: 1000
