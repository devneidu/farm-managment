$kind: http-request
description: |-
  **WHAT IT DOES**
  The Income tab list: ONE row per sale plus one row per other money in (other income, services, grants/loans/support). A sale's individual payments are never listed; reversed manual entries and their reversals are hidden.

  **WHEN TO USE IT**
  The Income tab (there is no separate Sales page). Rows with `kind: sale` open the sale; `kind: other_income` open the transaction.

  **IMPORTANT INPUTS**
  - `money_status` (paid | part_paid | not_paid | received), `from`/`to` (farm-local days), `contact_id`, `search` (reference, buyer name, buyer phone), `finance_category_id`, `production_cycle_id`, `include_cancelled` (1/0, default 0), `page`, `per_page` (max 100).

  **IMPORTANT BEHAVIOR**
  - Newest date first, then created_at. One SQL UNION, paginated.
  - `meta.totals.money_received` = ledger income received in the from/to range, reversals subtracted (equals `GET /finance/summary` `totals.income` for the same range). `meta.totals.still_owed` = balances of ALL non-cancelled sales as of now, un-invoiced sales included (not date filtered).
  - `finance.view` sees everything. A user with only `sale.view` (Farm Worker) gets sale rows only and `meta.totals: null`. Neither permission: 403.

  **FRONTEND NOTES**
  - See `docs/api/FRONTEND-INCOME-FLOW.md`.
  - Boolean query values: send `1`/`0`.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie.

  **ACCESS**
  `finance.view` (everything) or `sale.view` (sale rows only).

  **URL**
  `GET {{base_url}}/finance/income`

  **SUCCESS**
  `200 OK` — `data` rows: `kind`, `id`, `reference`, `date`, `contact_id`, `contact_name`, `contact_phone`, `summary`, `category`, `total`, `amount_received`, `balance`, `money_status`, `links {sale, transaction}`. `meta`: `current_page`, `per_page`, `last_page`, `total`, `totals {currency, from, to, money_received, still_owed}|null`.

  **ERRORS**
  - `401 unauthenticated`, `403 forbidden` (neither finance.view nor sale.view), `422 validation_failed`.
url: "{{base_url}}/finance/income?per_page=10"
method: GET
headers:
  - key: Accept
    value: "application\/json"
  - key: Origin
    value: "{{frontend_origin}}"
    description: "Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin."
  - key: X-Farm-Id
    value: "{{farm_id}}"
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
    disabled: true
queryParams:
  - key: money_status
    value: ""
    disabled: true
    description: "enum: paid | part_paid | not_paid | received"
  - key: from
    value: ""
    disabled: true
    description: "string (date)"
  - key: to
    value: ""
    disabled: true
    description: "string (date)"
  - key: contact_id
    value: ""
    disabled: true
    description: "string (uuid)"
  - key: search
    value: ""
    disabled: true
    description: "reference, buyer name or buyer phone"
  - key: finance_category_id
    value: ""
    disabled: true
    description: "string (uuid)"
  - key: production_cycle_id
    value: ""
    disabled: true
    description: "string (uuid)"
  - key: include_cancelled
    value: ""
    disabled: true
    description: "boolean (1\/0), default 0"
  - key: page
    value: ""
    disabled: true
    description: "integer — min 1"
  - key: per_page
    value: "10"
    description: "integer — min 1, max 100"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Income list.resources/examples
order: 11000
