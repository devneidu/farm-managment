$kind: http-request
name: "Buyer: report the deal or the seller"
description: |-
  **WHAT IT DOES**
  Records a complaint in any deal state. Never changes the deal; the other party is not shown it.

  **INPUTS**
  - `target` deal|other_party
  - `reason` no_show|misrepresented_product|terms_changed|abusive_behaviour|suspected_fraud|other
  - `description` optional

  **ERRORS**
  `422`; `404`

  **BOUNDARY**
  A deal is a summary of agreed terms. Farmvest takes no payment, holds no funds, reserves no stock, delivers nothing and creates no sale. Contact appears only on the audited contact endpoints.
url: "{{base_url}}/marketplace/my/deals/{{deal_id}}/report"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "target": "other_party",
      "reason": "no_show",
      "description": "Did not show up."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.eql(201); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
    language: text/javascript
order: 10000
