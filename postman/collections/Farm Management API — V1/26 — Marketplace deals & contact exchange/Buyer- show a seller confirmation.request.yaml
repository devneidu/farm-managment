$kind: http-request
name: "Buyer: show a seller confirmation"
description: |-
  **WHAT IT DOES**
  The exact terms the seller confirmed, with `confirmable` and `expires_at`. Not an agreement; no contact.

  **INPUTS**
  none

  **ERRORS**
  `404` not yours

  **BOUNDARY**
  A deal is a summary of agreed terms. Farmvest takes no payment, holds no funds, reserves no stock, delivers nothing and creates no sale. Contact appears only on the audited contact endpoints.
url: "{{base_url}}/marketplace/my/deal-confirmations/{{confirmation_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.eql(200); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
    language: text/javascript
order: 4000
