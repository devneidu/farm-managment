description: "**Phase 25.** A lightweight deal summary. Two yeses: the BUYER confirms an offer the seller accepted, or the seller confirms a fixed-price purchase request and then the BUYER confirms the exact terms. Frozen product/unit/quantity/price/total and fulfilment terms; two-sided self-reported completion; cancellation; confidential reports (moderation is Phase 27); audited contact exchange (address only for pickup). Farmvest is NOT an escrow, payment processor or logistics provider: no payment, stock reservation, sale or delivery. Shop permissions `deal.view` (all roles) and `deal.respond` (owner, manager); platform setting `marketplace_deal_confirmation_hours` (72). Contract: `docs/api/PHASE-25-MARKETPLACE-DEALS.md`. The executable proof is **Flow 17** (folder 99); these reference requests were not run individually."
