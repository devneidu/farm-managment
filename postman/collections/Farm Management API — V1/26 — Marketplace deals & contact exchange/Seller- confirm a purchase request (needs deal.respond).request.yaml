$kind: http-request
name: "Seller: confirm a purchase request (needs deal.respond)"
description: |-
  **WHAT IT DOES**
  The seller's first step for a fixed-price "Proceed at listed price" request. Creates a confirmation only: NOT an agreement, no deal, no contact. The buyer must confirm before `expires_at`.

  **INPUTS**
  - `fulfilment_method` (required if the listing offers both)
  - `delivery_charge` optional naira, only for seller delivery on an "agreed separately" listing; omit when unknown ("To be agreed directly")

  **ERRORS**
  `409` intent_stale, intent_already_converted, confirmation_pending, quantity_unavailable, listing_unavailable, shop_not_active; `422`; `403` staff; `404`

  **BOUNDARY**
  A deal is a summary of agreed terms. Farmvest takes no payment, holds no funds, reserves no stock, delivers nothing and creates no sale. Contact appears only on the audited contact endpoints.
url: "{{base_url}}/marketplace/shops/{{shop_id}}/purchase-intents/{{intent_id}}/confirm"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fulfilment_method": "pickup"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.eql(201); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      { const v = json.data.id; if (v !== undefined && v !== null) { pm.environment.set("confirmation_id", v); } }
    language: text/javascript
order: 2000
