$kind: http-request
name: "Buyer: confirm the seller's terms (creates the deal)"
description: |-
  **WHAT IT DOES**
  The buyer confirms the seller's exact terms; this is the moment the deal exists and contact becomes available. Idempotent.

  **INPUTS**
  - `accept_terms` must be true
  - `contact_phone` optional

  **ERRORS**
  `409` confirmation_lapsed, confirmation_withdrawn, confirmation_voided, confirmation_stale, quantity_unavailable, listing_unavailable, shop_not_active; `422`; `404`

  **BOUNDARY**
  A deal is a summary of agreed terms. Farmvest takes no payment, holds no funds, reserves no stock, delivers nothing and creates no sale. Contact appears only on the audited contact endpoints.
url: "{{base_url}}/marketplace/my/deal-confirmations/{{confirmation_id}}/confirm"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "accept_terms": true,
      "contact_phone": "+2348055501234"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.eql(201); });
      const json = pm.response.json();
      pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      { const v = json.data.id; if (v !== undefined && v !== null) { pm.environment.set("deal_id", v); } }
    language: text/javascript
order: 5000
