$kind: http-request
description: |-
  **WHAT IT DOES**
  This farm's custom crop varieties, optionally filtered by `crop_type_id`.

  **WHEN TO USE IT**
  A "my custom varieties" management list.

  **IMPORTANT INPUTS**
  - Query filters: `species_id`, `crop_type_id`, `include_inactive`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `master_data.view` (taken from the current farm context; never sent by the client).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`master_data.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/custom-varieties`

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `species_id` — string, max 36 chars
  - `crop_type_id` — string, max 36 chars
  - `include_inactive` — boolean

  **VARIABLES USED**
  - `{{crop_yam_id}}` — captured by "List crops"

  **SUCCESS**
  `200 OK`

  `data` is an array of objects with fields: `id`, `crop_type_id`, `code`, `name`, `source`, `is_active`, `is_editable`, `created_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `master_data.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/custom-varieties?crop_type_id={{crop_yam_id}}"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: crop_type_id
    value: "{{crop_yam_id}}"
  - key: species_id
    value: ""
    disabled: true
    description: string — max 36 chars
  - key: include_inactive
    value: ""
    disabled: true
    description: boolean
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/List custom varieties.resources/examples
order: 15000
