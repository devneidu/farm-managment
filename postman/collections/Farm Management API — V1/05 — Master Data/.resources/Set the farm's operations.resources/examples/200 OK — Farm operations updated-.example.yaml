$kind: http-example
name: 200 OK — Farm operations updated.
request:
  url: "{{base_url}}/farm/operations"
  method: PUT
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "operation_ids": [
          "{{op_poultry_id}}",
          "{{op_crops_id}}"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "configured": true,
          "operations": [
            {
              "id": "01a1045c-d7b1-7294-b14b-133938e3f44a",
              "code": "poultry",
              "name": "Poultry",
              "category": "livestock",
              "tracking_model": "population",
              "is_active": true,
              "selected": true,
              "available": true
            },
            {
              "id": "01a1045c-d7e3-7099-82fd-dd5ca31d018d",
              "code": "crops",
              "name": "Crops",
              "category": "crop",
              "tracking_model": "planting_units",
              "is_active": true,
              "selected": true,
              "available": true
            }
          ]
        },
        "meta": {},
        "message": "Farm operations updated."
      }
order: 1000
