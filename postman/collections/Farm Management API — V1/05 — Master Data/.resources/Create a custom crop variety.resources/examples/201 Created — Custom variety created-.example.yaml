$kind: http-example
name: 201 Created — Custom variety created.
request:
  url: "{{base_url}}/custom-varieties"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Content-Type
      value: application/json
    - key: X-Farm-Id
      value: "{{farm_id}}"
      disabled: true
      description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
  body:
    type: json
    content: |-
      {
        "crop_type_id": "{{crop_yam_id}}",
        "name": "Pona (white yam)"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "01a1045e-45a9-73e2-b37a-592fa0640aa9",
          "crop_type_id": "01a1045c-d836-73a8-8e28-0ccc276424e2",
          "code": null,
          "name": "Pona (white yam)",
          "source": "farm",
          "is_active": null,
          "is_editable": true,
          "created_at": "2026-10-04T00:45:08+00:00"
        },
        "meta": {},
        "message": "Custom variety created."
      }
order: 1000
