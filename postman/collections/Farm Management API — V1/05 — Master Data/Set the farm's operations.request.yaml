$kind: http-request
description: |-
  **WHAT IT DOES**
  Replaces the farm's operation selection (an empty array clears it). Once set, `available=true` filters narrow the species/crop lists; unfiltered lists still return everything and nothing is blocked.

  **WHEN TO USE IT**
  Saving the farm operations preference.

  **IMPORTANT INPUTS**
  - Required body fields: `operation_ids`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `farm.update` (taken from the current farm context; never sent by the client).
  - Changing the selection only affects selector/dashboard relevance (`available` filters); it never blocks creating a cycle.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`farm.update`** — granted to: `owner`, `manager`. (Documentation only: the request never contains a permission string.)

  **URL**
  `PUT {{base_url}}/farm/operations`

  **REQUEST BODY** (`application/json`)
  - `operation_ids` — array, **required**, max 50 items. The full desired selection; an empty list clears it (farm becomes unconfigured again).

  **VARIABLES USED**
  - `{{op_poultry_id}}` — captured by "List farm operations (production types)"
  - `{{op_crops_id}}` — captured by "List farm operations (production types)"

  **BUSINESS RULES**
  - Requires `farm.update`. Unknown, inactive or duplicate ids are `422`.

  **SUCCESS**
  `200 OK` — message: "Farm operations updated."

  `data` fields: `configured`, `operations`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `farm.update`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
url: "{{base_url}}/farm/operations"
method: PUT
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "operation_ids": [
        "{{op_poultry_id}}",
        "{{op_crops_id}}"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Set the farm's operations.resources/examples
order: 17000
