$kind: http-request
description: |-
  **WHAT IT DOES**
  Breed dropdown: system breeds plus THIS farm's custom breeds, active only. `source` is `system` or `farm`.

  **WHEN TO USE IT**
  Breed dropdown of the livestock batch form.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{species_chicken_id}}`.
  - Query filters: `operation`, `category`, `group`, `available`, `include_inactive`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `master_data.view` (taken from the current farm context; never sent by the client).
  - The list holds the active system breeds seeded for the species (for example Chicken: Cobb 500, Ross 308, ISA Brown) plus the farm's own custom breeds. For batch creation prefer `GET /master/species/{species}/batch-reference`, which also returns the purposes, growth stages and the `breed_field_label`.
  - `include_inactive=true` includes deactivated breeds so historical records can be labelled.

  **WHAT TO DO NEXT**
  Offer "+ Add custom breed" (`POST /custom-breeds`) if allowed.

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.
  - Boolean query values: send `1`/`0` (`true`/`false` is rejected on most endpoints).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`master_data.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/master/species/{{species_chicken_id}}/breeds`

  **PATH PARAMETERS**
  - `{{species_chicken_id}}` — UUID. Captured by "List species" (05 — Master Data) or from the list endpoint of this resource.

  **QUERY PARAMETERS** (all optional unless marked required; booleans as `1`/`0`)
  - `operation` — string, max 64 chars
  - `category` — enum. Values: `livestock`, `aquaculture`, `crop`
  - `group` — enum. Values: `poultry`, `small_ruminants`, `large_ruminants`, `non_ruminant_mammals`, `equines`, `micro_livestock`
  - `available` — boolean
  - `include_inactive` — boolean

  **VARIABLES USED**
  - `{{species_chicken_id}}` — captured by "List species"

  **BUSINESS RULES**
  - The catalogue ships no system breeds yet, so the list starts empty and fills with the farm's custom breeds.
  - `include_inactive=true` includes deactivated breeds so historical records can be labelled.

  **SUCCESS**
  `200 OK`

  `data` is an array of items (empty in the saved example).

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `master_data.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
url: "{{base_url}}/master/species/{{species_chicken_id}}/breeds"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
queryParams:
  - key: operation
    value: ""
    disabled: true
    description: string — max 64 chars
  - key: category
    value: ""
    disabled: true
    description: "enum: livestock | aquaculture | crop"
  - key: group
    value: ""
    disabled: true
    description: "enum: poultry | small_ruminants | large_ruminants | non_ruminant_mammals | equines | micro_livestock"
  - key: available
    value: ""
    disabled: true
    description: boolean
  - key: include_inactive
    value: ""
    disabled: true
    description: boolean
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/List breeds of a species.resources/examples
order: 5000
