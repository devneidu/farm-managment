$kind: http-request
description: |-
  **WHAT IT DOES**
  Rename, deactivate (`is_active:false`) or reactivate a custom breed. There is no delete.

  **WHEN TO USE IT**
  Renaming or deactivating a custom breed in settings.

  **IMPORTANT INPUTS**
  - Path ids (UUIDv7): `{{breed_id}}`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `master_data.manage` (taken from the current farm context; never sent by the client).
  - System breeds and other farms' breeds are `404`, never editable.
  - Sending `farm_id`, `code` or `species_id` is `422`.
  - Only `name` and `is_active` can change. Duplicate names are `409 duplicate_name`.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Route by the UUIDv7 `id`; any `reference` code (`BAT-2026-00001`, ...) is display-only.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`master_data.manage`** — granted to: `owner`, `manager`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `master-data-write`: 60 per hour per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `PATCH {{base_url}}/custom-breeds/{{breed_id}}`

  **PATH PARAMETERS**
  - `{{breed_id}}` — UUID. Captured by "Create a custom breed" (05 — Master Data) or from the list endpoint of this resource.

  **REQUEST BODY** (`application/json`)
  - `name` — string, optional, max 100 chars, min 2 chars, pattern `^[\p{L}\p{N}][\p{L}\p{N} .,'()\/&-]*$`
  - `is_active` — boolean, optional

  Server-owned fields — NOT accepted, sending any of them is a `422`: `farm_id`, `species_id`, `code`.

  **VARIABLES USED**
  - `{{breed_id}}` — captured by "Create a custom breed"

  **BUSINESS RULES**
  - System breeds and other farms' breeds are `404`, never editable.
  - Sending `farm_id`, `code` or `species_id` is `422`.
  - Only `name` and `is_active` can change. Duplicate names are `409 duplicate_name`.
  - Requires `master_data.manage`.

  **SUCCESS**
  `200 OK` — message: "Custom breed updated."

  `data` fields: `id`, `species_id`, `code`, `name`, `source`, `is_active`, `is_editable`, `created_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `master_data.manage`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `404 not_found` — unknown id, or an id that belongs to another farm (never distinguishable).
  - `409` — A breed with this name already exists.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/custom-breeds/{{breed_id}}"
method: PATCH
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "name": "{{custom_breed_name}} (renamed)"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Rename or deactivate a custom breed.resources/examples
order: 11000
