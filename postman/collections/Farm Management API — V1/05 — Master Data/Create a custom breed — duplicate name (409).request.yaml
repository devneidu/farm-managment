$kind: http-request
description: |-
  **WHAT IT DOES**
  Posts the name that "Create a custom breed" just created again and asserts the backend's conflict.

  **IMPORTANT BEHAVIOR**
  - `409 duplicate_name` (case/space-insensitive, against system and farm breeds of the same species) with `details {existing_id, source, is_active}`.
  - `details.existing_id` is the breed created by the previous request: reuse it (or reactivate it when `is_active` is false) instead of creating another.
  - Run it straight after "Create a custom breed".
url: "{{base_url}}/custom-breeds"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "species_id": "{{species_chicken_id}}",
      "name": "{{custom_breed_name}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", function () { pm.expect(pm.response.code).to.eql(409); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      pm.test("duplicate_name conflict points at the breed created by the previous request", function () { const json = pm.response.json(); pm.expect(json.code).to.eql("duplicate_name"); pm.expect(json.details.existing_id).to.eql(pm.environment.get("breed_id")); pm.expect(json.details.source).to.eql("farm"); pm.expect(json.details.is_active).to.eql(true); });
    language: text/javascript
examples: ./.resources/Create a custom breed — duplicate name (409).resources/examples
order: 10000
