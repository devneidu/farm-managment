$kind: http-request
description: |-
  **WHAT IT DOES**
  Adds a farm-specific breed to a species ("+ Add custom breed"). Use the returned `id` as `breed_id` when starting a livestock batch.

  **WHEN TO USE IT**
  "+ Add custom breed" inside the livestock batch form.

  **IMPORTANT INPUTS**
  - Required body fields: `species_id`, `name`.

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `master_data.manage` (taken from the current farm context; never sent by the client).
  - Duplicate (case/space-insensitive) against system and farm breeds of the same species: `409 duplicate_name` with `details {existing_id, source, is_active}` - reuse or reactivate that id.
  - Farm and species come from the session/body and can never change later.

  **TEST DATA**
  The collection names the breed `{{custom_breed_name}}` (set by the pre-request script: `Isa Brown (Ibadan strain) <timestamp>`), so the request is repeatable and never collides with the breed Flow S created. The next request, "Create a custom breed — duplicate name (409)", posts the same name again and asserts the conflict.

  **WHAT TO DO NEXT**
  Use the returned `id` as `breed_id`.

  **FRONTEND NOTES**
  - Cookie session + CSRF: send `X-XSRF-TOKEN` and a stateful `Origin` (the collection script does it; call `GET /auth/csrf-cookie` first).
  - Derived numbers (population, stock, outstanding, totals) are authoritative on the server: refetch the affected resource and the dashboard after saving.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`). State-changing: needs the `X-XSRF-TOKEN` header and a stateful `Origin` (the collection script adds both).

  **ACCESS**
  Required backend farm permission: **`master_data.manage`** — granted to: `owner`, `manager`. (Documentation only: the request never contains a permission string.)
  Rate limited by limiter `master-data-write`: 60 per hour per user (`429 too_many_requests` + `Retry-After`).

  **URL**
  `POST {{base_url}}/custom-breeds`

  **REQUEST BODY** (`application/json`)
  - `species_id` — string, **required**
  - `name` — string, **required**, max 100 chars, min 2 chars, pattern `^[\p{L}\p{N}][\p{L}\p{N} .,'()\/&-]*$`

  Server-owned fields — NOT accepted, sending any of them is a `422`: `farm_id`, `code`.

  **VARIABLES USED**
  - `{{species_chicken_id}}` — captured by "List species"

  **BUSINESS RULES**
  - Requires `master_data.manage` (Owner, Manager). Names are 2-100 characters after trimming.
  - Duplicate (case/space-insensitive) against system and farm breeds of the same species: `409 duplicate_name` with `details {existing_id, source, is_active}` - reuse or reactivate that id.
  - Farm and species come from the session/body and can never change later.

  **SUCCESS**
  `201 Created` — message: "Custom breed created."

  `data` fields: `id`, `species_id`, `code`, `name`, `source`, `is_active`, `is_editable`, `created_at`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `master_data.manage`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
  - `409` — A breed with this name already exists.
  - `422 validation_failed` — `errors` is keyed by field (nested keys like `details.quantity`); some domain rules return a specific `code` (for example measurement errors).
  - `419 session_expired` — missing/expired CSRF token: call "Initialise CSRF cookie" and retry once.
  - `429 too_many_requests` — honour `Retry-After`.
url: "{{base_url}}/custom-breeds"
method: POST
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-XSRF-TOKEN
    value: "{{xsrf_token}}"
    description: CSRF token. Filled automatically from the XSRF-TOKEN cookie by the collection pre-request script.
  - key: Content-Type
    value: application/json
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
body:
  type: json
  content: |-
    {
      "species_id": "{{species_chicken_id}}",
      "name": "{{custom_breed_name}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", function () { pm.expect(pm.response.code).to.be.oneOf([201]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
        const get = (o, p) => p.split(".").reduce((a, k) => (a === undefined || a === null ? undefined : a[k]), o);
        { const v = get(json, "data.id"); if (v !== undefined && v !== null) pm.environment.set("breed_id", String(v)); else console.warn("Could not capture breed_id from data.id"); }
      }
    language: text/javascript
  - type: beforeRequest
    code: |-
      // Unique per run: Flow S already created "Isa Brown (Ibadan strain)", and a repeated name is (correctly) a 409. The duplicate rule has its own request below.
      pm.environment.set("custom_breed_name", "Isa Brown (Ibadan strain) " + pm.variables.replaceIn("{{$timestamp}}"));
    language: text/javascript
examples: ./.resources/Create a custom breed.resources/examples
order: 9000
