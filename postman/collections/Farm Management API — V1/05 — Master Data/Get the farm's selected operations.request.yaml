$kind: http-request
description: |-
  **WHAT IT DOES**
  Returns `{configured, operations[]}`. A farm with no selection is "unconfigured" and every operation counts as available.

  **WHEN TO USE IT**
  Farm operations preference screen.

  **IMPORTANT INPUTS**
  - None (no body or query parameters are required).

  **IMPORTANT BEHAVIOR**
  - Requires the farm permission `farm.view` (taken from the current farm context; never sent by the client).

  **FRONTEND NOTES**
  - Needs the signed-in session cookie (send requests with credentials).
  - Permissions come from the current farm context (`GET /farm` → `membership.permissions`); optional `X-Farm-Id` selects another farm you belong to.

  ---
  **REFERENCE (detail)**

  **AUTHENTICATION**
  **Required** — Sanctum session cookie. The user must be verified, onboarded and an ACTIVE member of the current farm (oldest active membership, or `X-Farm-Id`).

  **ACCESS**
  Required backend farm permission: **`farm.view`** — granted to: `owner`, `manager`, `farm_worker`, `finance`, `vet`. (Documentation only: the request never contains a permission string.)

  **URL**
  `GET {{base_url}}/farm/operations`

  **BUSINESS RULES**
  - Requires `farm.view`. This is an optional preference, never part of onboarding.

  **SUCCESS**
  `200 OK`

  `data` fields: `configured`, `operations`.

  **ERRORS**
  - `401 unauthenticated` — no valid session: show the login screen.
  - `403` — `forbidden` when the caller lacks `farm.view`; other codes: `account_suspended`, `email_verification_required`, `onboarding_required`, `no_active_farm`, `farm_access_denied`.
url: "{{base_url}}/farm/operations"
method: GET
headers:
  - key: Accept
    value: application/json
  - key: Origin
    value: "{{frontend_origin}}"
    description: Stateful frontend origin (Sanctum). Set by the environment variable frontend_origin.
  - key: X-Farm-Id
    value: "{{farm_id}}"
    disabled: true
    description: "Optional: select one of the farms you actively belong to. Omit to use your oldest active membership."
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", function () { pm.expect(pm.response.code).to.be.oneOf([200]); });
      const isJson = (pm.response.headers.get("Content-Type") || "").includes("json");
      if (isJson && pm.response.code >= 200 && pm.response.code < 300) {
        const json = pm.response.json();
        pm.test("Standard success envelope", function () { pm.expect(json).to.have.property("data"); pm.expect(json).to.have.property("meta"); });
      }
    language: text/javascript
examples: ./.resources/Get the farm's selected operations.resources/examples
order: 16000
